<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Fish School (Boids) – v6</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      overscroll-behavior: none; /* EN: Prevent rubber-band scrolling */
    }

    canvas {
    display: block;
    touch-action: none;           /* EN: Disable browser pan/zoom gestures on the canvas */
    -webkit-user-select: none;
    user-select: none;
    }

    /* Simple mobile HUD overlay */
#hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      padding: 16px 18px 24px 18px;
      border-radius: 18px 18px 0 0;

      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      transform: translateY(85%);
      transition: transform 0.35s cubic-bezier(.25,.8,.25,1);

      z-index: 10000;
    

      color: rgba(255,255,255,0.85);
      font: 13px/1.25 -apple-system, system-ui, sans-serif;
    }
    #hud .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    #hud label {
      width: 140px;
      opacity: 0.65;
    }

    #hud input[type=range] {
      flex: 1;
    }

    #hud span {
      width: 48px;
      text-align: right;
      opacity: 0.9;
    }

    #hud button {
      flex: 1;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      color: #aeadad;
    }
    #hud {
      transition: opacity 620ms ease, transform 620ms ease;
    }

    #hud.is-open {
      transform: translateY(0%);
    }
    #hudToggle {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      padding: 12px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.85);

      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);

      z-index: 10001;
    }
      #hudToggle:active {
        opacity: 0.85;
      }

      @media (max-width: 520px), (max-height: 740px) {
        #hud {
          padding: 8px 10px;
          font: 12px/1.15 -apple-system, system-ui, sans-serif;
          background: rgba(0,0,0,0.10);
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }
        #hud label { width: 120px; }
        #hud span  { width: 42px; font-size: 12px; }
        #hud button { padding: 8px 10px; font-size: 12px; }
        #hudToggle { font-size: 9.5px; opacity: 0.50; }
      }

      /* ---------- Slider: neutral gray style ---------- */

    #hud input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.20);   /* track gray */
      border-radius: 3px;
      outline: none;
    }

    /* WebKit track */
    #hud input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      background: rgba(255,255,255,0.18);
      border-radius: 3px;
    }

    /* WebKit thumb */
    #hud input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(200,200,200,0.85);  /* neutral gray knob */
      border: none;
      margin-top: -5px; /* center thumb vertically */
    }

    /* Firefox track */
    #hud input[type=range]::-moz-range-track {
      height: 4px;
      background: rgba(255,255,255,0.18);
      border-radius: 3px;
    }

    /* Firefox thumb */
    #hud input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(200,200,200,0.85);
      border: none;
    }
  
    /* Top version bar (always visible) */
    #versionBar{
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.10);
      color: rgba(220,220,220,0.95);
      font: 12px/1.2 -apple-system, system-ui, sans-serif;
      letter-spacing: 0.25px;
      text-align: center;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 10002; /* above HUD toggle */
      pointer-events: none; /* EN: allow clicks to pass through to canvas/HUD */
    }
  </style>
</head>

<body>
  <div id="versionBar">Fish School v6 – Calm Target Lock (Smooth Turns)</div>
    <div id="hud">
      <div style="
        font-weight:600;
        font-size:15px;
        margin-bottom:8px;
        opacity:0.9;
      ">
        Controls
      </div>

    <div class="row">
      <label>View zoom</label>
      <input id="viewZoom" type="range" min="0.80" max="2.20" step="0.01" value="1.00">
      <span id="viewZoomVal">1.00</span>
    </div>

      <div class="row">
      <label>Solo independence</label>
      <input id="soloInd" type="range" min="0" max="1" step="0.01" value="0.70">
      <span id="soloIndVal">0.70</span>
    </div>
    <div class="row">
      <label>Density</label>
      <input id="density" type="range" min="0" max="2" step="0.01" value="1.10">
      <span id="densityVal">1.10</span>
    </div>
    <div class="row">
      <label>Target speed</label>
      <input id="targetSpeed" type="range" min="0" max="4" step="0.05" value="1.8">
      <span id="targetSpeedVal">1.80</span>
    </div>

    <div class="row">
      <label>Reaction lag (s)</label>
      <input id="reactionLag" type="range" min="0" max="2.80" step="0.1" value="0.88">
      <span id="reactionLagVal">0.88</span>
    </div>
    <div class="row">
      <button id="scatter">Scatter 30%</button>
      <button id="regroup">Regroup</button>
    </div>
    <div style="
      margin-top:14px;
      font-size:11px;
      opacity:0.5;
      text-align:center;
    ">
      2026 Jukka Linjama · CC BY 4.0
    </div>

  </div>
    <div id="hudToggle">
      Controls
    </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ---------- Utilities ----------
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;

    function randomUnitVec3(out) {
      // Random direction on sphere
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      out.set(
        Math.sin(phi) * Math.cos(theta),
        Math.sin(phi) * Math.sin(theta),
        Math.cos(phi)
      );
      return out;
    }

    function setMag(v, m) {
      const len = v.length();
      if (len > 1e-6) v.multiplyScalar(m / len);
      return v;
    }

    function clampLen(v, maxLen) {
      const len = v.length();
      if (len > maxLen && len > 1e-6) v.multiplyScalar(maxLen / len);
      return v;


    // EN: Reusable scratch objects for turn-rate limiting (avoid per-frame allocations).
    const _rotAxis = new THREE.Vector3();
    const _rotQuat = new THREE.Quaternion();

    function rotateDirToward(currentDir, targetDir, maxAngleRad, outDir) {
      // EN: Rotate currentDir toward targetDir by at most maxAngleRad (both assumed normalized).
      // EN: Used for "swim-like" arcs when a fish focuses near the camera.
      outDir.copy(currentDir);

      const dot = clamp(currentDir.dot(targetDir), -1, 1);
      const angle = Math.acos(dot);
      if (angle < 1e-6) return outDir;

      const step = Math.min(maxAngleRad, angle);

      _rotAxis.copy(currentDir).cross(targetDir);
      const axisLen = _rotAxis.length();
      if (axisLen < 1e-6) return outDir; // parallel / anti-parallel

      _rotAxis.multiplyScalar(1 / axisLen);
      _rotQuat.setFromAxisAngle(_rotAxis, step);

      outDir.applyQuaternion(_rotQuat).normalize();
      return outDir;
    }
    }

    // ---------- Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b1020, 8, 80); // temporary, will be driven by params later

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

    const lightA = new THREE.HemisphereLight(0xffffff, 0x223355, 0.9);
    scene.add(lightA);

    const lightB = new THREE.DirectionalLight(0xffffff, 0.8);
    lightB.position.set(8, 18, 10);
    scene.add(lightB);

    // EN: World coordinate axes at origin (X=red, Y=green, Z=blue)
      const worldAxes = new THREE.AxesHelper(4);
      scene.add(worldAxes);

// Moving point lights for "living gloss" (no shadows)
const keyLight = new THREE.PointLight(0xffffff, 1.1, 80);
const fillLight = new THREE.PointLight(0x88ccff, 0.7, 80);
scene.add(keyLight);
scene.add(fillLight);

function animateLights(ms) {
  // Move lights in slow circles to create shifting highlights on the fish bodies
  const t = ms * 0.001;
  keyLight.position.set(Math.cos(t) * 12, 6, Math.sin(t) * 12);
  fillLight.position.set(Math.cos(t * 0.7) * -10, -4, Math.sin(t * 0.7) * 10);
}

// Fish geometry: body = flattened ellipsoid, tail = cone
// EN: SphereGeometry becomes an ellipsoid via mesh scaling (see body.scale below).
const bodyGeom = new THREE.SphereGeometry(0.42, 14, 10);
const tailGeom = new THREE.ConeGeometry(0.18, 0.45, 8);

// EN: Tail will be positioned along local -Z (back) per the new axis convention.
// Materials: body color changes by mode; tail stays "exhaust" color
// Use StandardMaterial so lights create moving specular highlights (no shadows).
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xcfe9ff,
  roughness: 0.22,
  metalness: 0.05,
});

const tailMat = new THREE.MeshStandardMaterial({
  color: 0xffb36b,
  roughness: 0.45,
  metalness: 0.0,
  emissive: 0xff5a00,
  emissiveIntensity: 0.9,
});


// --- Face details (eyes + mouth) ---
// EN: One "eye bar" ellipsoid that passes through the body along local X,
// so it reads as two eyes with a single mesh (cheap and stable).
const eyeBarGeom = new THREE.SphereGeometry(0.18, 12, 10);

const eyeBarMat = new THREE.MeshStandardMaterial({
  color: 0x1f6bff, // EN: Bright blue for debugging placement
  roughness: 0.25,
  metalness: 0.05,
  emissive: 0x0a1a40,
  emissiveIntensity: 0.35,
});

// EN: Simple mouth as a small torus ring. Swap to Sphere/Circle later if desired.
const mouthGeom = new THREE.TorusGeometry(0.15, 0.05, 10, 18);
  //mouth.scale.set(1.0, 1.0, 0.45); // EN: flatten along local Z
const mouthMat = new THREE.MeshStandardMaterial({
  color: 0x1f6bff, // EN: Bright blue for debugging placement
  roughness: 0.30,
  metalness: 0.0,
  emissive: 0x0a1a40,
  emissiveIntensity: 0.25,
});

const N = 30;
const N_B = 0; // EN: Secondary school fish count (0 = path/leader only)
    const COLOR_SCHOOL = new THREE.Color("#cfe9ff");
  // EN: Dark green for solo fish
  const COLOR_SOLO = new THREE.Color("#2c7a3f");

    // For N=30, separate objects are simplest and reliable on mobile.
// Each fish is a Group: [0]=body, [1]=tail.
const fishMeshes = [];
const fishBodies = [];
const fishTails = [];
const fishEyeBars = [];
const fishMouths = [];
  // EN: Debug arrow to visualize velocity direction for fish #0
  let debugArrow = null;

  for (let i = 0; i < N; i++) {
    const body = new THREE.Mesh(bodyGeom, bodyMat.clone());
    const tail = new THREE.Mesh(tailGeom, tailMat.clone());

    // EN: Align tail cone axis (default +Y) to local +Z (forward) and place it behind the body.
    tail.rotation.x = Math.PI / 2;
    tail.position.set(0, 0, -0.75);
    // EN: Ellipsoid proportions (local axes): X=width (right), Y=thickness (up), Z=length (forward).
    body.scale.set(0.35, 0.72, 1.25);
// --- Face details must be CREATED before adding to modelFix ---
    const eyeBar = new THREE.Mesh(eyeBarGeom, eyeBarMat.clone());
    // EN: Eye bar must be centered on X so it reads as two symmetric eyes.
    eyeBar.scale.set(1.0, 0.35, 0.35);     // EN: wider across local X (left-right)
    eyeBar.position.set(0.00, 0.12, 0.25);  // EN: centered in local X
eyeBar.userData.baseScale = eyeBar.scale.clone();

    const mouth = new THREE.Mesh(mouthGeom, mouthMat.clone());
    mouth.position.set(0.0, -0.02, 0.55);
    mouth.userData.baseScale = new THREE.Vector3(0.50, 0.93, 1.0);
    mouth.scale.copy(mouth.userData.baseScale);

    const fish = new THREE.Group();

    // EN: Model wrapper (no axis fix needed in v5.9):
    // EN: Local axes match world convention: +X=right, +Y=up, +Z=forward.
    const modelFix = new THREE.Group();
fish.add(modelFix);

    // Add meshes to modelFix (NOT to fish)
    modelFix.add(body);
    modelFix.add(tail);
    modelFix.add(eyeBar);
    modelFix.add(mouth);

    if (i === 0) {
      // EN: DEBUG: show LOCAL axes after modelFix so we see the sim-aligned model axes.
      const localAxes = new THREE.AxesHelper(1.6);
      modelFix.add(localAxes);
    }

    scene.add(fish);

    fishMeshes.push(fish);
    fishBodies.push(body);
    fishTails.push(tail);
    fishEyeBars.push(eyeBar);
    fishMouths.push(mouth);
  }

    // ---------- Simulation data (arrays) ----------
    const P = Array.from({ length: N }, () => new THREE.Vector3());
    const V = Array.from({ length: N }, () => new THREE.Vector3());
    // EN: Stable per-fish right axis to avoid roll flips when moving near worldUp.
    const rightPrev = Array.from({ length: N }, () => new THREE.Vector3(1, 0, 0));

    // Acceleration-based visuals (tail thrust + banking)
    // English comments for open-source continuity.
    const Vprev = Array.from({ length: N }, () => new THREE.Vector3());
    const aForwardSm = new Float32Array(N); // signed forward acceleration (smoothed)
    const aLateralSm = new Float32Array(N); // signed lateral acceleration (smoothed)
    const noise = Array.from({ length: N }, () => new THREE.Vector3());
    const noiseTarget = Array.from({ length: N }, () => new THREE.Vector3());
    // EN: Per-fish steering lag (reaction time). We smooth desired velocity to avoid synchronized turns.
    const desiredSm = Array.from({ length: N }, () => new THREE.Vector3());
    const reactionTau = new Float32Array(N); // seconds

    const isSolo = new Uint8Array(N);
    const flock = new Float32Array(N);
    const flockTarget = new Float32Array(N);

    // ---------- Parameters (tuned for calm fish school) ----------
    const params = {
      // --- Debug fish (fish #0 follows a scripted path for eye/mouth debugging) ---
      debugFish0Enabled: false,
      debugFish0Radius: 6.0,
      debugFish0Speed: 0.15,    // cycles per second
      debugFish0Z: 19.8,
      debugFish0YOffset: 2.0,


      // --- Interaction: Focus debug fish near camera ---
      // EN: When triggered, fish #0 approaches a camera-relative anchor, holds briefly, then returns to its scripted debug motion.
      focusHoldSec: 5.0,
      focusReleaseSec: 1.2,
      focusAnchorDistance: 3.6, // EN: distance in front of camera along view direction
      focusArriveRadius: 0.15,
      focusMaxSpeed: 9.0,
      focusMaxTurnRate: 5.6, // EN: rad/s, limits how fast the fish can turn during focus (swim-like arcs)
      focusVelTau: 0.16, // EN: velocity smoothing time constant (seconds)

      // EN: Base camera distance without HUD compensation.
      baseCamZ: 22,     // EN: Manual zoom-out multiplier (UI). 1 = default.
      viewZoom: 1.00,   // EN: Fog baselines (tuned for baseCamZ). We'll scale them with zoom distance.
      fogNear0: 8,
      fogFar0: 60,

      density: 1.10,
      soloIndependence: 0.70,
      // EN: Max extra flow boost for solo fish. Applied more when flock[i] is low (more independent).
      soloFlowBoostMax: 1.2,

      // Base boids
      neighborRadius: 6.5,
      separationRadius: 1.6,
      wAlignment: 1.0,
      wCohesion: 1.1,
      wSeparation: 0.4,

      // Motion limits (calm)
      maxSpeed: 3.9,   // units/s
      minSpeed: 0.6,   // units/s
      maxSteer: 3.6,   // units/s^2

      // Path following (random smooth closed curve in XY, drawn on screen)
      center: new THREE.Vector3(0, 0, 0),
      pathRadius: 7.0,       // average radius of the curve
      pathJitter: 2.2,       // randomness of the curve control points
      pathZAmplitude: 6.0,  // Z range of the curve (set 0 for flat XY)
      pathControlPoints: 9,  // number of control points for the closed curve
      pathSamples: 240,      // polyline samples used for nearest-point lookup + drawing
      pathSpeed: 1.55,       // initial "flow" speed along the curve
      pathAttractK: 0.35,    // pull strength toward the curve (tune 0.2..1.2)

      // Path leader (single moving target along the curve)
      pathLeaderSpeed: 1.8,  // world units / second along the curve
      pathLeaderU: 0.0,      // 0..1 start phase on the curve
      showPathLeader: true,  // draw a small marker for debugging


      // ---------- Secondary school/path (B) ----------
      // EN: School B can run with N=0 (no fish) while its path/leader still animates.
      pathRadiusB: 0.3,
      pathJitterB: 0.8,
      pathZAmplitudeB: 1.0,
      pathCenterXB: 0.0,
      pathCenterYB: 0.0,
      pathCenterZB: 20.0,      // EN: move Path B closer to camera (+Z)

      pathControlPointsB: 5,
      pathSamplesB: 200,
      pathSpeedB: 1.25,          // EN: flow direction reference (if fish are added later)
      pathAttractKB: 0.30,       // EN: (unused when N=0) pull strength toward B corridor
      pathLeaderSpeedB: 0.52,     // EN: world units / second along curve B
      pathLeaderUB: 0.35,
      showPathLeaderB: true,
      showPathB: true,
      testFishUsePathB: true, // EN: if true, fish #0 follows Path B instead of Path A


      // EN: Average reaction lag (seconds). 0 = instant response.
      reactionLag: 0.18,
      // EN: Individual variation around the mean (0..1). Keep fixed unless you want another slider.
      reactionJitter: 0.60,

      // Noise (smoothed)
      noiseStrength: 0.55,
      noiseLerp: 0.03,

      // Thickness in Z (school is a ribbon / tube)
      zWanderK: 0.25, // gentle pull to z ~ 0

      // EN: HUD auto-hide delay after last interaction.
      hudHideDelayMs: 1900,
    };

    // ---------- Interaction / Command state ----------
    // EN: Minimal proto-command system: one focus command for the debug fish (#0).
    const focusState = {
      active: false,
      phase: "idle",          // "idle" | "approach" | "hold" | "release"
      holdLeft: 0,
      releaseLeft: 0,
    };



    // EN: Camera setup must happen after params initialization.
      camera.position.set(0, 0, params.baseCamZ);
      camera.lookAt(0, 0, 0);
      updateCameraForHud();

    // ---------- Random path (Catmull-Rom) ----------
    // We replace the old circular orbit with a random smooth closed curve.
    // The curve is sampled into a polyline so each fish can "lock on" to the nearest sample
    // (fast, stable, and good enough visually for N=30).
    let pathCurve = null;
    let pathSamplePts = [];     // Vector3[]
    let pathSampleTans = [];    // Vector3[]
    let pathLine = null;        // THREE.Line

    // Leader point state (single target that moves along the curve)
    // EN: Using a persistent curve parameter prevents snapping when the curve self-intersects.
    let pathLeaderU = 0.0;          // 0..1
    let pathApproxLength = 1.0;     // approximate curve length in world units
    let pathLeaderMarker = null;    // optional visible marker (THREE.Mesh)


    // ---------- Secondary path (B) ----------
    let pathCurveB = null;
    let pathSamplePtsB = [];
    let pathSampleTansB = [];
    let pathLineB = null;
    let pathLeaderUB = 0.0;
    let pathApproxLengthB = 1.0;
    let pathLeaderMarkerB = null;

    function buildRandomClosedCurve() {
      const pts = [];
      const M = Math.max(4, Math.floor(params.pathControlPoints || 8));
      const R = params.pathRadius;
      const J = params.pathJitter;
      const Z = params.pathZAmplitude || 0;

      for (let k = 0; k < M; k++) {
        const a = (k / M) * Math.PI * 2;
        // Jittered radius gives a "random" loop but keeps it roughly centered.
        const r = R + (Math.random() * 2 - 1) * J;
        const z = (Math.random() * 2 - 1) * Z;
        pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, z));
      }

      // Closed Catmull-Rom spline in XYZ (Z controlled by pathZAmplitude)
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.5);
    }

    function rebuildPath() {
      pathCurve = buildRandomClosedCurve();

      // Sample points + tangents for nearest-point lookup and for drawing the path line
      const S = Math.max(60, Math.floor(params.pathSamples || 200));
      pathSamplePts = new Array(S);
      pathSampleTans = new Array(S);

      for (let i = 0; i < S; i++) {
        const u = i / S;
        pathSamplePts[i] = pathCurve.getPointAt(u);
        pathSampleTans[i] = pathCurve.getTangentAt(u).normalize();
      }
      // Approximate curve length from samples (closed loop)
      // EN: Used to advance the leader at roughly constant world speed.
      pathApproxLength = 0;
      for (let i = 0; i < pathSamplePts.length; i++) {
        const a = pathSamplePts[i];
        const b = pathSamplePts[(i + 1) % pathSamplePts.length];
        pathApproxLength += a.distanceTo(b);
      }
      pathApproxLength = Math.max(pathApproxLength, 1);



      // Draw path as a thin line
      const geom = new THREE.BufferGeometry().setFromPoints(pathSamplePts.concat([pathSamplePts[0].clone()]));
      const mat = new THREE.LineBasicMaterial({
        color: 0x6aa7ff,
        transparent: true,
        opacity: 0.75,
        depthTest: false,
        depthWrite: false,
      });

      if (pathLine) {
        scene.remove(pathLine);
        pathLine.geometry.dispose();
        pathLine.material.dispose();
      }

      pathLine = new THREE.Line(geom, mat);
      pathLine.frustumCulled = false;
      scene.add(pathLine);
      // Keep the guide path visible on top of fish and fog.
      pathLine.renderOrder = 9999;
    }


    // ---------- Path B (secondary) ----------
    function buildRandomClosedCurveB() {
      const pts = [];
      const M = Math.max(4, Math.floor(params.pathControlPointsB || 8));
      const R = params.pathRadiusB;
      const J = params.pathJitterB;
      const Z = params.pathZAmplitudeB || 0;

      for (let k = 0; k < M; k++) {
        const a = (k / M) * Math.PI * 2;
        const r = R + (Math.random() * 2 - 1) * J;
        const z = (Math.random() * 2 - 1) * Z;
        pts.push(new THREE.Vector3(
          params.pathCenterXB + Math.cos(a) * r,
          params.pathCenterYB + Math.sin(a) * r,
          params.pathCenterZB + z
        )); // EN: Path B center offset in world space
      }
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.5);
    }

    function rebuildPathB() {
      pathCurveB = buildRandomClosedCurveB();

      const S = Math.max(60, Math.floor(params.pathSamplesB || 200));
      pathSamplePtsB = new Array(S);
      pathSampleTansB = new Array(S);

      for (let i = 0; i < S; i++) {
        const u = i / S;
        pathSamplePtsB[i] = pathCurveB.getPointAt(u);
        pathSampleTansB[i] = pathCurveB.getTangentAt(u).normalize();
      }

      // Approx length
      pathApproxLengthB = 0;
      for (let i = 0; i < pathSamplePtsB.length; i++) {
        const a = pathSamplePtsB[i];
        const b = pathSamplePtsB[(i + 1) % pathSamplePtsB.length];
        pathApproxLengthB += a.distanceTo(b);
      }
      pathApproxLengthB = Math.max(pathApproxLengthB, 1);

      // Draw path B (optional)
      if (params.showPathB) {
        const geom = new THREE.BufferGeometry().setFromPoints(pathSamplePtsB.concat([pathSamplePtsB[0].clone()]));
        const mat = new THREE.LineBasicMaterial({
          color: 0xffb36b,
          transparent: true,
          opacity: 0.55,
          depthTest: false,
          depthWrite: false,
        });

        if (pathLineB) {
          scene.remove(pathLineB);
          pathLineB.geometry.dispose();
          pathLineB.material.dispose();
        }

        pathLineB = new THREE.Line(geom, mat);
        pathLineB.frustumCulled = false;
        scene.add(pathLineB);
        pathLineB.renderOrder = 9998; // under path A
      }
    }

    function samplePathAtUB(u) {
      const n = pathSamplePtsB.length;
      if (n < 2) return { pos: new THREE.Vector3(), tan: new THREE.Vector3(0, 1, 0) };

      const t = (u % 1 + 1) % 1;
      const f = t * n;
      const i0 = Math.floor(f) % n;
      const i1 = (i0 + 1) % n;
      const a = f - Math.floor(f);

      const p0 = pathSamplePtsB[i0];
      const p1 = pathSamplePtsB[i1];

      const pos = new THREE.Vector3().lerpVectors(p0, p1, a);

      const prev = pathSamplePtsB[(i0 - 1 + n) % n];
      const next = pathSamplePtsB[(i0 + 1) % n];
      const tan = new THREE.Vector3().subVectors(next, prev).normalize();

      return { pos, tan };
    }

    function findNearestPathIndex(p) {
      // Brute-force nearest sample (S ~ 240, N=30 => cheap).
      let best = 0;
      let bestD2 = Infinity;
      for (let i = 0; i < pathSamplePts.length; i++) {
        const d2 = pathSamplePts[i].distanceToSquared(p);
        if (d2 < bestD2) { bestD2 = d2; best = i; }
      }
      return best;
    }

    function samplePathAtU(u) {
      // Sample position + tangent from the polyline samples using linear interpolation.
      // EN: This keeps leader motion smooth and avoids self-intersection snapping.
      const n = pathSamplePts.length;
      if (n < 2) return { pos: new THREE.Vector3(), tan: new THREE.Vector3(0, 1, 0) };

      const t = (u % 1 + 1) % 1; // wrap to [0,1)
      const f = t * n;
      const i0 = Math.floor(f) % n;
      const i1 = (i0 + 1) % n;
      const a = f - Math.floor(f);

      const p0 = pathSamplePts[i0];
      const p1 = pathSamplePts[i1];

      const pos = new THREE.Vector3().lerpVectors(p0, p1, a);

      // Tangent via central difference around i0 (stable on closed loop)
      const prev = pathSamplePts[(i0 - 1 + n) % n];
      const next = pathSamplePts[(i0 + 1) % n];
      const tan = new THREE.Vector3().subVectors(next, prev).normalize();

      return { pos, tan };
    }

    function soloFlockTarget(ind) {
      // 0 => behaves more like the school, 1 => mostly independent
      // Never go fully 0 to avoid "different species" vibe.
      return 0.9 - 0.8 * ind; // 0.1..0.9
    }

  function applyDensity() {
      // Map slider 0..2 -> normalized 0..1
      const d = clamp(params.density / 2, 0, 1);

      // Nonlinear response: keep mid stable, but make the low end "explode" more.
      const tight = Math.pow(d, 1.35); // 0..1, emphasizes low-density differences

      // When density is LOW (tight ~ 0):
      // - cohesion/alignment weak
      // - neighbor radius larger (fish can "see" farther but don't glue together)
      // - separation stronger + separation radius bigger => school breaks apart clearly
      //
      // When density is HIGH (tight ~ 1):
      // - cohesion/alignment strong
      // - neighbor radius smaller => compact school
      // - separation softer + smaller separation radius

      params.wCohesion = lerp(0.12, 2.40, tight);
      params.wAlignment = lerp(0.35, 2.10, tight);

      params.neighborRadius = lerp(6.0, 4.8, tight);   // low density => less neighbor coupling
      params.wSeparation = lerp(1.60, 0.28, tight); // low density => push apart
      params.separationRadius = lerp(2.60, 1.25, tight); // low density => bigger personal space

      // EN: Store runtime multipliers so step() can weaken path/glue at low density.
      params._tight = tight; // 0..1
      params._pathAttractScale = lerp(0.03, 1.00, tight); // almost free when density=0
      params._noiseScale = lerp(2.20, 1.00, tight);       // more wander when density=0
    }

    function applySoloIndependence() {
      const t = soloFlockTarget(params.soloIndependence);
      for (let i = 0; i < N; i++) flockTarget[i] = isSolo[i] ? t : 1.0;
    }

    function setMode(i, solo) {
      // EN: Toggle fish between "solo" and "school" behavior.
      // isSolo drives flockTarget via applySoloIndependence().
      isSolo[i] = solo ? 1 : 0;
      applySoloIndependence();

      // EN: Optional visual cue (color shift) for solo fish.
      if (fishBodies && fishBodies[i]) {
        fishBodies[i].material.color.copy(solo ? COLOR_SOLO : COLOR_SCHOOL);
      }
    }

    function resampleReactionLags() {
        const mean = Math.max(0, params.reactionLag);
        const jitter = clamp(params.reactionJitter, 0, 1);

        for (let i = 0; i < N; i++) {
          // EN: Uniform ± jitter around mean (e.g. jitter=0.6 => 0.4..1.6x)
          const factor = 1 + (Math.random() * 2 - 1) * jitter;
          reactionTau[i] = Math.max(0, mean * factor);
        }
      }

        noiseTarget[i].copy(randomUnitVec3(new THREE.Vector3()));

        flock[i] = 1.0;
        setMode(i, Math.random() < 0.25); // start with some solos
      }
    // EN: Keep the test fish (#0) in the main school at startup.
      if (N > 0) setMode(0, false);

    // EN: Rotate current direction toward target direction with a max turn rate (rad/sec).
      function rotateDirToward(currentDir, targetDir, maxTurnRate, dt) {
        const cur = currentDir.clone().normalize();
        const tgt = targetDir.clone().normalize();

        const dot = THREE.MathUtils.clamp(cur.dot(tgt), -1, 1);
        const angle = Math.acos(dot);

        if (angle < 1e-5) {
          return tgt;
        }

        const maxStep = maxTurnRate * dt;
        const t = Math.min(1, maxStep / angle);

        const axis = new THREE.Vector3().crossVectors(cur, tgt).normalize();
        const q = new THREE.Quaternion().setFromAxisAngle(axis, angle * t);

        return cur.applyQuaternion(q).normalize();
      }
    
    // ---------- Simulation step -------------------------------------------------------
    const tmp = {
      basisUp: new THREE.Vector3(),
      bankQ: new THREE.Quaternion(),
      localForwardAxis: new THREE.Vector3(0, 0, 1), // EN: local +Z = forward (v5.9)
      localUpAxis: new THREE.Vector3(0, 1, 0),      // EN: local +Y = up (v5.9)
      d: new THREE.Vector3(),
      sumPos: new THREE.Vector3(),
      sumVel: new THREE.Vector3(),
      sep: new THREE.Vector3(),
      desired: new THREE.Vector3(),
      steer: new THREE.Vector3(),
      // EN: Focus (near-camera) steering scratch
      focusAnchor: new THREE.Vector3(),
      focusTo: new THREE.Vector3(),
      focusVelRaw: new THREE.Vector3(), // EN: raw focus desired velocity (pre-smoothing)
      focusDir: new THREE.Vector3(),
      focusDirLimited: new THREE.Vector3(),
      camWorldPos: new THREE.Vector3(), // EN: camera world position for focus anchor
        r1: new THREE.Vector3(),
        r2: new THREE.Vector3(),
      tangent: new THREE.Vector3(),
      radial: new THREE.Vector3(),
      toPath: new THREE.Vector3(),
      up: new THREE.Vector3(0, 1, 0),
      quat: new THREE.Quaternion(),
      m4: new THREE.Matrix4(),
      s: new THREE.Vector3(1, 1, 1),

      // Scratch vectors for acceleration decomposition
      a: new THREE.Vector3(),
      fwd: new THREE.Vector3(),
      right: new THREE.Vector3(),
      worldUp: new THREE.Vector3(0, 1, 0), // EN: consistent with Three.js world up
      };

    function updateNoise(i) {
      // Occasionally pick a new target; then smoothly approach it.
      if (Math.random() < 0.02) randomUnitVec3(noiseTarget[i]);
    }
  

function step(dt) {
      // dt capped for stability (mobile frame drops)
      dt = Math.min(0.033, dt);

      // Advance the global leader along the curve (once per step)
      // EN: Persistent u parameter prevents snapping at self-intersections.
      const duLeader = (params.pathLeaderSpeed * dt) / Math.max(pathApproxLength, 1);
      pathLeaderU = (pathLeaderU + duLeader) % 1;

      const leaderSample = samplePathAtU(pathLeaderU);
      const leaderPos = leaderSample.pos;
      const leaderTan = leaderSample.tan;
      // EN: Stop-mode factors when the leader slows down.
      // EN: targetSpeed slider controls params.pathLeaderSpeed (0..4).
      // EN: Stop-mode factors per leader (A and B). Used to calm fish when the active leader slows/stops.
      const lead01A = clamp(params.pathLeaderSpeed / 1.8, 0, 1);
      const stopEaseA = (1 - lead01A) ** 2;

      const lead01B = clamp(params.pathLeaderSpeedB / 0.52, 0, 1); // 0.52 = your current default B speed
      const stopEaseB = (1 - lead01B) ** 2;

      if (pathLeaderMarker) pathLeaderMarker.position.copy(leaderPos);


      // Advance secondary leader (B) even if School B has N=0
      const duLeaderB = (params.pathLeaderSpeedB * dt) / Math.max(pathApproxLengthB, 1);
      pathLeaderUB = (pathLeaderUB + duLeaderB) % 1;

      const leaderSampleB = samplePathAtUB(pathLeaderUB);
      const leaderPosB = leaderSampleB.pos;
      const leaderTanB = leaderSampleB.tan;

      if (pathLeaderMarkerB) pathLeaderMarkerB.position.copy(leaderPosB);



      const neighborR = params.neighborRadius;      // convert px-ish values to world-ish
      const separationR = params.separationRadius;
      // Blend flock factor smoothly (dt-stable exponential smoothing)
      const tau = 0.18;
      const aBlend = 1 - Math.exp(-dt / tau);

      for (let i = 0; i < N; i++) {
        flock[i] += (flockTarget[i] - flock[i]) * aBlend;

        // Smoothed noise (fish-like wander)
        updateNoise(i);
        noise[i].lerp(noiseTarget[i], params.noiseLerp);
      }
      // Global center to prevent the school splitting into multiple clusters
      const globalCenter = new THREE.Vector3();
      let globalCount = 0;
      for (let i = 0; i < N; i++) {
        if (isSolo[i]) continue; // keep solos freer
        globalCenter.add(P[i]);
        globalCount++;
      }
      if (globalCount > 0) globalCenter.multiplyScalar(1 / globalCount);

      for (let i = 0; i < N; i++) {
        const p = P[i];
        const v = V[i];

        tmp.sumPos.set(0, 0, 0);
        tmp.sumVel.set(0, 0, 0);
        tmp.sep.set(0, 0, 0);
        let count = 0;

        // O(N^2) neighbor scan (fine for N=30)
        for (let j = 0; j < N; j++) if (j !== i) {

          const dist = tmp.d.length();

          if (dist < neighborR) {
            count++;

            tmp.sumVel.add(V[j]);

            if (dist < separationR && dist > 1e-6) {

              tmp.sep.addScaledVector(tmp.d, -1 / (dist * dist));

        // Build desired velocity (fishy: steer toward desiredVel, not raw force sum)
        tmp.desired.set(0, 0, 0);

        if (count > 0) {
          const inv = 1 / count;

          // Alignment direction
          tmp.sumVel.multiplyScalar(inv);
          if (tmp.sumVel.lengthSq() > 1e-8) tmp.sumVel.normalize();
          tmp.desired.addScaledVector(tmp.sumVel, params.wAlignment * flock[i]);

          // Cohesion direction (toward neighbors' center)
          tmp.sumPos.multiplyScalar(inv).sub(p);
          if (tmp.sumPos.lengthSq() > 1e-8) tmp.sumPos.normalize();
          tmp.desired.addScaledVector(tmp.sumPos, params.wCohesion * flock[i]);

          // Separation direction
          // Separation: keep magnitude (stronger when very close), but clamp to avoid instability
if (tmp.sep.lengthSq() > 1e-8) {
  clampLen(tmp.sep, 3.0); // max separation impulse (tune 1.5..6.0)
  tmp.desired.addScaledVector(tmp.sep, params.wSeparation);
}
}

        // Path leader following: the whole school follows a single moving point on the curve.
        // EN: No nearest-point lookup => no snapping when the curve self-intersects.
        const useLeaderPos = (i === 0 && params.testFishUsePathB) ? leaderPosB : leaderPos;
        const useLeaderTan = (i === 0 && params.testFishUsePathB) ? leaderTanB : leaderTan;
        // EN: Use the stop-ease of the ACTIVE leader for this fish.
        const stopEaseThis = (i === 0 && params.testFishUsePathB) ? stopEaseB : stopEaseA;

        const flowScaleThis = 1 - 0.95 * stopEaseThis;
        const minSpeedThis = lerp(params.minSpeed, 0.05, stopEaseThis);
        const pointPullThis = 0.12 + 0.65 * stopEaseThis;

        tmp.toPath.copy(useLeaderPos).sub(p);
        // EN: Small direct pull toward the leader point to reduce persistent corridor offset,
        // EN: especially when the leader slows/stops.
        if (tmp.toPath.lengthSq() > 1e-8) {
          tmp.r2.copy(tmp.toPath).normalize();         // r2 = direction to leader point
          tmp.desired.addScaledVector(tmp.r2, pointPullThis);
         }

        // EN: Lateral error only (remove forward component)
        const fwd = useLeaderTan; // unit
        tmp.r1.copy(tmp.toPath).addScaledVector(fwd, -tmp.toPath.dot(fwd)); // r1 = lateral error
        const latDist = tmp.r1.length();

        // EN: Normalize lateral direction but scale its influence by distance (strong when far off)
        if (latDist > 1e-6) tmp.r1.multiplyScalar(1 / latDist);
        // EN: Effective attraction gain toward the path (density-scaled)
        // EN: Satellites should be less tightly bound to the target corridor.
        // flock[i]≈1 => almost normal, flock[i]≈0 => much weaker target attraction.
        const attractKBase = params.pathAttractK * (params._pathAttractScale ?? 1.0);
        const attractK = isSolo[i] ? attractKBase * (0.15 + 0.85 * flock[i]) : attractKBase;

        // EN: When far from the leader line, prioritize lateral correction and reduce forward bias.
        // kLatGain tunes how aggressively the school returns to the path corridor.
        const kLatGain = 1.8;                 // try 1.2..3.0
        const latWeight = attractK * Math.min(latDist, 6.0) * kLatGain;

        tmp.desired.addScaledVector(tmp.r1, latWeight);

        // EN: Gate forward flow by lateral error so fish don't "lock" into an offset orbit.
        const gate = 1 / (1 + 0.9 * latDist); // latDist=0 => 1, latDist large => smaller
        tmp.desired.addScaledVector(useLeaderTan, params.pathSpeed * gate * flowScaleThis);

        // EN: Stronger flow boost when the fish is more independent (low flock[i]).
        // This keeps "satellites" moving with the stream without merging into the main school.
        if (isSolo[i]) {
          const soloFlow = params.soloFlowBoostMax * (1 - flock[i]); // flock≈1 => ~0, flock≈0 => max boost
          tmp.desired.addScaledVector(useLeaderTan, soloFlow);
        }

        // Keep school fairly thin in Z (soft pull toward z=0)
        // EN: Keep schools thin in Z, but pull toward the active path center (A: z=0, B: pathCenterZB).
        const targetZ = (i === 0 && params.testFishUsePathB) ? params.pathCenterZB : 0.0;
        tmp.desired.z += (targetZ - p.z) * params.zWanderK;

        // Add smoothed noise
        // EN: More independence => more wander (noise). Helps form a satellite group.
        const noiseK = isSolo[i]
          ? params.noiseStrength * (1 + 1.6 * (1 - flock[i]))  // up to ~2.6x when flock≈0
          : params.noiseStrength;
        // tmp.desired.addScaledVector(noise[i], noiseK);
        tmp.desired.addScaledVector(noise[i], noiseK * (1 - 0.85 * stopEaseThis)); // reduce noise when leader slows down
        // Mild "glue" towards global center so the school doesn't split into multiple clusters
        if (globalCount > 0) {
          const toGlobal = globalCenter.clone().sub(p);
          if (toGlobal.lengthSq() > 1e-8) {
            toGlobal.normalize();
            // EN: Density-aware "glue" keeps high-density schools unified.
            // EN: Glue only the main school; satellites (solo) should not be pulled to the global center.
            const glue = lerp(0.00, 0.42, clamp(params.density / 2, 0, 1));
            if (!isSolo[i]) tmp.desired.addScaledVector(toGlobal, glue);
          }
        }
        
        // ---------- Focus command (fish #0) ----------
        // EN: When active, override the desired velocity toward a camera-relative anchor.
        // EN: We keep the regular integration (steer -> velocity -> position), but limit turn rate for swim-like arcs.
        if (i === 0 && focusState.active) {
          // Anchor point in front of the camera along the current view direction.
          // EN: Fish positions are in WORLD space, so compute the anchor in WORLD space too.
          camera.getWorldPosition(tmp.camWorldPos);
          camera.getWorldDirection(tmp.focusDir); // normalized, points where the camera looks (WORLD)
          tmp.focusAnchor.copy(tmp.camWorldPos).addScaledVector(tmp.focusDir, params.focusAnchorDistance);

          tmp.focusTo.copy(tmp.focusAnchor).sub(p);
          const dist = tmp.focusTo.length();

          // Phase transitions
          if (focusState.phase === "approach") {
            if (dist < params.focusArriveRadius) {
              focusState.phase = "hold";
            }
          } else if (focusState.phase === "hold") {
            focusState.holdLeft -= dt;
            if (focusState.holdLeft <= 0) {
              focusState.phase = "release";
              focusState.releaseLeft = params.focusReleaseSec;
            }
          } else if (focusState.phase === "release") {
            focusState.releaseLeft -= dt;
            if (focusState.releaseLeft <= 0) {
              focusState.active = false;
              focusState.phase = "idle";
            }
          }

          // Preserve the normal desired velocity for blending during release.
          tmp.r2.copy(tmp.desired);

          // Build focus desired velocity (arrive + hold).
          let focusSpeed = 0;
          if (focusState.phase === "hold") {
            // Very slow correction while holding (prevents jittering).
            focusSpeed = clamp(dist * 3.0, 0, 0.55);
          } else {
            // Approach speed: faster when far, slower when close.
            focusSpeed = clamp(dist * 2.8, 0.8, params.focusMaxSpeed);

          if (dist > 1e-6) {
            tmp.focusTo.multiplyScalar(focusSpeed / dist); // now focus desired velocity
            tmp.focusVelRaw.copy(tmp.focusTo); // EN: keep raw focus velocity for turn-rate targeting
          } else {
            tmp.focusTo.set(0, 0, 0);

          if (focusState.phase === "release") {

            const blend = clamp(focusState.releaseLeft / Math.max(1e-3, params.focusReleaseSec), 0, 1);
            tmp.desired.copy(tmp.r2).multiplyScalar(1 - blend).addScaledVector(tmp.focusTo, blend);
          } else {
            tmp.desired.copy(tmp.focusTo);
          }

// EN: Reaction lag: smooth desired velocity so fish don't turn in perfect sync.
        const tau = reactionTau[i];
        if (tau > 1e-5 && !(i === 0 && focusState.active)) {
          // Exponential smoothing: alpha = 1 - exp(-dt/tau)
          const alpha = 1 - Math.exp(-dt / tau);
          desiredSm[i].lerp(tmp.desired, alpha);
          tmp.desired.copy(desiredSm[i]);
        }

        // Convert desired direction into target speed (cruise-like)
        // EN: During focus, tmp.desired already encodes a desired velocity (including speed).
        if (!(focusState.active && i === 0)) {
          // EN: Let pathSpeed act as a speed multiplier, not just a direction bias.
          const sp = clamp(params.pathSpeed / 1.55, 0.3, 2.5);

          // EN: When leader slows, also reduce cruise speed strongly (prevents "orbiting" when target stops).
          const cruiseStopScale = 1 - 0.85 * stopEaseThis; // 1..~0.15
          const cruise = lerp(params.minSpeed, params.maxSpeed, 0.55) * sp * cruiseStopScale;

          if (tmp.desired.lengthSq() > 1e-8) setMag(tmp.desired, cruise);
        } else {
          // EN: Focus: keep desired speed as computed (arrive/hold/release).
        }

        // EN: Focus turn-rate limit (swim-like steering). Only applied while focus is active.
        if (i === 0 && focusState.active) {
          const desiredSpeed = tmp.desired.length();
          if (desiredSpeed > 1e-6) {
            // EN: Use current velocity direction if available, otherwise fall back to desired direction.
            const curDir = (v.lengthSq() > 1e-8) ? tmp.focusDirLimited.copy(v).normalize()
              : tmp.focusDirLimited.copy(tmp.desired).normalize();

            // EN: Target direction should be the raw focus vector (otherwise smoothing can 'lock' the fish in its old heading).
            const focusVec = (focusState.phase === "release") ? tmp.desired : tmp.focusVelRaw;
            const tgtDir = tmp.focusDir.copy(focusVec).normalize();

            // EN: rotateDirToward returns a new direction vector (normalized).
           // EN: Boost turn rate when target is behind (more natural swim turn)
            const dot = curDir.dot(tgtDir);
            const turnBoost = dot < 0 ? 2.2 : 1.0;  // 2.2 = tunable
            const newDir = rotateDirToward(
              curDir,
              tgtDir,
              params.focusMaxTurnRate * turnBoost,
              dt
            );
            tmp.desired.copy(newDir).multiplyScalar(desiredSpeed);
          }
        }

// Steering = desiredVel - currentVel
        tmp.steer.copy(tmp.desired).sub(v);
        // EN: Turn-rate limit for Path B test fish even in normal mode (prevents "twitch" on tight curves).
        if (i === 0 && params.testFishUsePathB && v.lengthSq() > 1e-8 && tmp.desired.lengthSq() > 1e-8) {
          const curDir = tmp.fwd.copy(v).normalize();
          const tgtDir = tmp.tangent.copy(tmp.desired).normalize();

          const maxTurnRate = 1.0; // rad/s, try 2.0..5.0
          const maxAng = maxTurnRate * dt;

          // rotateDirToward() exists already (global helper) – use it to limit direction change
          const newDir = rotateDirToward(curDir, tgtDir, maxTurnRate, dt);
          tmp.desired.copy(newDir).multiplyScalar(tmp.desired.length());
        }
        clampLen(tmp.steer, params.maxSteer);

        // Integrate
        v.addScaledVector(tmp.steer, dt);

        // Clamp speed
        const speed = v.length();
        if (speed > params.maxSpeed) v.multiplyScalar(params.maxSpeed / speed);
        else if (speed < minSpeedThis) v.multiplyScalar(minSpeedThis / speed);        p.addScaledVector(v, dt);


        // --- Acceleration decomposition (for visuals) ---
        // a = (v - vPrev) / dt
        const invDt = 1 / Math.max(dt, 1e-4);
        tmp.a.copy(v).sub(Vprev[i]).multiplyScalar(invDt);

        // fwd axis from velocity
        tmp.fwd.copy(v);
        if (tmp.fwd.lengthSq() < 1e-8) tmp.fwd.set(0, 1, 0);
        tmp.fwd.normalize();

        // EN: right axis = fwd x worldUp, but becomes unstable when fwd ~ worldUp.
        // EN: Use previous stable right axis as fallback to prevent sudden banking flips.
        tmp.right.copy(tmp.fwd).cross(tmp.worldUp);

        if (tmp.right.lengthSq() < 1e-8) {
          tmp.right.copy(rightPrev[i]); // fallback to last frame's right axis
        } else {
          tmp.right.normalize();
          rightPrev[i].copy(tmp.right); // update stable axis
        }

        // Signed forward and lateral acceleration components
        const aForward = tmp.a.dot(tmp.fwd);
        const aLateral = tmp.a.dot(tmp.right);

        // Smooth to avoid flicker
        const alphaAcc = 1 - Math.exp(-dt / 0.20); // ~100ms response
        aForwardSm[i] += (aForward - aForwardSm[i]) * alphaAcc;
        aLateralSm[i] += (aLateral - aLateralSm[i]) * alphaAcc;

        // Store v for next frame
        Vprev[i].copy(v);
        // Soft bounds (keep them near center, like "invisible aquarium")
        // This is intentionally gentle to keep things calm.
        const maxR = (params.pathRadius + params.pathJitter) * 2.1; // gentle spherical bound around the path
        const r3 = p.clone().sub(params.center);
        const r3Len = r3.length();
        if (r3Len > maxR) {
          r3.multiplyScalar(1 / (r3Len + 1e-6));
          p.addScaledVector(r3, -(r3Len - maxR) * 0.12);
        }
      }
    }

    // ---------- Render instanced fish ----------
    function renderMeshes() {
      for (let i = 0; i < N; i++) {
        const p = P[i];
        const dir = V[i].clone().normalize();


        if (dir.lengthSq() < 1e-8) dir.set(0, 0, 1);

        // EN: Build a stable right-handed frame so all fish share the same "up" (world Y).
        // EN: Local axes convention (v5.9): +X=right, +Y=up, +Z=forward.
        // EN: Stable basis: when dir ~ worldUp, cross product collapses.
        // EN: Use per-fish previous right axis to avoid sudden roll/yaw flips.
        tmp.right.crossVectors(tmp.worldUp, dir);

        if (tmp.right.lengthSq() < 1e-8) {
          tmp.right.copy(rightPrev[i]);
        } else {
          tmp.right.normalize();
          rightPrev[i].copy(tmp.right);
        }

        // EN: "Flight up" (perpendicular to dir)
        tmp.basisUp.crossVectors(dir, tmp.right).normalize();

        // EN: Blend up toward worldUp when motion is mostly horizontal,
        // EN: so fish stays visually upright and doesn't look sideways.
        const absY_up = Math.abs(dir.y);
        let u = (absY_up - 0.08) / (0.28 - 0.08); // start..full tilt range
        u = clamp(u, 0, 1);
        const allowTilt = u * u * (3 - 2 * u); // smoothstep

        // Horizontal (allowTilt≈0) => up ≈ worldUp
        // Vertical-ish (allowTilt≈1) => up ≈ flight up
        tmp.basisUp.lerp(tmp.worldUp, 1 - allowTilt).normalize();

        // EN: Rotation matrix from basis -> quaternion (prevents random roll flips)
        tmp.m4.makeBasis(tmp.right, tmp.basisUp, dir);
        tmp.quat.setFromRotationMatrix(tmp.m4);
        const fish = fishMeshes[i];
        fish.position.copy(p);
        fish.quaternion.copy(tmp.quat);

        // EN: Determine which local axis is the model's "up" by checking alignment vs worldUp.
        if (i === 0 && (performance.now() % 400 < 16)) {
          const upX = new THREE.Vector3(1, 0, 0).applyQuaternion(fish.quaternion).dot(tmp.worldUp);
          const upY = new THREE.Vector3(0, 1, 0).applyQuaternion(fish.quaternion).dot(tmp.worldUp); // EN: local +Y = up
          const upZ = new THREE.Vector3(0, 0, 1).applyQuaternion(fish.quaternion).dot(tmp.worldUp);
          console.log("dotUp X/Y/Z:", upX.toFixed(3), upY.toFixed(3), upZ.toFixed(3));
        }
        // EN: Measure actual "uprightness" of fish #0 (angle between its up axis and world up)
        if (i === 0 && (performance.now() % 400 < 16)) {
          const upWorld = new THREE.Vector3(0, 1, 0).applyQuaternion(fish.quaternion); // EN: local +Y is up (v5.9)
          const dotUp = clamp(upWorld.dot(tmp.worldUp), -1, 1);
          const upAngleDeg = Math.acos(dotUp) * 57.3;
          console.log("upAngleDeg:", upAngleDeg.toFixed(1), "dirLen:", V[i].length().toFixed(3));
        }

        // EN: Update debug arrow to match fish #0 velocity direction
        if (i === 0 && debugArrow) {
          debugArrow.position.copy(p);
          // EN: Arrow shows fish local +Z (forward) in world space
          tmp.fwd.set(0, 0, 1);
          tmp.fwd.applyQuaternion(fish.quaternion).normalize();
          debugArrow.setDirection(tmp.fwd);
        }

        // Tail thrust + glow from forward acceleration (no oscillation)
        const tail = fishTails[i];

        // Forward thrust: only positive (accelerating forward)
        const f = aForwardSm[i];
        const fPos = Math.max(0, f);

        // Map forward accel to 0..1
        const fCap = 2.0; // more sensitive cap (units/s^2)
        const thrust = Math.min(fPos, fCap) / fCap;

        // Tail length and glow (StandardMaterial)
        tail.scale.set(1, 0.75 + 2.2 * thrust, 1);
        tail.material.emissiveIntensity = 0.35 + 4.0 * thrust;


        // --- Eye + mouth scaling (simple expressive motion) ---
        const eyeBar = fishEyeBars[i];
        const mouth = fishMouths[i];

        // EN: Use forward accel "thrust" for alertness (eyes slightly larger)
        const eyeK = 1.0 + 0.35 * thrust; // ~1.0..1.35
        // EN: Keep eye shape/orientation from init; only scale uniformly.
        if (eyeBar.userData && eyeBar.userData.baseScale) {
          eyeBar.scale.copy(eyeBar.userData.baseScale).multiplyScalar(eyeK);
        } else {
          eyeBar.scale.set(1, 1, 1).multiplyScalar(eyeK);
        }

        // EN: Mouth size inversely proportional to speed.
        // EN: Fast fish -> small mouth, slow fish -> large mouth.

        const speed = V[i].length();

        // EN: Map speed range to 0..1 (0 = slow, 1 = fast)
        const t = clamp(
          (speed - 0.05) / (params.maxSpeed - 0.05),
          0,
          1
        );

        // EN: Invert so 1 = slow, 0 = fast
        const slowFactor = 1 - t;

        // EN: Ease curve (more dramatic when very slow)
        const slowEase = slowFactor * slowFactor;

        // EN: Scale range: tune 1.8 if you want larger maximum
        const mouthK = 0.55 + 2.2 * slowEase;

        mouth.scale
          .copy(mouth.userData.baseScale)
          .multiplyScalar(mouthK);

        // Strong banking indicator from lateral acceleration (amplified)
        const lat = aLateralSm[i];
        const latCap = 2.5; // more sensitive cap
        const latNorm = Math.max(-latCap, Math.min(latCap, lat)) / latCap;

        // Visible bank angle (radians). Increase gain for clarity.
        const bankMax = 1.05; // stronger indicator (~60 degrees)
        const bank = -latNorm * bankMax;

        // Apply bank around forward axis (local +Z after alignment)
        // EN: Bank around forward axis for consistent roll.
        // EN: Prefer upright orientation during mostly-horizontal motion.
        // EN: Allow strong roll mainly when moving up/down (large |dir.y|).
        const absY = Math.abs(dir.y);
        let g = (absY - 0.08) / (0.28 - 0.08); // start..full
        g = clamp(g, 0, 1);
        const allowRoll = g * g * (3 - 2 * g); // smoothstep

        const bankGated = bank * allowRoll;
        
        tmp.bankQ.setFromAxisAngle(tmp.localForwardAxis, bankGated);
        fish.quaternion.multiply(tmp.bankQ);
      }
    }
    function updateCameraForHud() {
      const hud = document.getElementById("hud");
      const hudH = hud ? hud.getBoundingClientRect().height : 0;

      // EN: Fraction of the screen not covered by the HUD.
      const bottomPad = 16; // px safety margin
      const visibleFrac = clamp(1 - (hudH + bottomPad) / window.innerHeight, 0.35, 1.0);

      // EN: Desired camera distance from target, adjusted for HUD and manual zoom.
      const targetDist = (params.baseCamZ / visibleFrac) * params.viewZoom;

      // EN: Keep the current viewing direction, only change the distance along it.
      // Camera is looking at origin => direction to target is (target - position).  // EN: Camera always zooms relative to the simulation center (world origin).
      const target = params.center;
      const toTarget = new THREE.Vector3().subVectors(target, camera.position);
      if (toTarget.lengthSq() < 1e-8) toTarget.set(0, 0, -1); // fallback

      toTarget.normalize();
      camera.position.copy(target).addScaledVector(toTarget, -targetDist); // move backwards from target
      camera.lookAt(target);
      // EN: Compensate fog for zoom-out. If camera distance increases, extend fog range proportionally so objects don't "wash out" just because we zoomed out.
      const zScale = targetDist / params.baseCamZ;
      scene.fog.near = params.fogNear0 * zScale;
      scene.fog.far = params.fogFar0 * zScale;

      camera.updateProjectionMatrix();
    }

    // ---------- Resize ----------
    addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      updateCameraForHud();
    });

    // ---------- Simple touch drag to orbit camera ----------
    let dragging = false;
    let lastX = 0, lastY = 0;
    // Start camera straight on Z axis (front view)
    let yaw = 1.5;
    let pitch = 0; // 0 = XY plane straight on

  function updateCamera() {
    pitch = clamp(pitch, -0.2, 1.2);

    // EN: Set only the viewing direction using a unit sphere.
    const x = Math.cos(yaw) * Math.cos(pitch);
    const z = Math.sin(yaw) * Math.cos(pitch);
    const y = Math.sin(pitch);

    camera.position.set(x, y, z);
    camera.lookAt(0, 0, 0);

    // EN: Now apply HUD + viewZoom distance along the current direction.
    updateCameraForHud();
  }

    updateCamera();

    renderer.domElement.addEventListener("pointerdown", (e) => {
      // EN: If HUD is open, a tap on the canvas only closes it (no orbit drag, no focus command).
      if (hud.classList.contains("is-open")) {
         dragging = false;
        // Close HUD on pointerup to avoid accidental close when starting a drag gesture.
        renderer.domElement._closeHudOnUp = true;
        return;
      }

      renderer.domElement._closeHudOnUp = false;

      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;

      // EN: Click/tap detection (used to trigger focus command when there is no drag).
      renderer.domElement._downX = e.clientX;
      renderer.domElement._downY = e.clientY;
      renderer.domElement._moved = false;
      renderer.domElement._downTime = performance.now();

      renderer.domElement.setPointerCapture(e.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!dragging) return;

      const dxAll = e.clientX - renderer.domElement._downX;
      const dyAll = e.clientY - renderer.domElement._downY;
      if ((dxAll * dxAll + dyAll * dyAll) > 16) renderer.domElement._moved = true; // EN: 4px threshold

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      yaw += dx * 0.005;
      pitch += dy * 0.005;
      updateCamera();
    });

    renderer.domElement.addEventListener("pointerup", () => {
      if (renderer.domElement._closeHudOnUp) {
        hideHud();
        renderer.domElement._closeHudOnUp = false;
        return;
      }

      const wasDrag = renderer.domElement._moved;
      dragging = false;

      // EN: A short tap/click (no drag) triggers the focus command for fish #0.
      if (!wasDrag) {
        // Focus only if debug fish exists.
        if (N > 0) {
          focusState.active = true;
          focusState.phase = "approach";
          focusState.holdLeft = params.focusHoldSec;
          focusState.releaseLeft = params.focusReleaseSec;
        }
      }
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragging = false;
      renderer.domElement._closeHudOnUp = false;
    });


    // ---------- Main loop ----------
    init();
    applyDensity();
    applySoloIndependence();

    let simTime = 0; // EN: simulation time accumulator (seconds)
let lastT = performance.now();
    function loop(t) {
      const dt = (t - lastT) / 1000;
      lastT = t;

      simTime += dt;

      animateLights(t);

      step(dt);
      renderMeshes();

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
