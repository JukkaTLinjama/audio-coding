<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Fish School (Boids) – v4.2</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      overscroll-behavior: none; /* EN: Prevent rubber-band scrolling */
    }

    canvas {
    display: block;
    touch-action: none;           /* EN: Disable browser pan/zoom gestures on the canvas */
    -webkit-user-select: none;
    user-select: none;
    }

    /* Simple mobile HUD overlay */
    #hud {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.15);
      color: #fff;
      font: 14px/1.2 -apple-system, system-ui, sans-serif;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      user-select: none;
      touch-action: manipulation;
    }

    #hud .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    #hud label {
      width: 140px;
      opacity: 0.95;
    }

    #hud input[type=range] {
      flex: 1;
    }

    #hud span {
      width: 48px;
      text-align: right;
      opacity: 0.9;
    }

    #hud button {
      flex: 1;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    #hud {
      transition: opacity 220ms ease, transform 220ms ease;
    }

    #hud.is-hidden {
      opacity: 0.08;                /* EN: still barely visible */
      transform: translateY(10px);  /* EN: subtle slide down */
      pointer-events: none;         /* EN: clicks go through to canvas */
    }
    #hudFooter {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.35;
      text-align: center;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>
    <div id="hud">
      <div style="
        font-weight:600;
        font-size:15px;
        margin-bottom:8px;
        opacity:0.9;
      ">
        Fish School v4.2 ------
      </div>

    <div class="row">
      <label>View zoom</label>
      <input id="viewZoom" type="range" min="0.80" max="2.20" step="0.01" value="1.00">
      <span id="viewZoomVal">1.00</span>
    </div>

      <div class="row">
      <label>Solo independence</label>
      <input id="soloInd" type="range" min="0" max="1" step="0.01" value="0.70">
      <span id="soloIndVal">0.70</span>
    </div>
    <div class="row">
      <label>Density</label>
      <input id="density" type="range" min="0" max="2" step="0.01" value="1.10">
      <span id="densityVal">1.10</span>
    </div>

    <div class="row">
      <label>Reaction lag (s)</label>
      <input id="reactionLag" type="range" min="0" max="2.80" step="0.1" value="0.88">
      <span id="reactionLagVal">0.88</span>
    </div>
    <div class="row">
      <button id="scatter">Scatter 30%</button>
      <button id="regroup">Regroup</button>
    </div>
    <div id="hudFooter">
      © 2026 Jukka Linjama & ChatGPT 5.2 · CC BY 4.0
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ---------- Utilities ----------
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;

    function randomUnitVec3(out) {
      // Random direction on sphere
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      out.set(
        Math.sin(phi) * Math.cos(theta),
        Math.sin(phi) * Math.sin(theta),
        Math.cos(phi)
      );
      return out;
    }

    function setMag(v, m) {
      const len = v.length();
      if (len > 1e-6) v.multiplyScalar(m / len);
      return v;
    }

    function clampLen(v, maxLen) {
      const len = v.length();
      if (len > maxLen && len > 1e-6) v.multiplyScalar(maxLen / len);
      return v;
    }

    // ---------- Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b1020, 8, 80); // temporary, will be driven by params later

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

    const lightA = new THREE.HemisphereLight(0xffffff, 0x223355, 0.9);
    scene.add(lightA);

    const lightB = new THREE.DirectionalLight(0xffffff, 0.8);
    lightB.position.set(8, 18, 10);
    scene.add(lightB);

// Moving point lights for "living gloss" (no shadows)
const keyLight = new THREE.PointLight(0xffffff, 1.1, 80);
const fillLight = new THREE.PointLight(0x88ccff, 0.7, 80);
scene.add(keyLight);
scene.add(fillLight);

function animateLights(ms) {
  // Move lights in slow circles to create shifting highlights on the fish bodies
  const t = ms * 0.001;
  keyLight.position.set(Math.cos(t) * 12, 6, Math.sin(t) * 12);
  fillLight.position.set(Math.cos(t * 0.7) * -10, -4, Math.sin(t * 0.7) * 10);
}

// Fish geometry: body = flattened ellipsoid, tail = cone
// EN: SphereGeometry becomes an ellipsoid via mesh scaling (see body.scale below).
const bodyGeom = new THREE.SphereGeometry(0.42, 14, 10);
const tailGeom = new THREE.ConeGeometry(0.18, 0.45, 8);

// EN: Move tail backward along -Y to match longer body.
tailGeom.translate(0, -0.8, 0);

// Materials: body color changes by mode; tail stays "exhaust" color
// Use StandardMaterial so lights create moving specular highlights (no shadows).
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xcfe9ff,
  roughness: 0.22,
  metalness: 0.05,
});

const tailMat = new THREE.MeshStandardMaterial({
  color: 0xffb36b,
  roughness: 0.45,
  metalness: 0.0,
  emissive: 0xff5a00,
  emissiveIntensity: 0.9,
});
const N = 30;
    const COLOR_SCHOOL = new THREE.Color("#cfe9ff");
    const COLOR_SOLO = new THREE.Color("#ff7a2f");

    // For N=30, separate objects are simplest and reliable on mobile.
// Each fish is a Group: [0]=body, [1]=tail.
const fishMeshes = [];
const fishBodies = [];
const fishTails = [];

for (let i = 0; i < N; i++) {
  const body = new THREE.Mesh(bodyGeom, bodyMat.clone());
  const tail = new THREE.Mesh(tailGeom, tailMat.clone());
  // EN: Ellipsoid proportions (local axes): X=width, Y=length (forward), Z=thickness (up).
  // Make fish "flat": small Z.
  body.scale.set(0.55, 1.25, 0.22);

  const fish = new THREE.Group();
  fish.add(body);
  fish.add(tail);

  scene.add(fish);
  fishMeshes.push(fish);
  fishBodies.push(body);
  fishTails.push(tail);
}

    // ---------- Simulation data (arrays) ----------
    const P = Array.from({ length: N }, () => new THREE.Vector3());
    const V = Array.from({ length: N }, () => new THREE.Vector3());

    // Acceleration-based visuals (tail thrust + banking)
    // English comments for open-source continuity.
    const Vprev = Array.from({ length: N }, () => new THREE.Vector3());
    const aForwardSm = new Float32Array(N); // signed forward acceleration (smoothed)
    const aLateralSm = new Float32Array(N); // signed lateral acceleration (smoothed)
    const noise = Array.from({ length: N }, () => new THREE.Vector3());
    const noiseTarget = Array.from({ length: N }, () => new THREE.Vector3());
    // EN: Per-fish steering lag (reaction time). We smooth desired velocity to avoid synchronized turns.
    const desiredSm = Array.from({ length: N }, () => new THREE.Vector3());
    const reactionTau = new Float32Array(N); // seconds

    const isSolo = new Uint8Array(N);
    const flock = new Float32Array(N);
    const flockTarget = new Float32Array(N);

    // ---------- Parameters (tuned for calm fish school) ----------
    const params = {
      // EN: Base camera distance without HUD compensation.
      baseCamZ: 22,     // EN: Manual zoom-out multiplier (UI). 1 = default.
      viewZoom: 1.00,   // EN: Fog baselines (tuned for baseCamZ). We'll scale them with zoom distance.
      fogNear0: 8,
      fogFar0: 60,

      density: 1.10,
      soloIndependence: 0.70,

      // Base boids
      neighborRadius: 6.5,
      separationRadius: 1.6,
      wAlignment: 1.0,
      wCohesion: 1.1,
      wSeparation: 0.4,

      // Motion limits (calm)
      maxSpeed: 3.9,   // units/s
      minSpeed: 1.6,   // units/s
      maxSteer: 3.6,   // units/s^2

      // Path following (random smooth closed curve in XY, drawn on screen)
      center: new THREE.Vector3(0, 0, 0),
      pathRadius: 7.0,       // average radius of the curve
      pathJitter: 2.2,       // randomness of the curve control points
      pathZAmplitude: 6.0,  // Z range of the curve (set 0 for flat XY)
      pathControlPoints: 9,  // number of control points for the closed curve
      pathSamples: 240,      // polyline samples used for nearest-point lookup + drawing
      pathSpeed: 1.55,       // initial "flow" speed along the curve
      pathAttractK: 0.35,    // pull strength toward the curve (tune 0.2..1.2)

      // Path leader (single moving target along the curve)
      pathLeaderSpeed: 1.8,  // world units / second along the curve
      pathLeaderU: 0.0,      // 0..1 start phase on the curve
      showPathLeader: true,  // draw a small marker for debugging

      // EN: Average reaction lag (seconds). 0 = instant response.
      reactionLag: 0.18,
      // EN: Individual variation around the mean (0..1). Keep fixed unless you want another slider.
      reactionJitter: 0.60,

      // Noise (smoothed)
      noiseStrength: 0.55,
      noiseLerp: 0.03,

      // Thickness in Z (school is a ribbon / tube)
      zWanderK: 0.25, // gentle pull to z ~ 0

      // EN: HUD auto-hide delay after last interaction.
      hudHideDelayMs: 1900,
    };

    // EN: Camera setup must happen after params initialization.
      camera.position.set(0, 0, params.baseCamZ);
      camera.lookAt(0, 0, 0);
      updateCameraForHud();

    // ---------- Random path (Catmull-Rom) ----------
    // We replace the old circular orbit with a random smooth closed curve.
    // The curve is sampled into a polyline so each fish can "lock on" to the nearest sample
    // (fast, stable, and good enough visually for N=30).
    let pathCurve = null;
    let pathSamplePts = [];     // Vector3[]
    let pathSampleTans = [];    // Vector3[]
    let pathLine = null;        // THREE.Line

    // Leader point state (single target that moves along the curve)
    // EN: Using a persistent curve parameter prevents snapping when the curve self-intersects.
    let pathLeaderU = 0.0;          // 0..1
    let pathApproxLength = 1.0;     // approximate curve length in world units
    let pathLeaderMarker = null;    // optional visible marker (THREE.Mesh)

    function buildRandomClosedCurve() {
      const pts = [];
      const M = Math.max(4, Math.floor(params.pathControlPoints || 8));
      const R = params.pathRadius;
      const J = params.pathJitter;
      const Z = params.pathZAmplitude || 0;

      for (let k = 0; k < M; k++) {
        const a = (k / M) * Math.PI * 2;
        // Jittered radius gives a "random" loop but keeps it roughly centered.
        const r = R + (Math.random() * 2 - 1) * J;
        const z = (Math.random() * 2 - 1) * Z;
        pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, z));
      }

      // Closed Catmull-Rom spline in XYZ (Z controlled by pathZAmplitude)
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.5);
    }

    function rebuildPath() {
      pathCurve = buildRandomClosedCurve();

      // Sample points + tangents for nearest-point lookup and for drawing the path line
      const S = Math.max(60, Math.floor(params.pathSamples || 200));
      pathSamplePts = new Array(S);
      pathSampleTans = new Array(S);

      for (let i = 0; i < S; i++) {
        const u = i / S;
        pathSamplePts[i] = pathCurve.getPointAt(u);
        pathSampleTans[i] = pathCurve.getTangentAt(u).normalize();
      }
      // Approximate curve length from samples (closed loop)
      // EN: Used to advance the leader at roughly constant world speed.
      pathApproxLength = 0;
      for (let i = 0; i < pathSamplePts.length; i++) {
        const a = pathSamplePts[i];
        const b = pathSamplePts[(i + 1) % pathSamplePts.length];
        pathApproxLength += a.distanceTo(b);
      }
      pathApproxLength = Math.max(pathApproxLength, 1);



      // Draw path as a thin line
      const geom = new THREE.BufferGeometry().setFromPoints(pathSamplePts.concat([pathSamplePts[0].clone()]));
      const mat = new THREE.LineBasicMaterial({
        color: 0x6aa7ff,
        transparent: true,
        opacity: 0.75,
        depthTest: false,
        depthWrite: false,
      });

      if (pathLine) {
        scene.remove(pathLine);
        pathLine.geometry.dispose();
        pathLine.material.dispose();
      }

      pathLine = new THREE.Line(geom, mat);
      pathLine.frustumCulled = false;
      scene.add(pathLine);
      // Keep the guide path visible on top of fish and fog.
      pathLine.renderOrder = 9999;
    }

    function findNearestPathIndex(p) {
      // Brute-force nearest sample (S ~ 240, N=30 => cheap).
      let best = 0;
      let bestD2 = Infinity;
      for (let i = 0; i < pathSamplePts.length; i++) {
        const d2 = pathSamplePts[i].distanceToSquared(p);
        if (d2 < bestD2) { bestD2 = d2; best = i; }
      }
      return best;
    }

    function samplePathAtU(u) {
      // Sample position + tangent from the polyline samples using linear interpolation.
      // EN: This keeps leader motion smooth and avoids self-intersection snapping.
      const n = pathSamplePts.length;
      if (n < 2) return { pos: new THREE.Vector3(), tan: new THREE.Vector3(0, 1, 0) };

      const t = (u % 1 + 1) % 1; // wrap to [0,1)
      const f = t * n;
      const i0 = Math.floor(f) % n;
      const i1 = (i0 + 1) % n;
      const a = f - Math.floor(f);

      const p0 = pathSamplePts[i0];
      const p1 = pathSamplePts[i1];

      const pos = new THREE.Vector3().lerpVectors(p0, p1, a);

      // Tangent via central difference around i0 (stable on closed loop)
      const prev = pathSamplePts[(i0 - 1 + n) % n];
      const next = pathSamplePts[(i0 + 1) % n];
      const tan = new THREE.Vector3().subVectors(next, prev).normalize();

      return { pos, tan };
    }

    function soloFlockTarget(ind) {
      // 0 => behaves more like the school, 1 => mostly independent
      // Never go fully 0 to avoid "different species" vibe.
      return 0.9 - 0.7 * ind; // 0.2..0.9
    }

  function applyDensity() {
      // Map slider 0..2 -> normalized 0..1
      const d = clamp(params.density / 2, 0, 1);

      // Nonlinear response: keep mid stable, but make the low end "explode" more.
      const tight = Math.pow(d, 1.35); // 0..1, emphasizes low-density differences

      // When density is LOW (tight ~ 0):
      // - cohesion/alignment weak
      // - neighbor radius larger (fish can "see" farther but don't glue together)
      // - separation stronger + separation radius bigger => school breaks apart clearly
      //
      // When density is HIGH (tight ~ 1):
      // - cohesion/alignment strong
      // - neighbor radius smaller => compact school
      // - separation softer + smaller separation radius

      params.wCohesion = lerp(0.12, 2.40, tight);
      params.wAlignment = lerp(0.35, 2.10, tight);

      params.neighborRadius = lerp(6.0, 4.8, tight);   // low density => less neighbor coupling
      params.wSeparation = lerp(1.60, 0.28, tight); // low density => push apart
      params.separationRadius = lerp(2.60, 1.25, tight); // low density => bigger personal space

      // EN: Store runtime multipliers so step() can weaken path/glue at low density.
      params._tight = tight; // 0..1
      params._pathAttractScale = lerp(0.03, 1.00, tight); // almost free when density=0
      params._noiseScale = lerp(2.20, 1.00, tight);       // more wander when density=0
    }

    function applySoloIndependence() {
      const t = soloFlockTarget(params.soloIndependence);
      for (let i = 0; i < N; i++) flockTarget[i] = isSolo[i] ? t : 1.0;
    }

    function setMode(i, solo) {
      // EN: Toggle fish between "solo" and "school" behavior.
      // isSolo drives flockTarget via applySoloIndependence().
      isSolo[i] = solo ? 1 : 0;
      applySoloIndependence();

      // EN: Optional visual cue (color shift) for solo fish.
      if (fishBodies && fishBodies[i]) {
        fishBodies[i].material.color.copy(solo ? COLOR_SOLO : COLOR_SCHOOL);
      }
    }

    function resampleReactionLags() {
        const mean = Math.max(0, params.reactionLag);
        const jitter = clamp(params.reactionJitter, 0, 1);

        for (let i = 0; i < N; i++) {
          // EN: Uniform ± jitter around mean (e.g. jitter=0.6 => 0.4..1.6x)
          const factor = 1 + (Math.random() * 2 - 1) * jitter;
          reactionTau[i] = Math.max(0, mean * factor);
        }
      }

    function init() {
      // Build the random path first (so spawns + initial tangents match the curve).
      rebuildPath();

      // Initialize leader progress along the curve
      pathLeaderU = (params.pathLeaderU || 0) % 1;

      // Optional visible marker for the leader point (debug)
      if (params.showPathLeader && !pathLeaderMarker) {
        const g = new THREE.SphereGeometry(0.55, 14, 14);
        const m = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          depthTest: false,
          depthWrite: false,
        });
        pathLeaderMarker = new THREE.Mesh(g, m);
        pathLeaderMarker.frustumCulled = false;
        pathLeaderMarker.renderOrder = 10000;
        scene.add(pathLeaderMarker);
      }

      // Spawn fish near the path, with small offsets.
      for (let i = 0; i < N; i++) {
        const u = Math.random();
        const onPath = pathCurve.getPointAt(u);
        const tan = pathCurve.getTangentAt(u).normalize();

        // Small spawn offset around the curve point (keeps initial density similar to v3.6)
        const offset = randomUnitVec3(new THREE.Vector3()).multiplyScalar(0.9);
        offset.z *= 0.4;

        P[i].copy(onPath).add(offset);

        // Start moving along the curve tangent + small jitter
        V[i].copy(tan).multiplyScalar(params.pathSpeed);
        V[i].addScaledVector(randomUnitVec3(new THREE.Vector3()), 0.2);
        // EN: Start the smoothing state from current velocity (prevents a "snap" on frame 1).
        desiredSm[i].copy(V[i]);

        // Initialize acceleration history
        Vprev[i].copy(V[i]);
        aForwardSm[i] = 0;
        aLateralSm[i] = 0;
        noise[i].copy(randomUnitVec3(new THREE.Vector3()));
        noiseTarget[i].copy(randomUnitVec3(new THREE.Vector3()));

        flock[i] = 1.0;
        setMode(i, Math.random() < 0.25); // start with some solos
      }
    resampleReactionLags();
    }

    // ---------- UI binding ----------
    function bindSlider(id, valId, onChange) {
      const el = document.getElementById(id);
      const out = document.getElementById(valId);
      const update = () => {
        const v = parseFloat(el.value);
        out.textContent = v.toFixed(2);
        onChange(v);
      };
      el.addEventListener("input", update, { passive: true });
      update();
    }
    bindSlider("viewZoom", "viewZoomVal", (v) => {
      params.viewZoom = v;
      updateCameraForHud();
    });

    bindSlider("soloInd", "soloIndVal", (v) => {
      params.soloIndependence = v;
      applySoloIndependence();
    });

    bindSlider("density", "densityVal", (v) => {
      params.density = v;
      applyDensity();
    });

    bindSlider("reactionLag", "reactionLagVal", (v) => {
      params.reactionLag = v;
      resampleReactionLags(); // EN: Re-randomize per-fish delays around the new mean.
    });

    document.getElementById("scatter").addEventListener("click", () => {
      for (let i = 0; i < N; i++) {
        if (Math.random() < 0.30) setMode(i, true);
      }
    });

    document.getElementById("regroup").addEventListener("click", () => {
      for (let i = 0; i < N; i++) setMode(i, false);
    });
    // EN: Auto-hide HUD after inactivity (mobile-friendly).
    const hud = document.getElementById("hud");
    let hudTimer = null;

    function showHud() {
      hud.classList.remove("is-hidden");
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => hud.classList.add("is-hidden"), params.hudHideDelayMs);
    }

    function hideHudNow() {
      hud.classList.add("is-hidden");
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = null;
    }

    // EN: Any interaction on the HUD keeps it visible.
      ["pointerdown", "pointermove", "wheel", "touchstart"].forEach((ev) => {
        hud.addEventListener(ev, () => showHud(), { passive: true });
      });

      // EN: Tap on canvas shows HUD (without breaking camera drag).
      renderer.domElement.addEventListener("pointerdown", () => showHud(), { passive: true });

    // ---------- Simulation step ----------
    const tmp = {
      basisUp: new THREE.Vector3(),
      bankQ: new THREE.Quaternion(),
      d: new THREE.Vector3(),
      sumPos: new THREE.Vector3(),
      sumVel: new THREE.Vector3(),
      sep: new THREE.Vector3(),
      desired: new THREE.Vector3(),
      steer: new THREE.Vector3(),
        r1: new THREE.Vector3(),
        r2: new THREE.Vector3(),
      tangent: new THREE.Vector3(),
      radial: new THREE.Vector3(),
      toPath: new THREE.Vector3(),
      up: new THREE.Vector3(0, 1, 0),
      quat: new THREE.Quaternion(),
      m4: new THREE.Matrix4(),
      s: new THREE.Vector3(1, 1, 1),

      // Scratch vectors for acceleration decomposition
      a: new THREE.Vector3(),
      fwd: new THREE.Vector3(),
      right: new THREE.Vector3(),
      worldUp: new THREE.Vector3(0, 0, 1),
    };


    function updateNoise(i) {
      // Occasionally pick a new target; then smoothly approach it.
      if (Math.random() < 0.02) randomUnitVec3(noiseTarget[i]);
    }

    function step(dt) {
      // dt capped for stability (mobile frame drops)
      dt = Math.min(0.033, dt);

      // Advance the global leader along the curve (once per step)
      // EN: Persistent u parameter prevents snapping at self-intersections.
      const duLeader = (params.pathLeaderSpeed * dt) / Math.max(pathApproxLength, 1);
      pathLeaderU = (pathLeaderU + duLeader) % 1;

      const leaderSample = samplePathAtU(pathLeaderU);
      const leaderPos = leaderSample.pos;
      const leaderTan = leaderSample.tan;

      if (pathLeaderMarker) pathLeaderMarker.position.copy(leaderPos);


      const neighborR = params.neighborRadius;      // convert px-ish values to world-ish
      const separationR = params.separationRadius;
      // Blend flock factor smoothly (dt-stable exponential smoothing)
      const tau = 0.18;
      const aBlend = 1 - Math.exp(-dt / tau);

      for (let i = 0; i < N; i++) {
        flock[i] += (flockTarget[i] - flock[i]) * aBlend;

        // Smoothed noise (fish-like wander)
        updateNoise(i);
        noise[i].lerp(noiseTarget[i], params.noiseLerp);
      }
      // Global center to prevent the school splitting into multiple clusters
      const globalCenter = new THREE.Vector3();
      let globalCount = 0;
      for (let i = 0; i < N; i++) {
        if (isSolo[i]) continue; // keep solos freer
        globalCenter.add(P[i]);
        globalCount++;
      }
      if (globalCount > 0) globalCenter.multiplyScalar(1 / globalCount);

      for (let i = 0; i < N; i++) {
        const p = P[i];
        const v = V[i];

        tmp.sumPos.set(0, 0, 0);
        tmp.sumVel.set(0, 0, 0);
        tmp.sep.set(0, 0, 0);
        let count = 0;

        // O(N^2) neighbor scan (fine for N=30)
        for (let j = 0; j < N; j++) if (j !== i) {
          tmp.d.copy(P[j]).sub(p);
          const dist = tmp.d.length();

          if (dist < neighborR) {
            count++;
            tmp.sumPos.add(P[j]);
            tmp.sumVel.add(V[j]);

            if (dist < separationR && dist > 1e-6) {
              // Repel more strongly when very close
              tmp.sep.addScaledVector(tmp.d, -1 / (dist * dist));
            }
          }
        }

        // Build desired velocity (fishy: steer toward desiredVel, not raw force sum)
        tmp.desired.set(0, 0, 0);

        if (count > 0) {
          const inv = 1 / count;

          // Alignment direction
          tmp.sumVel.multiplyScalar(inv);
          if (tmp.sumVel.lengthSq() > 1e-8) tmp.sumVel.normalize();
          tmp.desired.addScaledVector(tmp.sumVel, params.wAlignment * flock[i]);

          // Cohesion direction (toward neighbors' center)
          tmp.sumPos.multiplyScalar(inv).sub(p);
          if (tmp.sumPos.lengthSq() > 1e-8) tmp.sumPos.normalize();
          tmp.desired.addScaledVector(tmp.sumPos, params.wCohesion * flock[i]);

          // Separation direction
          // Separation: keep magnitude (stronger when very close), but clamp to avoid instability
if (tmp.sep.lengthSq() > 1e-8) {
  clampLen(tmp.sep, 3.0); // max separation impulse (tune 1.5..6.0)
  tmp.desired.addScaledVector(tmp.sep, params.wSeparation);
}
}

        // Path leader following: the whole school follows a single moving point on the curve.
        // EN: No nearest-point lookup => no snapping when the curve self-intersects.
        tmp.toPath.copy(leaderPos).sub(p);

        // EN: Lateral error only (remove forward component)
        const fwd = leaderTan; // unit
        tmp.r1.copy(tmp.toPath).addScaledVector(fwd, -tmp.toPath.dot(fwd)); // r1 = lateral error
        const latDist = tmp.r1.length();

        // EN: Normalize lateral direction but scale its influence by distance (strong when far off)
        if (latDist > 1e-6) tmp.r1.multiplyScalar(1 / latDist);
        // EN: Effective attraction gain toward the path (density-scaled)
        const attractK = params.pathAttractK * (params._pathAttractScale ?? 1.0);

        // EN: When far from the leader line, prioritize lateral correction and reduce forward bias.
        // kLatGain tunes how aggressively the school returns to the path corridor.
        const kLatGain = 1.8;                 // try 1.2..3.0
        const latWeight = attractK * Math.min(latDist, 6.0) * kLatGain;

        tmp.desired.addScaledVector(tmp.r1, latWeight);

        // EN: Gate forward flow by lateral error so fish don't "lock" into an offset orbit.
        const gate = 1 / (1 + 0.9 * latDist); // latDist=0 => 1, latDist large => smaller
        tmp.desired.addScaledVector(leaderTan, params.pathSpeed * gate);

        // Keep solo fish moving with the flow so they don't lag behind
        if (isSolo[i]) {
          tmp.desired.addScaledVector(leaderTan, 0.8); // tune 0.4..1.2
        }

        // Keep school fairly thin in Z (soft pull toward z=0)
        tmp.desired.z += (-p.z) * params.zWanderK;

        // Add smoothed noise
        tmp.desired.addScaledVector(noise[i], params.noiseStrength);
        // Mild "glue" towards global center so the school doesn't split into two flocks
        if (globalCount > 0) {
          const toGlobal = globalCenter.clone().sub(p);
          if (toGlobal.lengthSq() > 1e-8) {
            toGlobal.normalize();
            // EN: Density-aware "glue" keeps high-density schools unified,
            // but allows low-density settings to disperse more.
            const glue = lerp(0.00, 0.42, clamp(params.density / 2, 0, 1));
            tmp.desired.addScaledVector(toGlobal, glue * flock[i]);
          }
        }
        // EN: Reaction lag: smooth desired velocity so fish don't turn in perfect sync.
        const tau = reactionTau[i];
        if (tau > 1e-5) {
          // Exponential smoothing: alpha = 1 - exp(-dt/tau)
          const alpha = 1 - Math.exp(-dt / tau);
          desiredSm[i].lerp(tmp.desired, alpha);
          tmp.desired.copy(desiredSm[i]);
        }

        // Convert desired direction into target speed (cruise-like)
          // EN: Let pathSpeed act as a speed multiplier, not just a direction bias.
          const sp = clamp(params.pathSpeed / 1.55, 0.3, 2.5); // 1.55 = default baseline
          const cruise = lerp(params.minSpeed, params.maxSpeed, 0.55) * sp;
        if (tmp.desired.lengthSq() > 1e-8) setMag(tmp.desired, cruise);

        // Steering = desiredVel - currentVel
        tmp.steer.copy(tmp.desired).sub(v);
        clampLen(tmp.steer, params.maxSteer);

        // Integrate
        v.addScaledVector(tmp.steer, dt);

        // Clamp speed
        const speed = v.length();
        if (speed > params.maxSpeed) v.multiplyScalar(params.maxSpeed / speed);
        else if (speed < params.minSpeed) v.multiplyScalar(params.minSpeed / speed);

        p.addScaledVector(v, dt);


        // --- Acceleration decomposition (for visuals) ---
        // a = (v - vPrev) / dt
        const invDt = 1 / Math.max(dt, 1e-4);
        tmp.a.copy(v).sub(Vprev[i]).multiplyScalar(invDt);

        // fwd axis from velocity
        tmp.fwd.copy(v);
        if (tmp.fwd.lengthSq() < 1e-8) tmp.fwd.set(0, 1, 0);
        tmp.fwd.normalize();

        // right axis = fwd x worldUp (screen-ish basis; XY is screen plane)
        tmp.right.copy(tmp.fwd).cross(tmp.worldUp);
        if (tmp.right.lengthSq() < 1e-8) {
          // Fallback if fwd || up
          tmp.worldUp.set(0, 1, 0);
          tmp.right.copy(tmp.fwd).cross(tmp.worldUp);
          tmp.worldUp.set(0, 0, 1);
        }
        tmp.right.normalize();

        // Signed forward and lateral acceleration components
        const aForward = tmp.a.dot(tmp.fwd);
        const aLateral = tmp.a.dot(tmp.right);

        // Smooth to avoid flicker
        const alphaAcc = 1 - Math.exp(-dt / 0.10); // ~100ms response
        aForwardSm[i] += (aForward - aForwardSm[i]) * alphaAcc;
        aLateralSm[i] += (aLateral - aLateralSm[i]) * alphaAcc;

        // Store v for next frame
        Vprev[i].copy(v);
        // Soft bounds (keep them near center, like "invisible aquarium")
        // This is intentionally gentle to keep things calm.
        const maxR = (params.pathRadius + params.pathJitter) * 2.1; // gentle spherical bound around the path
        const r3 = p.clone().sub(params.center);
        const r3Len = r3.length();
        if (r3Len > maxR) {
          r3.multiplyScalar(1 / (r3Len + 1e-6));
          p.addScaledVector(r3, -(r3Len - maxR) * 0.12);
        }
      }
    }

    // ---------- Render instanced fish ----------
    function renderMeshes() {
      for (let i = 0; i < N; i++) {
        const p = P[i];
        const dir = V[i].clone().normalize();
        if (dir.lengthSq() < 1e-8) dir.set(0, 1, 0);

        // EN: Build a stable frame so all fish share the same "up" (world Z).
        // local axes: X=right, Y=forward, Z=up
        tmp.right.copy(dir).cross(tmp.worldUp);
        if (tmp.right.lengthSq() < 1e-8) {
            // EN: If dir is parallel to worldUp, pick a fallback axis.
            tmp.right.set(1, 0, 0);
        } else {
            tmp.right.normalize();
        }
        tmp.basisUp.copy(tmp.right).cross(dir).normalize();

        // EN: Rotation matrix from basis -> quaternion (prevents random roll flips)
        tmp.m4.makeBasis(tmp.right, dir, tmp.basisUp);
        tmp.quat.setFromRotationMatrix(tmp.m4);

        const fish = fishMeshes[i];
        fish.position.copy(p);
        fish.quaternion.copy(tmp.quat);

        // Tail thrust + glow from forward acceleration (no oscillation)
        const tail = fishTails[i];

        // Forward thrust: only positive (accelerating forward)
        const f = aForwardSm[i];
        const fPos = Math.max(0, f);

        // Map forward accel to 0..1
        const fCap = 2.0; // more sensitive cap (units/s^2)
        const thrust = Math.min(fPos, fCap) / fCap;

        // Tail length and glow (StandardMaterial)
        tail.scale.set(1, 0.75 + 2.2 * thrust, 1);
        tail.material.emissiveIntensity = 0.35 + 4.0 * thrust;

        // Strong banking indicator from lateral acceleration (amplified)
        const lat = aLateralSm[i];
        const latCap = 2.5; // more sensitive cap
        const latNorm = Math.max(-latCap, Math.min(latCap, lat)) / latCap;

        // Visible bank angle (radians). Increase gain for clarity.
        const bankMax = 1.05; // stronger indicator (~60 degrees)
        const bank = -latNorm * bankMax;

        // Apply bank around forward axis (local +Y after alignment)
        // EN: Bank around forward axis for consistent roll.
        tmp.bankQ.setFromAxisAngle(dir, bank);
        fish.quaternion.premultiply(tmp.bankQ);
      }
    }

    function updateCameraForHud() {
      const hud = document.getElementById("hud");
      const hudH = hud ? hud.getBoundingClientRect().height : 0;

      // EN: Fraction of the screen not covered by the HUD.
      const bottomPad = 16; // px safety margin
      const visibleFrac = clamp(1 - (hudH + bottomPad) / window.innerHeight, 0.35, 1.0);

      // EN: Desired camera distance from target, adjusted for HUD and manual zoom.
      const targetDist = (params.baseCamZ / visibleFrac) * params.viewZoom;

      // EN: Keep the current viewing direction, only change the distance along it.
      // Camera is looking at origin => direction to target is (target - position).  // EN: Camera always zooms relative to the simulation center (world origin).
      const target = params.center;
      const toTarget = new THREE.Vector3().subVectors(target, camera.position);
      if (toTarget.lengthSq() < 1e-8) toTarget.set(0, 0, -1); // fallback

      toTarget.normalize();
      camera.position.copy(target).addScaledVector(toTarget, -targetDist); // move backwards from target
      camera.lookAt(target);
      // EN: Compensate fog for zoom-out. If camera distance increases, extend fog range proportionally so objects don't "wash out" just because we zoomed out.
      const zScale = targetDist / params.baseCamZ;
      scene.fog.near = params.fogNear0 * zScale;
      scene.fog.far = params.fogFar0 * zScale;

      camera.updateProjectionMatrix();
    }

    // ---------- Resize ----------
    addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      updateCameraForHud();
    });

    // ---------- Simple touch drag to orbit camera ----------
    let dragging = false;
    let lastX = 0, lastY = 0;
    // Start camera straight on Z axis (front view)
    let yaw = 1.5;
    let pitch = 0; // 0 = XY plane straight on

  function updateCamera() {
    pitch = clamp(pitch, -0.2, 1.2);

    // EN: Set only the viewing direction using a unit sphere.
    const x = Math.cos(yaw) * Math.cos(pitch);
    const z = Math.sin(yaw) * Math.cos(pitch);
    const y = Math.sin(pitch);

    camera.position.set(x, y, z);
    camera.lookAt(0, 0, 0);

    // EN: Now apply HUD + viewZoom distance along the current direction.
    updateCameraForHud();
  }

    updateCamera();

    renderer.domElement.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      yaw -= dx * 0.005;
      pitch -= dy * 0.005;
      updateCamera();
    });
    renderer.domElement.addEventListener("pointerup", () => dragging = false);
    renderer.domElement.addEventListener("pointercancel", () => dragging = false);

    // ---------- Main loop ----------
    init();
    applyDensity();
    applySoloIndependence();

    let lastT = performance.now();
    function loop(t) {
      const dt = (t - lastT) / 1000;
      lastT = t;

      animateLights(t);

      step(dt);
      renderMeshes();

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    showHud(); // start visible, then auto-hide after delay
    requestAnimationFrame(loop);
  </script>
</body>
