<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiments with Web Coding 2026-5</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #ababb3;
        --muted: #9aa0aa;
        --accent: #6ae3c4;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 2rem;
    }

    .site-header {
        margin-bottom: 2.5rem;
        max-width: 760px;
    }

    .site-header h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4.5vw, 3.4rem);
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.05;
        color: #c7cbd1;
    }

    .site-subtitle {
        margin-top: 0.9rem;
        font-size: clamp(1rem, 2vw, 1.2rem);
        color: var(--muted);
        line-height: 1.5;
        max-width: 680px;
    }

    .site-meta {
        margin-top: 0.45rem;
        font-size: 0.9rem;
        color: #7c828d;
        line-height: 1.5;
    }

    .site-meta a {
        color: var(--accent);
        text-decoration: none;
    }

    .site-meta a:hover {
        text-decoration: underline;
    }

    .demo-section {
        margin-top: 2.5rem;
    }

    .section-header {
        margin-bottom: 1rem;
        max-width: 720px;
    }

    .section-header h2 {
        margin: 0;
        font-size: 1.35rem;
        color: #f0f2f5;
        letter-spacing: -0.025em;
    }

    .section-header p {
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .demo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
    }

    /* Demo card layout: thumbnail on the left, text on the right */
    .demo-card {
        background: var(--card);
        border-radius: 10px;
        padding: 1rem;
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 1rem;
        align-items: start;
    }

    /* Clickable thumbnail image (left column): opens a static preview modal. */
    .demo-thumb-button {
        display: block;
        border: 0;
        padding: 0;
        background: transparent;
        border-radius: 6px;
        overflow: hidden;
        cursor: zoom-in;
        text-align: left;
    }

    .demo-thumb {
        display: block;
        width: 120px;
        height: auto;
        border-radius: 6px;
        object-fit: cover;
        transition: transform 160ms ease, opacity 160ms ease;
    }

    .demo-thumb-button:hover .demo-thumb {
        transform: scale(1.03);
        opacity: 0.9;
    }

    /* Right column wrapper for title + description */
    .demo-content {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }

    .demo-card a {
        color: var(--accent);
        font-size: 1.05rem;
        text-decoration: none;
    }

    .demo-card a:hover {
        text-decoration: underline;
    }

    .demo-desc {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.4;
    }

    .demo-date {
        font-size: 0.78rem;
        color: #7c828d;
        letter-spacing: 0.01em;
    }

    .show-more-button {
        margin-top: 1.1rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(106, 227, 196, 0.35);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        font-size: 0.95rem;
        cursor: pointer;
    }

    .show-more-button:hover {
        background: rgba(106, 227, 196, 0.08);
    }

    .site-footer {
        margin-top: 40px;
        padding: 12px 16px;
        font-size: 10px;
        color: #888;
        text-align: center;
    }

    .footer-inner {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }



    .image-preview-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .image-preview-modal.hidden {
        display: none;
    }

    .image-preview-window {
        width: min(50vw, 760px);
        max-width: 94vw;
        max-height: 88vh;
        background: #111318;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transform: scale(0.86);
        opacity: 0;
        transition: transform 180ms ease-out, opacity 180ms ease-out;
    }

    .image-preview-modal:not(.hidden) .image-preview-window {
        transform: scale(1);
        opacity: 1;
    }

    .image-preview-header {
        min-height: 48px;
        padding: 0.6rem 0.8rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: #171a21;
        color: var(--text);
        font-size: 0.9rem;
        flex-shrink: 0;
    }

    .image-preview-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    #image-preview-open-link {
        color: var(--accent);
        text-decoration: none;
        white-space: nowrap;
    }

    #image-preview-open-link:hover {
        text-decoration: underline;
    }

    #image-preview-close-button {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
        cursor: pointer;
    }

    #image-preview-img {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(88vh - 56px);
        object-fit: contain;
        background: #000;
    }

    @media (max-width: 700px) {
        .image-preview-window {
            width: 94vw;
            max-height: 86vh;
        }

        .image-preview-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .image-preview-actions {
            width: 100%;
            justify-content: space-between;
        }

        #image-preview-img {
            max-height: calc(86vh - 96px);
        }
    }

    @media (max-width: 520px) {
        body {
            padding: 1.2rem;
        }

        .demo-card {
            grid-template-columns: 96px 1fr;
        }

        .demo-thumb {
            width: 96px;
        }
    }
</style>

</head>

<body>
    <header class="site-header">
        <h1>Experiments with Web Coding</h1>
        <p class="site-subtitle">
            Audio, vibroacoustic and visual interaction prototypes built with browser technologies. Tested with desktop and mobile Chrome browser.
        </p>
        <p class="site-meta">
            Updated: 2026-05-15 · <a href="https://jukkatlinjama.github.io" target="_blank" rel="noopener">GitHub Pages</a>
        </p>
    </header>

    <div id="demo-list"></div>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>© 2026 Jukka Linjama</span>
            <span>•</span>
            <span>License: MIT</span>
        </div>
    </footer>

    <div id="image-preview-modal" class="image-preview-modal hidden" aria-hidden="true">
        <div class="image-preview-window" role="dialog" aria-modal="true" aria-labelledby="image-preview-title">
            <div class="image-preview-header">
                <span id="image-preview-title">Preview</span>

                <div class="image-preview-actions">
                    <a id="image-preview-open-link" href="#" target="_blank" rel="noopener">
                        Open in new window
                    </a>
                    <button id="image-preview-close-button" type="button">
                        Close
                    </button>
                </div>
            </div>

            <img id="image-preview-img" src="" alt="Demo preview image">
        </div>
    </div>


<script>
    // Demo data is embedded directly in this file to avoid fetch/path/cache issues.
    // To add a new demo, copy one object inside demoData.demos and edit the fields.
    const demoData = {
    "title": "Audio Coding Demos",
    "demos": [
        {
            "id": "fish school v11",
            "title": "simulation of fish school v11",
            "path": "./parvisimul/kalat-v11.3.html",
            "thumb": "assets/Fish-v5.png",
            "status": "WIP",
            "date": "2026-03-29",
            "description": "fish simul v. sim speed control & fish 0 kiss.",
            "tags": [
                "3D",
                "simulation",
                "swarmn behavior"
            ],
            "category": "visual"
        },
        {
            "id": "vibro-keyboard-3",
            "title": "Vibroacoustic keyboard v3",
            "path": "./Vibroacoustic/vibro-keyboard-v2.9.html",
            "thumb": "assets/vibro-keyboard-2.4.png",
            "status": "WIP",
            "date": "2026-03-01",
            "description": "Experimental vibroacoustic keyboard. Low-frequency tones and beating for tactile perception. Added looping rec/play functionality.",
            "tags": [
                "vibrotactile",
                "lf",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "bubble gen",
            "title": "Bubble generator v6",
            "path": "./Vibroacoustic/test-generators/path-generator-v6.html",
            "thumb": "assets/bubble-gen-v6.png",
            "status": "WIP",
            "date": "2026-03-28",
            "description": "Bubble sound generator w API. Simulates bubble formation and bursting with adjustable parameters for size, frequency, and intensity.",
            "tags": [
                "bubble sound synthesis",
                "granular synthesis",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "loop gen v2.5",
            "title": "Loop gen v2.5",
            "path": "./Vibroacoustic/test-generators/path-generator-v2.5.2-granular-gpl-overlap.html",
            "thumb": "assets/Path-loop-gen-2.1.png",
            "status": "WIP",
            "date": "2026-04-14",
            "description": "Sound is treated as a 1D observation of a higher-dimensional geometric system.",
            "tags": [
                "visualisation",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "timescales visualisation 2025",
            "title": "History timescale visualisation v50.2",
            "path": "https://jukkatlinjama.github.io/timescale_dev/",
            "thumb": "assets/timeline_v49.9.png",
            "status": "WIP",
            "date": "2026-05-13",
            "description": "A vertical, zoomable logarithmic timeline of key events from the Big Bang to the present (2026).",
            "tags": [
                "visualisation",
                "history event themes",
                "json database"
            ],
            "category": "visual"
        }
    ]
};

    const categories = [
        {
            id: 'audio',
            title: 'Audio Interaction',
            description: 'Web Audio, vibroacoustic and sound interaction experiments.'
        },
        {
            id: 'visual',
            title: 'Visual Interaction',
            description: 'Interactive visual experiments, simulations and interface prototypes.'
        },
        {
            id: 'others',
            title: 'Others',
            description: 'Demos without a selected category yet.'
        }
    ];

    function formatDemoDate(dateText) {
        if (!dateText) return 'Date not set';

        const date = new Date(`${dateText}T00:00:00`);
        if (Number.isNaN(date.getTime())) return dateText;

        return date.toLocaleDateString('en-GB', {
            year: 'numeric',
            month: 'short',
            day: '2-digit'
        });
    }

    function createDemoCard(demo) {
        const li = document.createElement('li');
        li.className = 'demo-card';

        // Render one demo card.
        // - Thumbnail is optional and opens a static preview modal
        // - Text content is grouped on the right for consistent layout
        li.innerHTML = `
            ${demo.thumb ? `
            <button
                class="demo-thumb-button"
                type="button"
                data-title="${demo.title}"
                data-path="${demo.path}"
                data-thumb="${demo.thumb}"
                aria-label="Preview ${demo.title} screenshot"
            >
                <img
                    class="demo-thumb"
                    src="${demo.thumb}"
                    alt="${demo.title} screenshot"
                >
            </button>
            ` : ''}

            <div class="demo-content">
                <a href="${demo.path}" target="_blank">${demo.title}</a>
                <div class="demo-date">${formatDemoDate(demo.date)}</div>

                <div class="demo-desc">
                    <strong>${demo.status}</strong><br>
                    ${demo.description}
                </div>
            </div>
        `;

        return li;
    }

    function getDemoCategoryId(demo) {
        const allowedCategories = categories.map(category => category.id);
        return allowedCategories.includes(demo.category) ? demo.category : 'others';
    }

    function sortDemosByDateNewestFirst(demos) {
        return [...demos].sort((a, b) => {
            const timeA = new Date(`${a.date || '0000-01-01'}T00:00:00`).getTime();
            const timeB = new Date(`${b.date || '0000-01-01'}T00:00:00`).getTime();
            return timeB - timeA;
        });
    }

    function renderCategory(list, category, demos) {
        const categoryDemos = sortDemosByDateNewestFirst(
            demos.filter(demo => getDemoCategoryId(demo) === category.id)
        );

        if (categoryDemos.length === 0) return;

        const section = document.createElement('section');
        section.className = 'demo-section';

        section.innerHTML = `
            <div class="section-header">
                <h2>${category.title}</h2>
                <p>${category.description}</p>
            </div>
        `;

        const ul = document.createElement('ul');
        ul.className = 'demo-list';

        const visibleDemos = categoryDemos.slice(0, 1);
        const hiddenDemos = categoryDemos.slice(1);

        visibleDemos.forEach(demo => {
            ul.appendChild(createDemoCard(demo));
        });

        section.appendChild(ul);

        if (hiddenDemos.length > 0) {
            const button = document.createElement('button');
            button.className = 'show-more-button';
            button.textContent = `Show more (${hiddenDemos.length})`;

            button.addEventListener('click', () => {
                hiddenDemos.forEach(demo => {
                    ul.appendChild(createDemoCard(demo));
                });

                button.remove();
            });

            section.appendChild(button);
        }

        list.appendChild(section);
    }

    function loadDemos() {
        const list = document.getElementById('demo-list');

        categories.forEach(category => {
            renderCategory(list, category, demoData.demos);
        });
    }



    function setupImagePreviewModal() {
        const modal = document.getElementById('image-preview-modal');
        const image = document.getElementById('image-preview-img');
        const title = document.getElementById('image-preview-title');
        const openLink = document.getElementById('image-preview-open-link');
        const closeButton = document.getElementById('image-preview-close-button');

        function closePreview() {
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');

            // Clear image state after closing to avoid keeping large previews active.
            image.src = '';
            image.alt = 'Demo preview image';
            openLink.href = '#';
        }

        document.addEventListener('click', event => {
            const button = event.target.closest('.demo-thumb-button');
            if (!button) return;

            title.textContent = button.dataset.title;
            image.src = button.dataset.thumb;
            image.alt = `${button.dataset.title} preview image`;
            openLink.href = button.dataset.path;

            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
        });

        closeButton.addEventListener('click', closePreview);

        modal.addEventListener('click', event => {
            if (event.target === modal) {
                closePreview();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                closePreview();
            }
        });
    }

    loadDemos();
    setupImagePreviewModal();
</script>
</body>

</html>
