        kWeightedShortLinear > 0 &&
        (lastLraSampleTimeSec === null || nowSec - lastLraSampleTimeSec >= 1.0)
      ) {
        lastLraSampleTimeSec = nowSec;

        kWeightedLraShortTermHistory.push({
          t: nowSec,
          value: linearEnergyToDb(kWeightedShortLinear)
        });

        trimLinearHistoryBySeconds(kWeightedLraShortTermHistory, maxHistogramHistorySec, nowSec);
      }

      const calibratedKShortTermHistory = kWeightedShortTermRawHistory
        .map(item => ({ t: item.t, value: linearEnergyToDb(item.value) }))
        .filter(item => isFinite(item.value));

      const kUngatedStats = getUngatedStatsFromHistory(calibratedKShortTermHistory);
      const kGatedStats = getLraStatsFromShortTermHistory(calibratedKShortTermHistory);
      const kLraStats = getStandardLikeLraStatsFromShortTermHistory(kWeightedLraShortTermHistory);
      const kRunningIntegratedStats = calculateRunningIntegratedKEstimateFromBlocks(kRealtimeIntegratedBlockHistory);

      // EN: Histogram still uses the denser 10 Hz history.
      // EN: LRA display uses the 1 Hz / 3 s standard-like estimate.
      const activeHistogramStats = histogramGateEnabled ? (kLraStats || kGatedStats) : kUngatedStats;

      // EN: Evaluate gating only for the newest short-term block.
      // EN: This answers: "would this block be rejected right now?"
      if (didAppendShortTermSample && histogramGateEnabled && kGatedStats) {
        const currentDb = linearEnergyToDb(kWeightedShortLinear);
        const absGate = kGatedStats.absoluteThresholdDb;
        const relGate = kGatedStats.relativeThresholdDb;

        const rejected =
          (isFinite(absGate) && currentDb < absGate) ||
          (isFinite(relGate) && currentDb < relGate);

        gateBlockRejectedNow = rejected;

        if (rejected) {
          // EN: Trigger a short visual flash for one rejected analysis block.
          gateFlashUntilMs = nowMs + 150;
        }
      } else if (didAppendShortTermSample) {
        gateBlockRejectedNow = false;
      }

      let histogramSourceValues;
      if (histogramGateEnabled && kGatedStats && kGatedStats.values.length > 0) {
        histogramSourceValues = kGatedStats.values;
      } else {
        histogramSourceValues = calibratedKShortTermHistory.map(item => item.value);
      }

      const histogramBins = buildHistogramFromValues(histogramSourceValues, histogramMinDb, histogramMaxDb, histogramBinSizeDb);

      // EN: Do not show persistent "gate active" state.
      // EN: Only momentary current-block rejection events are visualized.
      const histogramGateActive = false;

      let renderLevelScopeHistory = levelScopeHistory;
      let renderPeak04Db = peak04Db;
      let renderRms04Db = rms04Db;
      let renderRms3Db = rms3Db;
      let renderK3Db = kWeightedShortScopeDb;
      let renderK30Db = kWeightedLongScopeDb;
      let renderKAdaptiveDb = kAdaptiveScopeDb;
      let renderKAdaptiveLookAheadDb = kAdaptiveLookAheadDb;
      let renderScopeStartSec = null;

      // EN: During file playback, the scope reads precomputed offline arrays.
      // EN: Follow mode keeps the visible 20 s window attached to playback; manual mode scrolls independently.
      if (activeInputMode === "file" && fileAnalysis.ready) {
        const fileCursorSec = getFilePlaybackTimeSec();
        const fileIndex = getNearestFileAnalysisIndex(fileCursorSec);
        const maxScopeStartSec = Math.max(0, fileAnalysis.durationSec - levelScopeWindowSec);

        let renderScopeEndSec = fileScopeViewStartSec + levelScopeWindowSec;

        if (fileScopeFollowPlayback) {
          // EN: Match realtime startup behavior: right edge = cursor, left side remains empty before 20 s has elapsed.
          fileScopeViewStartSec = fileCursorSec - levelScopeWindowSec;
          renderScopeEndSec = fileCursorSec;
        } else {
          fileScopeViewStartSec = clamp(fileScopeViewStartSec, 0, maxScopeStartSec);
          renderScopeEndSec = fileScopeViewStartSec + levelScopeWindowSec;
        }

        renderScopeStartSec = fileScopeViewStartSec;
        renderLevelScopeHistory = buildOfflineScopeWindow(fileScopeViewStartSec, levelScopeWindowSec, renderScopeEndSec);

        if (fileIndex >= 0) {
          renderPeak04Db = linearEnergyToDb(fileAnalysis.peak04[fileIndex]);
          renderRms04Db = linearEnergyToDb(fileAnalysis.rms04[fileIndex]);
          renderRms3Db = linearEnergyToDb(fileAnalysis.rms3[fileIndex]);
          renderK3Db = linearEnergyToDb(fileAnalysis.k3[fileIndex]);
          renderK30Db = linearEnergyToDb(fileAnalysis.k30[fileIndex]);
          renderKAdaptiveDb = linearEnergyToDb(fileAnalysis.kAdaptive[fileIndex]);
          renderKAdaptiveLookAheadDb = linearEnergyToDb(fileAnalysis.kAdaptiveLookAhead[fileIndex]);
        }
      }

      renderCanvas(bandValues, {
        supportDb,
        supportShortDb,
        irritationDb,
        irritationShortDb,
        audioDb,
        audioShortDb,
        fullDb,
        fullShortDb,
        fullLongExposureDb,
        fullExposureDeltaDb,
        kWeightedDb,
        kWeightedShortDb,
        kWeightedLongExposureDb,
        kWeightedExposureDeltaDb,
        kAdaptiveDb,
        kAdaptiveDeltaDb,
        kAdaptiveLookAheadDb,
        kMinusFullShortDb,
        kMinusAudioShortDb,
        fullLraDb: activeHistogramStats ? activeHistogramStats.lraDb : null,
        fullP10Db: activeHistogramStats ? activeHistogramStats.p10Db : null,
        fullP95Db: activeHistogramStats ? activeHistogramStats.p95Db : null,
        fullRelativeGateDb: histogramGateEnabled && activeHistogramStats ? activeHistogramStats.relativeThresholdDb : null,
        kRunningIntegratedDb: kRunningIntegratedStats.integratedDb,
        kRunningIntegratedGateDb: kRunningIntegratedStats.relativeThresholdDb,
        kRunningIntegratedStatus: kRunningIntegratedStats.status,
        kRunningIntegratedAcceptedCount: kRunningIntegratedStats.relativeAcceptedCount,
        kRunningIntegratedTotalCount: kRunningIntegratedStats.totalBlockCount,
        kRunningIntegratedMinBlocks: kRunningIntegratedStats.minBlockCount,
        histogramBins,
        histogramMinDb,
        histogramMaxDb,
        histogramBinSizeDb,
        histogramGateOn: histogramGateEnabled,
        histogramGateActive,
        histogramGateFlash: nowMs < gateFlashUntilMs,
        histogramGateBlockRejectedNow: gateBlockRejectedNow,
        histogramAbsoluteGateDb: histogramGateEnabled && activeHistogramStats ? activeHistogramStats.absoluteThresholdDb : null,
        histogramRelativeGateDb: histogramGateEnabled && activeHistogramStats ? activeHistogramStats.relativeThresholdDb : null,
        levelScopeHistory: renderLevelScopeHistory,
        levelScopeWindowSec,
        scopeStartSec: renderScopeStartSec,
        peak04Db: renderPeak04Db,
        rms04Db: renderRms04Db,
        rms3Db: renderRms3Db,
        kWeightedShortScopeDb: renderK3Db,
        kWeightedLongScopeDb: renderK30Db,
        kAdaptiveScopeDb: renderKAdaptiveDb,
        kAdaptiveLookAheadScopeDb: renderKAdaptiveLookAheadDb,
        rmsDbFs
      });

      updateFilePlaybackUI();

      if (activeInputMode === "file" && fileAnalysis.ready && nowMs - lastFileStatusUpdateMs > 500) {
        lastFileStatusUpdateMs = nowMs;
        const fileCursorSec = getFilePlaybackTimeSec();
        logStatus(
          [
            "FILE STATUS",
            `source: ${fileAnalysis.fileName}`,
            `playback: ${formatTimeSec(fileCursorSec)} / ${formatTimeSec(fileAnalysis.durationSec)}`,
            `scope view: ${fileScopeFollowPlayback ? "follow playback" : "manual scroll"} ${formatTimeSec(Math.max(0, fileScopeViewStartSec))}–${formatTimeSec(fileScopeFollowPlayback ? fileCursorSec : Math.min(fileAnalysis.durationSec, fileScopeViewStartSec + levelScopeWindowSec))}`,
            "",
            "PROGRAM LOUDNESS",
            `K integrated est: ${formatNullableDb(fileAnalysis.kIntegratedEstimateDb)}`,
            `integrated gate: ${formatNullableDb(fileAnalysis.gateThresholdDb)} (-70 / -10)`,
            `integrated accepted: ${fileAnalysis.relativeAcceptedCount} / ${fileAnalysis.totalBlockCount}`,
            "",
            "PROGRAM DYNAMICS",
            `LRA est (3 s): ${formatNullableDb(fileAnalysis.lraEstimateDb)}`,
            `LRA gate: ${formatNullableDb(fileAnalysis.lraGateThresholdDb)} (-70 / -20)`,
            `LRA p10/p95: ${formatNullableDb(fileAnalysis.lraP10Db)} / ${formatNullableDb(fileAnalysis.lraP95Db)}`,
            `LRA accepted: ${fileAnalysis.lraAcceptedCount} / ${fileAnalysis.lraTotalCount}`,
            `segment range (10 s max-min): ${formatNullableLu(fileAnalysis.segmentRangeLu)}`,
            fileAnalysis.ready ? `K env: ${formatNullableDb(fileAnalysis.kAdaptive[getNearestFileAnalysisIndex(fileCursorSec)] ? linearEnergyToDb(fileAnalysis.kAdaptive[getNearestFileAnalysisIndex(fileCursorSec)]) : null)}` : "K env: --",
            fileAnalysis.ready ? `K env LA: ${formatNullableDb(fileAnalysis.kAdaptiveLookAhead[getNearestFileAnalysisIndex(fileCursorSec)] ? linearEnergyToDb(fileAnalysis.kAdaptiveLookAhead[getNearestFileAnalysisIndex(fileCursorSec)]) : null)} (${kEnvelopeLookAheadSec.toFixed(2)} s)` : "K env LA: --",
            "",
            "SEGMENT DETAILS (10 S)",
            formatSegmentSummaryLine("current", getCurrentFileSegmentIndex(fileCursorSec)),
            formatSegmentSummaryLine("loudest", fileAnalysis.loudestSegmentIndex),
            formatSegmentSummaryLine("quietest", fileAnalysis.quietestSegmentIndex),
            "",
            "NOTES",
            "Estimates use the current app K-path; this is not full BS.1770 compliance."
          ].join("\n")
        );
      } else if ((activeInputMode === "mic" || activeInputMode === "test") && nowMs - lastRealtimeStatusUpdateMs > 1000) {
        lastRealtimeStatusUpdateMs = nowMs;
        logStatus(
          [
            "REALTIME STATUS",
            `source: ${activeInputMode}`,
            "",
            "PROGRAM LOUDNESS",
            kRunningIntegratedStats.status === "ready"
              ? `K integrated running est: ${formatNullableDb(kRunningIntegratedStats.integratedDb)}`
              : `K integrated running est: warming up (${kRunningIntegratedStats.totalBlockCount}/${kRunningIntegratedStats.minBlockCount})`,
            `integrated gate: ${formatNullableDb(kRunningIntegratedStats.relativeThresholdDb)} (-70 / -10)`,
            `integrated accepted: ${kRunningIntegratedStats.relativeAcceptedCount} / ${kRunningIntegratedStats.totalBlockCount}`,
            "",
            "PROGRAM DYNAMICS",
            activeHistogramStats ? `LRA est (3 s): ${formatNullableLu(activeHistogramStats.lraDb)}` : "LRA est (3 s): --",
            activeHistogramStats ? `LRA gate: ${formatNullableDb(activeHistogramStats.relativeThresholdDb)} (-70 / -20)` : "LRA gate: --",
            `K env: ${formatNullableDb(kAdaptiveDb)} (${kAdaptiveDeltaDb >= 0 ? "+" : ""}${kAdaptiveDeltaDb.toFixed(1)} dB vs K3)`,
            `K env LA: realtime preview unavailable; offline uses ${kEnvelopeLookAheadSec.toFixed(2)} s`,
            "",
            "NOTES",
            "Realtime K integrated uses 400 ms K blocks and becomes valid after warm-up."
          ].join("\n")
        );
      }
    }

    // ==============================
    // RENDERING LAYOUT
    // ==============================
    function renderCanvas(bandValues, meters) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      const outerLeft = 68;
      const outerRight = 20;
      const top = 20;
      const bottom = 78;
      const plotW = w - outerLeft - outerRight;
      const plotH = h - top - bottom;

      const dividerGap = 18;
      const derivedCount = 5;
      const derivedBarW = 62;
      const derivedGap = 16;
      const fullHistogramGap = 0;
      const fullHistogramW = derivedBarW;
      const scopeGap = 18;
      const scopeW = 280;
      const derivedSectionW = (derivedCount - 1) * (derivedBarW + derivedGap) + derivedBarW;
      const spectrumW = plotW - dividerGap - derivedSectionW - scopeGap - scopeW;

      const spectrumLeft = outerLeft;
      const spectrumRight = spectrumLeft + spectrumW;
      const derivedLeft = spectrumRight + dividerGap;
      const derivedRight = derivedLeft + derivedSectionW;
      const scopeLeft = derivedRight + scopeGap;

      drawGrid(spectrumLeft, top, plotW, plotH, displayMinDb, displayMaxDb);
      drawSpectrumBars(bandValues, spectrumLeft, top, spectrumW, plotH, displayMinDb, displayMaxDb);

      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(spectrumRight + dividerGap / 2, top);
      ctx.lineTo(spectrumRight + dividerGap / 2, top + plotH);
      ctx.stroke();

      const derivedBars = [
        {
          label: "Support",
          color: "#8ef",
          stroke: "#e8fbff",
          instantDb: meters.supportDb,
          shortDb: meters.supportShortDb,
          bottom1: `3 s ${meters.supportShortDb.toFixed(1)}`,
          bottom2: "LRA --"
        },
        {
          label: "Irrit.",
          color: "#ffb347",
          stroke: "#ffe2b5",
          instantDb: meters.irritationDb,
          shortDb: meters.irritationShortDb,
          bottom1: `3 s ${meters.irritationShortDb.toFixed(1)}`,
          bottom2: "LRA --"
        },
        {
          label: "Audio",
          color: "#c7a2ff",
          stroke: "#efd8ff",
          instantDb: meters.audioDb,
          shortDb: meters.audioShortDb,
          bottom1: `3 s ${meters.audioShortDb.toFixed(1)}`,
          bottom2: "LRA --"
        },
        {
          label: "Full",
          color: "#ff6666",
          stroke: "#ffd0d0",
          instantDb: meters.fullDb,
          shortDb: meters.fullShortDb,
          bottom1: `3s ${meters.fullShortDb.toFixed(1)} / 10s ${meters.fullLongExposureDb.toFixed(1)}`,
          bottom2: `Δ ${meters.fullExposureDeltaDb >= 0 ? "+" : ""}${meters.fullExposureDeltaDb.toFixed(1)} dB`
        },
        {
          label: "K",
          color: "#66d9a8",
          stroke: "#c8ffe8",
          instantDb: meters.kWeightedDb,
          shortDb: meters.kWeightedShortDb,
          bottom1: `3s ${meters.kWeightedShortDb.toFixed(1)} / 10s ${meters.kWeightedLongExposureDb.toFixed(1)}`,
          bottom2: meters.kRunningIntegratedStatus === "ready"
            ? `K int ${meters.kRunningIntegratedDb.toFixed(1)} · gate ${meters.kRunningIntegratedGateDb.toFixed(1)}`
            : `K int warm ${meters.kRunningIntegratedTotalCount}/${meters.kRunningIntegratedMinBlocks}`
        }
      ];

      for (let i = 0; i < derivedBars.length; i++) {
        const x = derivedLeft + i * (derivedBarW + derivedGap);
        const isKHistogramBar = derivedBars[i].label === "K";
        drawDerivedBar(
          x,
          top,
          derivedBarW,
          plotH,
          derivedBars[i],
          displayMinDb,
          displayMaxDb,
          isKHistogramBar ? {
            bins: meters.histogramBins,
            minDb: meters.histogramMinDb,
            maxDb: meters.histogramMaxDb,
            currentDb: meters.kWeightedShortDb,
            lraDb: meters.fullLraDb,
            p10Db: meters.fullP10Db,
            p95Db: meters.fullP95Db,
            absoluteGateDb: meters.histogramAbsoluteGateDb,
            relativeGateDb: meters.histogramRelativeGateDb,
            gateOn: meters.histogramGateOn,
            gateActive: meters.histogramGateActive,
            gateFlash: meters.histogramGateFlash,
            gateBlockRejectedNow: meters.histogramGateBlockRejectedNow,
            runningIntegratedDb: meters.kRunningIntegratedDb,
            runningIntegratedGateDb: meters.kRunningIntegratedGateDb,
            runningIntegratedStatus: meters.kRunningIntegratedStatus,
            runningIntegratedAcceptedCount: meters.kRunningIntegratedAcceptedCount,
            runningIntegratedTotalCount: meters.kRunningIntegratedTotalCount,
            runningIntegratedMinBlocks: meters.kRunningIntegratedMinBlocks,
            stripGap: fullHistogramGap,
            stripW: fullHistogramW
          } : null
        );
      }

      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(derivedRight + scopeGap / 2, top);
      ctx.lineTo(derivedRight + scopeGap / 2, top + plotH);
      ctx.stroke();

      drawLevelScope(scopeLeft, top, scopeW, plotH, meters, displayMinDb, displayMaxDb);

      ctx.fillStyle = "#ddd";
      ctx.font = "14px Arial";
      ctx.textAlign = "left";
      ctx.fillText(document.title, spectrumLeft, 15);
    }

    // ==============================
    // TIME SCOPE RENDERING
    // ==============================
    function drawLevelScope(left, top, width, height, meters, minDb, maxDb) {
      const history = Array.isArray(meters.levelScopeHistory) ? meters.levelScopeHistory : [];
      const windowSec = meters.levelScopeWindowSec || 20;
      const nowSec = history.length > 0 ? history[history.length - 1].t : performance.now() * 0.001;
      const startSec = Number.isFinite(meters.scopeStartSec) ? meters.scopeStartSec : nowSec - windowSec;
      const endSec = startSec + windowSec;

      ctx.save();
      ctx.fillStyle = "rgba(10, 10, 10, 0.32)";
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, width, height);

      // EN: Draw a 20 s scrolling scope using the same dB scale as the bars.
      const drawCurve = (key, strokeStyle, lineWidth) => {
        ctx.beginPath();
        let started = false;
        for (const item of history) {
          const db = item[key];
          if (!isFinite(db)) continue;
          const x = left + clamp((item.t - startSec) / windowSec, 0, 1) * width;
          const y = top + (1 - clamp((db - minDb) / (maxDb - minDb), 0, 1)) * height;
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      };

      drawCurve("peak04Db", "rgba(255, 255, 255, 1.00)", 2.0);
      drawCurve("rms04Db", "rgba(120, 210, 255, 0.92)", 1.7);
      drawCurve("rms3Db", "rgba(255, 210, 100, 0.96)", 2.4);
      drawCurve("kWeightedShortScopeDb", "rgba(102, 217, 168, 0.98)", 2.6);
      drawCurve("kWeightedLongScopeDb", "rgba(102, 217, 168, 0.45)", 1.5);
      drawCurve("kAdaptiveScopeDb", "rgba(255, 120, 220, 0.96)", 2.2);
      drawCurve("kAdaptiveLookAheadScopeDb", "rgba(255, 255, 255, 0.72)", 1.4);

      ctx.fillStyle = "rgba(0, 0, 0, 0.68)";
      ctx.fillRect(left + 6, top + 6, width - 12, 130);

      // EN: Redraw the 0.4 s peak trace above the semi-transparent label panel so near-0 dB peaks remain visible.
      drawCurve("peak04Db", "rgba(255, 255, 255, 0.95)", 1.4);

      ctx.textAlign = "left";
      ctx.font = "15px Arial";
      ctx.fillStyle = "#ddd";
      ctx.fillText("20 s level scope", left + 12, top + 24);

      ctx.font = "13px Arial";
      ctx.fillStyle = "rgba(255, 255, 255, 0.90)";
      ctx.fillText(`0.4s peak ${meters.peak04Db.toFixed(1)}`, left + 12, top + 42);
      ctx.fillStyle = "rgba(120, 210, 255, 0.92)";
      ctx.fillText(`0.4s RMS ${meters.rms04Db.toFixed(1)}`, left + 112, top + 42);
      ctx.fillStyle = "rgba(255, 210, 100, 0.96)";
      ctx.fillText(`3s RMS ${meters.rms3Db.toFixed(1)}`, left + 12, top + 60);
      ctx.fillStyle = "rgba(102, 217, 168, 0.98)";
      ctx.fillText(`K 3s ${meters.kWeightedShortScopeDb.toFixed(1)}`, left + 112, top + 60);
      ctx.fillStyle = "rgba(102, 217, 168, 0.62)";
      ctx.fillText(`K 10s ctx ${meters.kWeightedLongScopeDb.toFixed(1)}`, left + 12, top + 78);
      ctx.fillStyle = "rgba(255, 120, 220, 0.96)";
      ctx.fillText(`K env ${meters.kAdaptiveScopeDb.toFixed(1)}`, left + 112, top + 78);

      ctx.fillStyle = "#aaa";
      ctx.fillText(`env attack ${kEnvelopeAttackTauSec}s / hold ${kEnvelopeHoldSec}s / rel ${kEnvelopeReleaseDbPerSec} dB/s`, left + 12, top + 96);
      ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
      ctx.fillText(`offline LA ${kEnvelopeLookAheadSec.toFixed(2)}s`, left + 12, top + 114);

      ctx.textAlign = "right";
      ctx.fillStyle = "#aaa";
      ctx.font = "12px Arial";
      if (Number.isFinite(meters.scopeStartSec)) {
        ctx.textAlign = "left";
        ctx.fillText(formatTimeSec(startSec), left, top + height + 20);
        ctx.textAlign = "right";
        ctx.fillText(formatTimeSec(endSec), left + width, top + height + 20);
      } else {
        ctx.fillText("-20 s", left + 42, top + height + 20);
        ctx.fillText("now", left + width, top + height + 20);
      }

      ctx.restore();
    }

    // ==============================
    // BAR / GRID / HISTOGRAM RENDERING
    // ==============================
    function drawGrid(left, top, plotW, plotH, minDb, maxDb) {
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      const ticks = buildTicksForRange(minDb, maxDb);

      for (const db of ticks) {
        const norm = clamp((db - minDb) / (maxDb - minDb), 0, 1);
        const y = top + (1 - norm) * plotH;

        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + plotW, y);
        ctx.stroke();

        ctx.fillStyle = "#b3b3b3";
        ctx.font = "14px Arial";
        ctx.textAlign = "right";
        ctx.fillText(`${db.toFixed(0)}`, left - 8, y + 4);
      }

      ctx.strokeStyle = "#666";
      ctx.strokeRect(left, top, plotW, plotH);
    }

    function drawSpectrumBars(bandValues, left, top, plotW, plotH, minDb, maxDb) {
      const barGap = 4;
      const barWidth = (plotW - barGap * (bandValues.length - 1)) / bandValues.length;

      for (let i = 0; i < bandValues.length; i++) {
        const band = bandValues[i];
        const x = left + i * (barWidth + barGap);

        const norm = clamp((band.dbCal - minDb) / (maxDb - minDb), 0, 1);
        const barHeight = norm * plotH;
        const y = top + (plotH - barHeight);

        const isSupportBand = band.centerFreq >= 20 && band.centerFreq <= 63;
        const isIrritationBand = band.centerFreq === 80 || band.centerFreq === 100;
        const isAudioBand = band.centerFreq >= 125;

        ctx.save();
        ctx.globalAlpha = 0.38;
        ctx.fillStyle = isSupportBand ? "#8ef" : (isIrritationBand ? "#ffb347" : (isAudioBand ? "#c7a2ff" : "#7cf"));
        ctx.fillRect(x, y, barWidth, barHeight);
        ctx.restore();

        ctx.strokeStyle = isSupportBand ? "#e8fbff" : (isIrritationBand ? "#ffe2b5" : (isAudioBand ? "#efd8ff" : "#bfe3ff"));
        ctx.strokeRect(x, y, barWidth, barHeight);

        ctx.save();
        ctx.fillStyle = "#ddd";
        ctx.font = "13px Arial";
        ctx.textAlign = "center";
        ctx.translate(x + barWidth / 2, top + plotH + 22);
        ctx.rotate(-Math.PI / 4);
        ctx.fillText(formatFreqLabel(band.centerFreq), 0, 0);
        ctx.restore();
      }
    }

    function drawDerivedBar(x, top, width, plotH, meter, minDb, maxDb, histogramStrip = null) {
      const instantNorm = clamp((meter.instantDb - minDb) / (maxDb - minDb), 0, 1);
      const instantHeight = instantNorm * plotH;
      const y = top + (plotH - instantHeight);

      ctx.save();
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = meter.color;
      ctx.fillRect(x, y, width, instantHeight);
      ctx.restore();

      ctx.strokeStyle = meter.stroke;
      ctx.strokeRect(x, y, width, instantHeight);

      const shortNorm = clamp((meter.shortDb - minDb) / (maxDb - minDb), 0, 1);
      const yShort = top + (1 - shortNorm) * plotH;

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 3, yShort);
      ctx.lineTo(x + width - 3, yShort);
      ctx.stroke();

      // EN: Show the 3 s value just above the white marker line.
      ctx.fillStyle = meter.stroke;
      ctx.font = "13px Arial";
      ctx.textAlign = "center";
      ctx.fillText(`${meter.shortDb.toFixed(1)}`, x + width / 2, Math.max(top + 10, yShort - 6));

      if (histogramStrip && Array.isArray(histogramStrip.bins) && histogramStrip.bins.length > 0) {
        drawVerticalHistogramStrip(
          x + histogramStrip.stripGap,
          top,
          histogramStrip.stripW,
          plotH,
          histogramStrip.bins,
          histogramStrip.minDb,
          histogramStrip.maxDb,
          histogramStrip.currentDb,
          histogramStrip.lraDb,
          histogramStrip.p10Db,
          histogramStrip.p95Db,
          histogramStrip.absoluteGateDb,
          histogramStrip.relativeGateDb,
          histogramStrip.gateOn,
          histogramStrip.gateActive,
          histogramStrip.gateFlash,
          histogramStrip.gateBlockRejectedNow,
          histogramStrip.runningIntegratedDb,
          histogramStrip.runningIntegratedGateDb,
          histogramStrip.runningIntegratedStatus,
          histogramStrip.runningIntegratedAcceptedCount,
          histogramStrip.runningIntegratedTotalCount,
          histogramStrip.runningIntegratedMinBlocks
        );
      }

      ctx.fillStyle = "#fff";
      ctx.font = "15px Arial";
      ctx.fillText(meter.label, x + width / 2, top + plotH + 20);

      ctx.fillStyle = "#aaa";
      ctx.font = "13px Arial";
      ctx.fillText(meter.bottom1, x + width / 2, top + plotH + 40);
      ctx.fillText(meter.bottom2, x + width / 2, top + plotH + 58);
    }


    function getHistogramInfoLayout(left, top, width, canvasWidth) {
      // EN: Keep the histogram info panel inside the canvas while allowing it to extend left over the derived meter group.
      // EN: The right edge is anchored to the histogram strip, so text cannot overflow past the canvas edge.
      const margin = 8;
      const panelWidth = 300;
      const right = Math.min(canvasWidth - margin, left + width);
      const x = Math.max(margin, right - panelWidth);

      return {
        x,
        right,
        panelWidth: right - x,
        col1: x + 8,
        col2: x + 86,
        col3: x + 164,
        row1Y: top + 17,
        row2Y: top + 36,
        row3Y: top + 54
      };
    }

    function drawVerticalHistogramStrip(left, top, width, height, bins, minDb, maxDb, currentDb, lraDb, p10Db, p95Db, absoluteGateDb, relativeGateDb, gateOn, gateActive, gateFlash, gateBlockRejectedNow, runningIntegratedDb = null, runningIntegratedGateDb = null, runningIntegratedStatus = "warming up", runningIntegratedAcceptedCount = 0, runningIntegratedTotalCount = 0, runningIntegratedMinBlocks = 0) {
      // EN: Draw a compact vertical histogram strip using the same dB scale as the Full meter.
      // EN: Only flash on actual rejection; no persistent active-state shading.
      ctx.fillStyle = gateFlash ? "rgba(80, 0, 0, 0.45)" : "rgba(5, 5, 5, 0.18)";
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, width, height);

      const maxBin = Math.max(1, ...bins);
      // EN: bins[] is ordered from low dB to high dB.
      // EN: Draw from bottom to top so the histogram matches the vertical dB axis.
      for (let i = 0; i < bins.length; i++) {
        const binValue = bins[i];
        const drawIndex = bins.length - 1 - i;
        const y0 = top + (drawIndex / bins.length) * height;
        const y1 = top + ((drawIndex + 1) / bins.length) * height;
        const barH = Math.max(1, y1 - y0 - 1);
        const spikeW = Math.max(1, (binValue / maxBin) * (width - 2));

        ctx.fillStyle = gateFlash ? "rgba(255, 51, 51, 0.85)" : (gateOn ? "rgba(230, 230, 230, 0.55)" : "rgba(109, 140, 255, 0.55)");
        ctx.fillRect(left + 1, y0 + 0.5, spikeW, barH);
      }

      const tickStep = 10;
      ctx.strokeStyle = "#3f3f3f";
      ctx.lineWidth = 1;
      for (let db = Math.ceil(minDb / tickStep) * tickStep; db <= maxDb; db += tickStep) {
        const yTick = top + (1 - (db - minDb) / (maxDb - minDb)) * height;
        ctx.beginPath();
        ctx.moveTo(left, yTick);
        ctx.lineTo(left + width, yTick);
        ctx.stroke();
      }

      if (Number.isFinite(absoluteGateDb)) {
        const yAbsoluteGate = top + (1 - (clamp(absoluteGateDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#666";
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(left, yAbsoluteGate);
        ctx.lineTo(left + width, yAbsoluteGate);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (Number.isFinite(relativeGateDb)) {
        const yRelativeGate = top + (1 - (clamp(relativeGateDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = gateActive ? "#ff9999" : "#999";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(left, yRelativeGate);
        ctx.lineTo(left + width, yRelativeGate);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (Number.isFinite(p10Db)) {
        const yP10 = top + (1 - (clamp(p10Db, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yP10);
        ctx.lineTo(left + width, yP10);
        ctx.stroke();
      }

      if (Number.isFinite(p95Db)) {
        const yP95 = top + (1 - (clamp(p95Db, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#06d6a0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yP95);
        ctx.lineTo(left + width, yP95);
        ctx.stroke();
      }

      if (Number.isFinite(currentDb)) {
        const yCurrent = top + (1 - (clamp(currentDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yCurrent);
        ctx.lineTo(left + width, yCurrent);
        ctx.stroke();
      }

      const historySec = kWeightedShortTermRawHistory.length / loudnessUpdateHz;
      const infoLayout = getHistogramInfoLayout(left, top, width, canvas.width);

      ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
      ctx.fillRect(infoLayout.x, top + 2, infoLayout.panelWidth, 76);

      ctx.font = "bold 16px Arial";
      ctx.textAlign = "left";
      ctx.fillStyle = gateFlash ? "#ff3333" : (gateOn ? "#bdbdbd" : "#9fb3ff");
      ctx.fillText(
        gateOn
          ? (gateFlash
              ? `Hist ${historySec.toFixed(0)} s · REJECT`
              : `Hist ${historySec.toFixed(0)} s`)
          : `Hist ${historySec.toFixed(0)} s · ungated`,
        infoLayout.col1,
        infoLayout.row1Y
      );

      ctx.font = "bold 15px Arial";
      ctx.fillStyle = "#ffd166";
      ctx.fillText(Number.isFinite(p10Db) ? `p10 ${p10Db.toFixed(1)}` : "p10 --", infoLayout.col1, infoLayout.row2Y);

      ctx.fillStyle = "#06d6a0";
      ctx.fillText(Number.isFinite(p95Db) ? `p95 ${p95Db.toFixed(1)}` : "p95 --", infoLayout.col2, infoLayout.row2Y);

      ctx.fillStyle = "#ddd";
      ctx.fillText(Number.isFinite(lraDb) ? `LRA ${lraDb.toFixed(1)}` : "LRA --", infoLayout.col3, infoLayout.row2Y);

      if (gateOn && Number.isFinite(relativeGateDb)) {
        ctx.fillStyle = gateFlash ? "#ff3333" : "#aaa";
        ctx.fillText(`LRA gate ${relativeGateDb.toFixed(1)}`, infoLayout.col1, infoLayout.row3Y);
      }

      ctx.fillStyle = runningIntegratedStatus === "ready" ? "#c8ffe8" : "#aaa";
      ctx.font = "bold 14px Arial";
      const kiText = runningIntegratedStatus === "ready" && Number.isFinite(runningIntegratedDb)
        ? `K int ${runningIntegratedDb.toFixed(1)} · gate ${Number.isFinite(runningIntegratedGateDb) ? runningIntegratedGateDb.toFixed(1) : "--"}`
        : `K int warm ${runningIntegratedTotalCount}/${runningIntegratedMinBlocks}`;
      ctx.fillText(kiText, infoLayout.col1, top + 72);

      if (gateFlash) {
        ctx.fillStyle = "#ff3333";
        ctx.font = "bold 15px Arial";
        ctx.fillText(gateBlockRejectedNow ? "Rejecting current block" : "Gate flash", infoLayout.col2, infoLayout.row3Y);
      }
    }

    function buildTicksForRange(minDb, maxDb) {
      const ticks = [];
      const step = 10;
      const start = Math.ceil(minDb / step) * step;

      for (let db = start; db <= maxDb; db += step) {
        ticks.push(db);
      }

      if (!ticks.includes(minDb)) ticks.unshift(minDb);
      if (!ticks.includes(maxDb)) ticks.push(maxDb);
      return ticks;
    }

    function formatFreqLabel(freq) {
      if (freq >= 1000) {
        const k = freq / 1000;
        return Number.isInteger(k) ? `${k}k` : `${k.toFixed(1)}k`;
      }
      return `${freq}`;
    }
  </script>
