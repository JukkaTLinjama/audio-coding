<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loudness-meter-v5.48</title>
  <style>
    :root {
      --slider-track: #555;
      --slider-fill: #cfcfcf;
      --slider-thumb: #f2f2f2;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }

    button,
    input[type="range"] {
      cursor: pointer;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #242424;
      color: #eee;
    }

    button:hover:not(:disabled) {
      background: #303030;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .activeStopButton {
      color: #ff9f2a;
      border-color: #ff9f2a;
      box-shadow: 0 0 0 1px rgba(255, 159, 42, 0.35);
    }

    .filePickerButton {
      display: inline-flex;
      align-items: center;
      padding: 9px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #242424;
      color: #eee;
      cursor: pointer;
      white-space: nowrap;
    }

    .fileNameLabel {
      color: #aaa;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header {
      width: 100%;
      max-width: 1480px;
      text-align: center;
      margin-bottom: 2px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #eee;
    }

    .versionComment {
      margin-top: 4px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.45;
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;
    }

    .panel {
      width: 100%;
      max-width: 1480px;
      display: grid;
      gap: 8px;
    }

    .status {
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre-wrap;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 10px;
      line-height: 1.4;
      tab-size: 2;
    }

    .controls {
      width: 100%;
      max-width: 1480px;
      display: grid;
      gap: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 12px;
      box-sizing: border-box;
    }

    .controlRow {
      display: grid;
      grid-template-columns: 220px minmax(320px, 1fr) 210px;
      align-items: center;
      gap: 12px;
    }

    .controlRow label,
    .controlRow .value {
      font-size: 14px;
    }

    .controlRow .value {
      white-space: pre-line;
      line-height: 1.35;
    }

    .controlRow.inactive {
      opacity: 0.45;
    }

    .controlRow.inactive input[type="range"] {
      filter: grayscale(1);
    }

    .sliderWrap {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(to right, var(--slider-fill) 0%, var(--slider-fill) 0%, var(--slider-track) 0%, var(--slider-track) 100%);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 1px solid #888;
      margin-top: -5px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25);
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: var(--slider-track);
    }

    input[type="range"]::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: var(--slider-fill);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 1px solid #888;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25);
    }

    .canvasWrap {
      width: 100%;
      max-width: 1480px;
      background: #000;
      border: 1px solid #333;
      box-sizing: border-box;
      position: relative;
    }

    .canvasOverlayButton {
      position: absolute;
      right: 18px;
      top: -2px;
      z-index: 2;
      padding: 8px 12px;
      font-size: 16px;
      /* EN: Keep the scope mode text readable without covering the spectrum/grid. */
      background: transparent;
      backdrop-filter: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    canvas {
      width: 100%;
      height: 560px;
      display: block;
      background: #000;
    }

    @media (max-width: 760px) {
      .controlRow {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="pageTitle"></h1>
    <div class="versionComment" id="versionComment">v4.0</div>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap; width:100%; max-width:1480px;">
    <button id="startBtn">Start microphone</button>
    <button id="testNoiseBtn">Play test signal</button>
    <div style="display:flex; align-items:center; gap:8px; color:#eee; font-size:14px;">
      <span>Audio file</span>
      <label class="filePickerButton" for="audioFileInput">Select file</label>
      <span id="fileNameLabel" class="fileNameLabel">No file selected</span>
      <input id="audioFileInput" type="file" accept="audio/*" style="display:none;" />
    </div>
    <button id="fileRestartBtn" disabled>Restart file</button>
    <label style="display:flex; align-items:center; gap:6px; color:#eee; font-size:14px; min-width:280px; flex:1;">
      <span>File position</span>
      <input id="fileSeekSlider" type="range" min="0" max="1000" step="1" value="0" disabled style="flex:1;" />
      <span id="fileTimeLabel" style="min-width:96px; text-align:right; color:#aaa;">-- / --</span>
    </label>
    <button id="fileScopeFollowBtn" disabled>Follow scope: ON</button>
    <label style="display:flex; align-items:center; gap:6px; color:#eee; font-size:14px; min-width:280px; flex:1;">
      <span>Scope window</span>
      <input id="fileScopeSlider" type="range" min="0" max="1000" step="1" value="0" disabled style="flex:1;" />
      <span id="fileScopeLabel" style="min-width:118px; text-align:right; color:#aaa;">--</span>
    </label>
    <button id="stopBtn">Stop audio</button>
    <button id="pauseBtn">Pause analysis</button>
    <button id="gateBtn">True gating: ON</button>
  </div>

  <div class="controls">
    <div class="controlRow" id="micGainRow">
      <label for="micGainSlider">Mic input gain</label>
      <div class="sliderWrap">
        <input id="micGainSlider" type="range" min="-20" max="120" step="0.5" value="60" />
      </div>
      <div class="value" id="micGainValue">60.0 dB</div>
    </div>

    <div class="controlRow" id="testGainRow">
      <label for="testGainSlider">Test noise gain</label>
      <div class="sliderWrap">
        <input id="testGainSlider" type="range" min="-100" max="20" step="0.5" value="-12" />
      </div>
      <div class="value" id="testGainValue">-12.0 dB</div>
    </div>

    <div class="controlRow" id="sineFreqRow">
      <label for="sineFreqSlider">Test sine frequency</label>
      <div class="sliderWrap">
        <input id="sineFreqSlider" type="range" min="1.30103" max="4.20412" step="0.001" value="3" />
      </div>
      <div class="value" id="sineFreqValue">1000 Hz</div>
    </div>

    <div class="controlRow" id="sineGainRow">
      <label for="sineGainSlider">Test sine gain</label>
      <div class="sliderWrap">
        <input id="sineGainSlider" type="range" min="-80" max="20" step="0.5" value="-30" />
      </div>
      <div class="value" id="sineGainValue">-30.0 dB</div>
    </div>

    <div class="controlRow" id="steppedSineRow">
      <label>Stepped sine hold test</label>
      <div style="display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;">
        <button id="steppedSineMinusBtn" type="button">−</button>
        <div id="steppedSineFreqValue" class="value" style="min-width:92px; text-align:center; font-size:18px;">80 Hz</div>
        <button id="steppedSinePlusBtn" type="button">+</button>
      </div>
      <div class="value" id="steppedSineInfoValue">hold button = play; release = step</div>
    </div>

    <div class="controlRow">
      <label for="listeningLevelSlider">TFC Listening Level / output gain</label>
      <div class="sliderWrap">
        <input id="listeningLevelSlider" type="range" min="-12" max="12" step="0.5" value="0" />
      </div>
      <div class="value" id="listeningLevelValue">0.0 dB</div>
    </div>

    <div class="controlRow">
      <label for="deviceGainSlider">Device strength calibration</label>
      <div class="sliderWrap">
        <input id="deviceGainSlider" type="range" min="-12" max="12" step="0.5" value="0" />
      </div>
      <div class="value" id="deviceGainValue">Device: neutral / 0.0 dB</div>
    </div>

    <div class="controlRow" style="display:none;">
      <label for="tfcIrrPreviewLimiterBtn">T Irr preview EQ disabled</label>
      <div>
        <button id="tfcIrrPreviewLimiterBtn" type="button">T Irr preview EQ: OFF</button>
      </div>
      <div class="value" id="tfcIrrPreviewLimiterValue">disabled</div>
    </div>

    <div class="controlRow">
      <label for="tfcPreAnalysisLimiterBtn">TFC A/B irritation limiter</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="tfcPreAnalysisLimiterBtn" type="button">TFC: OFF</button>
        <button id="tfcStepTestBtn" type="button">Run TFC step test</button>
      </div>
      <div class="value" id="tfcPreAnalysisLimiterValue">dry -- / wet -- / red 0.0 dB</div>
    </div>
  </div>

  <div class="canvasWrap">
    <button id="scopeModeBtn" class="canvasOverlayButton" type="button">20 s scope: K</button>
    <canvas id="viz" width="1400" height="560"></canvas>
  </div>

  <div class="panel">
    <div id="status" class="status">Not started</div>
  </div>

  <script>
    /*
      Web Loudness Meter – v5.6 (experimental)

      STATUS:
      - Browser-based loudness visualization tool
      - Supports microphone input, internal test noise, audio file playback, and whole-file offline analysis
      - Includes spectrum bars, realtime/offline scopes, histogram, LRA-style dynamics, running K integrated estimate, and 10 s segment analysis
      - Designed for debugging, iteration, and open-source development

      EXPERIMENTAL FEATURE:
      - TUFS is an experimental tactile-loudness-analysis idea developed alongside LUFS-style logic
      - v5.12 uses T as the tactile support channel first; irritation is intentionally left for the next tested step
      - TUFS is not standardized and should be treated as a research feature

      LIMITATIONS:
      - Not a full ITU-R BS.1770 / EBU R128 implementation; all loudness values are estimates
      - Input gain is applied inside the realtime analysis path and remembered separately for mic and test noise
      - Display scale is fixed; there is no separate SPL calibration in this prototype
      - Internal test noise is useful for debugging, but is not a certified LUFS reference signal

      ARCHITECTURE:
      - Single-file prototype to keep the signal path transparent and easy to debug
      - One active input path at a time: microphone, internal test noise, or decoded audio file
      - Realtime and offline analysis store energy as raw linear values whenever possible
      - Conversion to dB is intentionally delayed until metric, gating, or rendering time
    */
    // ==============================
    // DOM REFERENCES
    // ==============================
    const startBtn = document.getElementById("startBtn");
    const testNoiseBtn = document.getElementById("testNoiseBtn");
    const audioFileInputEl = document.getElementById("audioFileInput");
    const fileRestartBtn = document.getElementById("fileRestartBtn");
    const fileSeekSliderEl = document.getElementById("fileSeekSlider");
    const fileTimeLabelEl = document.getElementById("fileTimeLabel");
    const fileNameLabelEl = document.getElementById("fileNameLabel");
    const fileScopeFollowBtn = document.getElementById("fileScopeFollowBtn");
    const fileScopeSliderEl = document.getElementById("fileScopeSlider");
    const fileScopeLabelEl = document.getElementById("fileScopeLabel");
    const stopBtn = document.getElementById("stopBtn");
    const pageTitleEl = document.getElementById("pageTitle");
    const versionCommentEl = document.getElementById("versionComment");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    const micGainRowEl = document.getElementById("micGainRow");
    const testGainRowEl = document.getElementById("testGainRow");
    const micGainSliderEl = document.getElementById("micGainSlider");
    const micGainValueEl = document.getElementById("micGainValue");
    const testGainSliderEl = document.getElementById("testGainSlider");
    const testGainValueEl = document.getElementById("testGainValue");
    const sineFreqRowEl = document.getElementById("sineFreqRow");
    const sineGainRowEl = document.getElementById("sineGainRow");
    const sineFreqSliderEl = document.getElementById("sineFreqSlider");
    const sineFreqValueEl = document.getElementById("sineFreqValue");
    const sineGainSliderEl = document.getElementById("sineGainSlider");
    const sineGainValueEl = document.getElementById("sineGainValue");
    const steppedSineRowEl = document.getElementById("steppedSineRow");
    const steppedSineMinusBtn = document.getElementById("steppedSineMinusBtn");
    const steppedSinePlusBtn = document.getElementById("steppedSinePlusBtn");
    const steppedSineFreqValueEl = document.getElementById("steppedSineFreqValue");
    const steppedSineInfoValueEl = document.getElementById("steppedSineInfoValue");
    const pauseBtn = document.getElementById("pauseBtn");
    const gateBtn = document.getElementById("gateBtn");
    const scopeModeBtn = document.getElementById("scopeModeBtn");
    const listeningLevelSliderEl = document.getElementById("listeningLevelSlider");
    const listeningLevelValueEl = document.getElementById("listeningLevelValue");
    const deviceGainSliderEl = document.getElementById("deviceGainSlider");
    const deviceGainValueEl = document.getElementById("deviceGainValue");
    const tfcIrrPreviewLimiterBtn = document.getElementById("tfcIrrPreviewLimiterBtn");
    const tfcIrrPreviewLimiterValueEl = document.getElementById("tfcIrrPreviewLimiterValue");
    const tfcPreAnalysisLimiterBtn = document.getElementById("tfcPreAnalysisLimiterBtn");
    const tfcPreAnalysisLimiterValueEl = document.getElementById("tfcPreAnalysisLimiterValue");
    const tfcStepTestBtn = document.getElementById("tfcStepTestBtn");

    pageTitleEl.textContent = document.title;
    versionCommentEl.textContent = "v5.46 – Adds TFC model validation readouts, a 0 dB error/reduction reference line, and parallel passive leveler target estimates without changing limiter DSP.";

    // ==============================
    // DEBUG / DIAGNOSTICS
    // ==============================
    // EN: Keep false during normal use to avoid noisy 1 Hz console logging.
    // EN: Set true temporarily when inspecting analyser or exposure state in DevTools.
    const DEBUG_LOGS = false;

    // ==============================
    // CENTRAL STATE SCAFFOLD
    // ==============================
    // EN: New code should prefer this state container.
    // EN: Existing globals are intentionally left in place to avoid risky behavior changes in the single-file prototype.
    const state = {
      audio: {
        mode: null,
        paused: false
      },
      analysis: {
        paused: false
      },
      histories: {
        loudness: {},
        histogram: {},
        scope: {}
      },
      layout: {},
      // EN: Passive leveler state only. This is intentionally not connected to audio gain yet.
      levelerGainDb: 0,
      levelerTargetDb: null,
      levelerTargetFromP95Db: null,
      levelerTargetFromLimitDb: null,
      levelerSlowEstimateDb: null,
      tfcModelErrorDb: null
    };

    // ==============================
    // AUDIO NODES & RUNTIME FLAGS
    // ==============================
    let audioContext = null;
    let analyser = null;
    let kAnalyser = null;
    let kPreFilterNode = null;
    let kHighpassNode = null;
    let analysisInputBusNode = null;
    let analysisBusRouted = false;
    let source = null;
    let micStream = null;
    let micGainNode = null;
    let freqData = null;
    let timeData = null;
    let kTimeData = null;
    let animationId = null;

    let activeInputMode = null;
    let analysisPaused = false;
    let testNoiseGainNode = null;
    let testNoiseHighpassNode = null;
    let testNoiseBufferSource = null;
    let fileAudioBuffer = null;
    let fileBufferSource = null;
    let fileGainNode = null;
    let tfcPreviewGainNode = null;
    let tfcIrritationPreviewEqNode = null;
    let fileStartedAtContextTime = 0;
    let filePlaybackOffsetSec = 0;
    let fileSeekIsDragging = false;
    let fileScopeViewStartSec = 0;
    let fileScopeFollowPlayback = true;
    let fileScopeSliderIsDragging = false;
    let filePlaybackEnded = false;
    let lastFileStatusUpdateMs = 0;
    let lastRealtimeStatusUpdateMs = 0;

    // EN: Whole-file offline analysis cache for decoded audio files.
    // EN: Values are stored as linear energy and converted to dB only for display.
    const fileAnalysis = {
      ready: false,
      running: false,
      fileName: "",
      sampleRate: 0,
      durationSec: 0,
      blockStepSec: 0.1,
      blockSizeSec: 0.4,
      times: [],
      rms04: [],
      rms3: [],
      k04: [],
      k3: [],
      k30: [],
      kAdaptive: [],
      kAdaptiveLookAhead: [],
      peak04: [],
      tSupport04: [],
      tSupport3: [],
      tSupportAdaptive: [],
      tSupportNeed: [],
      tSupportModDb: [],
      tSupportCrestDb: [],
      tIrritation04: [],
      tIrritation3: [],
      tIrritationAdaptive: [],
      tIrritationExcess: [],
      tIrritationIntegratedEstimateDb: null,
      tIrritationGateThresholdDb: null,
      tIrritationLraEstimateDb: null,
      tIrritationLraGateThresholdDb: null,
      tIrritationLraP10Db: null,
      tIrritationLraP95Db: null,
      tIrritationP99Db: null,
      tIrritationMaxDb: null,
      tIrritationOverLimitPercent: null,
      tIrritationMaxOvershootDb: null,
      tIrritationAcceptedCount: 0,
      tIrritationTotalCount: 0,
      tSupportIntegratedEstimateDb: null,
      tSupportGateThresholdDb: null,
      tSupportLraEstimateDb: null,
      tSupportLraGateThresholdDb: null,
      tSupportLraP10Db: null,
      tSupportLraP95Db: null,
      tSupportP99Db: null,
      tSupportMaxDb: null,
      tSupportMeanCrestDb: null,
      tSupportMeanModDb: null,
      tSupportAcceptedCount: 0,
      tSupportTotalCount: 0,
      kIntegratedEstimateDb: null,
      gateThresholdDb: null,
      lraEstimateDb: null,
      lraGateThresholdDb: null,
      lraP10Db: null,
      lraP95Db: null,
      kP99Db: null,
      kMaxDb: null,
      programCharacter: "--",
      lraAcceptedCount: 0,
      lraTotalCount: 0,
      absoluteAcceptedCount: 0,
      relativeAcceptedCount: 0,
      totalBlockCount: 0,
      segmentSec: 10,
      segments: [],
      loudestSegmentIndex: -1,
      quietestSegmentIndex: -1,
      segmentRangeLu: null
    };

    let testSineOscillatorNode = null;
    let testSineGainNode = null;
    let steppedSineOscillatorNode = null;
    let steppedSineGainNode = null;
    let steppedSineDirection = 1;
    let lastAnalyserDebugLogTimeMs = 0;
    let lastExposureDebugLogTimeMs = 0;
    let gateFlashUntilMs = 0;

    // EN: Tracks if the CURRENT short-term block is rejected by the gate.
    // EN: Used for momentary flash instead of persistent "gate active" shading.
    let gateBlockRejectedNow = false;

    let audioPaused = false;

    let micInputGainDb = 60;
    let testInputGainDb = -12;
    let testSineFrequencyHz = logSliderValueToFrequency(Number(sineFreqSliderEl.value));
    let testSineGainDb = Number(sineGainSliderEl.value);
    const steppedSineFrequenciesHz = [20, 25, 31.5, 40, 50, 63, 71, 80, 90, 100, 112, 120];
    let steppedSineIndex = steppedSineFrequenciesHz.indexOf(80);
    if (steppedSineIndex < 0) steppedSineIndex = 7;
    let listeningLevelDb = Number(listeningLevelSliderEl.value);
    let deviceGainDb = Number(deviceGainSliderEl.value);
    let passiveLevelerSlowEstimateDb = null;

    // EN: Fixed preview headroom for audible TFC testing.
    // EN: Slider center (0 dB context) plays back at -12 dB output gain.
    // EN: Slider max (+12 dB context) reaches 0 dB output gain.
    const tfcPreviewHeadroomDb = -12.0;
    let tfcPreviewOutputGainDb = tfcPreviewHeadroomDb + listeningLevelDb;

    let tfcIrrPreviewLimiterEnabled = false;
    let tfcIrrPreviewGainReductionDb = 0;
    let tfcIrrPreviewLimitDb = null;

    // EN: Optional true signal-path prototype. When enabled, the irritation EQ is placed before analyser/K/T paths.
    // EN: This intentionally allows the analyser to measure wet T Irritation, so limiter behavior becomes observable.
    let tfcPreAnalysisLimiterEnabled = false;
    let tfcPreAnalysisEqNode = null;
    let tfcPreAnalysisDryAnalyser = null;
    let tfcPreAnalysisDryFreqData = null;
    let tfcPreAnalysisDryTimeData = null;
    let tfcPreAnalysisGainReductionDb = 0;
    let tfcPreAnalysisTargetGainReductionDb = 0;
    let tfcPreAnalysisReductionLastUpdateSec = null;
    // EN: Coefficient-based limiter envelope. At 10 Hz, these start near ~50-100 ms attack and ~500-1000 ms release behavior.
    const tfcPreAnalysisReductionAttackCoeff = 0.45;
    const tfcPreAnalysisReductionReleaseCoeff = 0.06;
    // EN: Tau values are retained for EQ parameter smoothing only; control smoothing uses the explicit coeff state above.
    const tfcPreAnalysisReductionAttackSec = 0.05;
    const tfcPreAnalysisReductionReleaseSec = 0.80;
    let tfcPreAnalysisLimitDb = null;
    let tfcPreAnalysisFrozenBaseLimitDb = null;
    let tfcPreAnalysisEqAppliedGainDb = 0;
    let tfcPreAnalysisDryIrritationDb = null;
    let tfcPreAnalysisWetIrritationDb = null;

    // EN: Program-derived absolute-limit prototype.
    // EN: p95/adapt gives the program anchor; this fixed offset makes the limit stricter without adding a new slider.
    const tfcIrrProgramHeadroomDb = -9.0;

    // ==============================
    // ANALYSIS CONSTANTS
    // ==============================
    const displayMinDb = -60;
    const displayMaxDb = 12;
    
    const thirdOctaveCenters = [
      20, 25, 31.5, 40, 50, 63, 80, 100, 125,
      160, 200, 250, 315, 400, 500, 630, 800,
      1000, 1250, 1600, 2000, 2500, 3150, 4000,
      5000, 6300, 8000, 10000, 12500, 16000
    ];

    const shortTermWindowSec = 3.0;

    // EN: Experimental program-context window.
    // EN: v5.1 uses 10 s instead of 30 s to test faster section-level response.
    // EN: It must average LINEAR energy, not dB values, because dB averaging is physically wrong for energy.
    const longTermExposureWindowSec = 10.0;

    // ==============================
    // K ENVELOPE FOLLOWER + LOOK-AHEAD
    // ==============================
    // EN: Experimental psychoacoustic-style context model, not a LUFS standard.
    // EN: Fast attack follows 0.4 s K energy so sudden loud events raise context quickly.
    // EN: A short hold prevents immediate release between adjacent loud blocks.
    // EN: Release is a constant dB/s slope, closer to a broadcast-style envelope follower than a moving average.
    const kEnvelopeAttackTauSec = 0.08;
    const kEnvelopeHoldSec = 1.00;
    const kEnvelopeReleaseDbPerSec = 5.0;
    const kEnvelopeDynamicRangeDb = 60.0;
    const kEnvelopeStartEaseDb = 10.0;
    const kEnvelopeEndEaseDb = 10.0;
    const kEnvelopeFloorDb = -100.0;
    const kEnvelopeLookAheadSec = 0.20;

    // EN: Initial T Support test intentionally uses the same adaptation constants as K.

    function formatSineFrequency(freqHz) {
      if (freqHz >= 1000) {

      micGainNode.gain.cancelScheduledValues(now);

        micGainNode.gain.exponentialRampToValueAtTime(linearGain, now + 0.15);
      } else {
        micGainNode.gain.setTargetAtTime(linearGain, now, 0.02);

      console.log("[microphone] input gain updated from slider", { targetGainDb, linearGain, isInitialStart });
    }

    function ensureAudioContext() {

          sampleRate: audioContext.sampleRate,
          activeInputMode
        });

    async function resumeAudioContextIfNeeded(reason) {

      console.log("[audioContext] resume check", { reason, state: audioContext.state });

    function setupAnalyser() {
      if (analyser) {
        console.log("[analyser] reuse existing analyser", {
          fftSize: analyser.fftSize,
          frequencyBinCount: analyser.frequencyBinCount
        });
        return analyser;
      }

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 8192;
      analyser.smoothingTimeConstant = 0.85;
      analyser.minDecibels = -100;
      analyser.maxDecibels = -20;

      freqData = new Float32Array(analyser.frequencyBinCount);
      timeData = new Float32Array(analyser.fftSize);

      console.log("[analyser] created", {
        fftSize: analyser.fftSize,
        frequencyBinCount: analyser.frequencyBinCount,
        smoothingTimeConstant: analyser.smoothingTimeConstant
      });

      setupKWeightedAnalyser();
      return analyser;
    }

    function setupKWeightedAnalyser() {
      if (kAnalyser) {
        console.log("[kWeighting] reuse existing analyser", {
          fftSize: kAnalyser.fftSize,
          frequencyBinCount: kAnalyser.frequencyBinCount
        });
        return kAnalyser;
      }

      // EN: Parallel K-style path for comparison only.
      // EN: This approximates BS.1770-style weighting with a high shelf plus low-frequency high-pass.
      // EN: It intentionally does not replace the existing Full / histogram / gate path in v4.12.
      kPreFilterNode = audioContext.createBiquadFilter();
      kPreFilterNode.type = "highshelf";
      kPreFilterNode.frequency.value = 1500;
      kPreFilterNode.gain.value = 4.0;

      kHighpassNode = audioContext.createBiquadFilter();
      kHighpassNode.type = "highpass";
      kHighpassNode.frequency.value = 60;
      kHighpassNode.Q.value = 0.5;

      kAnalyser = audioContext.createAnalyser();
      kAnalyser.fftSize = analyser ? analyser.fftSize : 8192;
      kAnalyser.smoothingTimeConstant = 0.0;

      kTimeData = new Float32Array(kAnalyser.fftSize);

      kPreFilterNode.connect(kHighpassNode);
      kHighpassNode.connect(kAnalyser);

      console.log("[kWeighting] created parallel K-style analyser", {
        highShelfHz: kPreFilterNode.frequency.value,
        highShelfGainDb: kPreFilterNode.gain.value,
        highpassHz: kHighpassNode.frequency.value,
        highpassQ: kHighpassNode.Q.value
      });

      return kAnalyser;
    }

    function ensureTfcPreAnalysisEqNode() {
      if (tfcPreAnalysisEqNode || !audioContext) return tfcPreAnalysisEqNode;

      // EN: Real prototype limiter element. It is a fixed irritation-band peaking EQ before analyser.
      // EN: Gain is driven dynamically from T Irr excess; this is not yet multiband compression.
      tfcPreAnalysisEqNode = audioContext.createBiquadFilter();
      tfcPreAnalysisEqNode.type = "peaking";
      tfcPreAnalysisEqNode.frequency.value = 90;
      tfcPreAnalysisEqNode.Q.value = 1.1;
      tfcPreAnalysisEqNode.gain.value = 0;

      console.log("[tfcPreAnalysisEq] created", {
        type: tfcPreAnalysisEqNode.type,
        frequencyHz: tfcPreAnalysisEqNode.frequency.value,
        q: tfcPreAnalysisEqNode.Q.value
      });

      return tfcPreAnalysisEqNode;
    }

    function ensureTfcPreAnalysisDryAnalyser() {
      if (tfcPreAnalysisDryAnalyser || !audioContext) return tfcPreAnalysisDryAnalyser;

      // EN: Dry analyser taps the source before the pre-analysis EQ.
      // EN: It is diagnostic-only and does not feed the audible output.
      tfcPreAnalysisDryAnalyser = audioContext.createAnalyser();
      tfcPreAnalysisDryAnalyser.fftSize = analyser ? analyser.fftSize : 8192;
      tfcPreAnalysisDryAnalyser.smoothingTimeConstant = 0.85;
      tfcPreAnalysisDryAnalyser.minDecibels = -100;
      tfcPreAnalysisDryAnalyser.maxDecibels = -20;
      tfcPreAnalysisDryFreqData = new Float32Array(tfcPreAnalysisDryAnalyser.frequencyBinCount);
      tfcPreAnalysisDryTimeData = new Float32Array(tfcPreAnalysisDryAnalyser.fftSize);

      console.log("[tfcPreAnalysisDryAnalyser] created", {
        fftSize: tfcPreAnalysisDryAnalyser.fftSize,
        frequencyBinCount: tfcPreAnalysisDryAnalyser.frequencyBinCount
      });

      return tfcPreAnalysisDryAnalyser;
    }

    function ensureAnalysisInputBus() {
      if (analysisInputBusNode || !audioContext) return analysisInputBusNode;

      // EN: All active live sources are summed here before the analyser path.
      // EN: This prevents accidental duplicate analyser/K-path connections when test sine and noise are both active.
      analysisInputBusNode = audioContext.createGain();
      analysisInputBusNode.gain.value = 1.0;
      analysisBusRouted = false;
      console.log("[analysisBus] created single input bus");
      return analysisInputBusNode;
    }

    function routeAnalysisBusIfNeeded() {
      if (!audioContext || !analyser) return;
      const bus = ensureAnalysisInputBus();
      if (!bus || analysisBusRouted) return;

      const tfcEqNode = ensureTfcPreAnalysisEqNode();
      const dryAnalyser = ensureTfcPreAnalysisDryAnalyser();
      setupKWeightedAnalyser();

      // EN: Rebuild analyser-side routing once per active source set.
      // EN: Source nodes connect only to analysisInputBusNode; the bus owns analyser/K/TFC routing.
      try { bus.disconnect(); } catch (error) {}
      try { tfcEqNode.disconnect(); } catch (error) {}
      try { kPreFilterNode.disconnect(); } catch (error) {}
      try { kHighpassNode.disconnect(); } catch (error) {}
      try { dryAnalyser.disconnect(); } catch (error) {}

      bus.connect(dryAnalyser);
      bus.connect(tfcEqNode);
      tfcEqNode.connect(analyser);
      tfcEqNode.connect(kPreFilterNode);
      kPreFilterNode.connect(kHighpassNode);
      kHighpassNode.connect(kAnalyser);

      analysisBusRouted = true;
      updateTfcPreAnalysisLimiterEq(true);
      console.log("[analysisBus] routed once to dry tap, TFC EQ, analyser, and K path");
    }

    function connectAnalysisOutputs(inputNode) {
      const bus = ensureAnalysisInputBus();
      if (!inputNode || !bus) return;

      // EN: Avoid stacking the same node into the bus more than once after restarts/seeks.
      try { inputNode.disconnect(bus); } catch (error) {}
      inputNode.connect(bus);
      routeAnalysisBusIfNeeded();
    }

    function stopMicrophoneIfRunning() {

    function updateTfcPreviewGain(isInitialStart = false) {
      if (!tfcPreviewGainNode || !audioContext) return;

      // EN: Listening Level is both model context and audible preview gain.
      // EN: The audible path uses fixed -12 dB headroom so upward listening tests do not clip immediately.
      // EN: This is still only a manual test tool, not automatic TFC gain control.
      tfcPreviewOutputGainDb = getTfcPreviewOutputGainDb();

    function updateTfcIrritationPreviewEq(isInitialStart = false) {
      if (!tfcIrritationPreviewEqNode || !audioContext) return;

      const now = audioContext.currentTime;
      // EN: Post-analysis preview EQ is disabled. Keep any previously-created node flat for safety.
      tfcIrrPreviewLimiterEnabled = false;

      tfcIrritationPreviewEqNode.gain.cancelScheduledValues(now);

      // EN: Disabled in v5.27. The real A/B limiter path owns the limit and reduction diagnostics.
      tfcIrrPreviewLimitDb = getTfcIrritationLimitDb(programIrritationP95Db, tIrritationEnvelopeDb, currentIrritationDb);

    function updateTfcPreAnalysisLimiterControl(dryIrritationDb, wetIrritationDb, programIrritationP95Db = null) {
      // EN: Dry irritation is the only control signal. Wet irritation is diagnostic only.
      // EN: The base reference is frozen when TFC is enabled to prevent slow control/reference drift.
      const controlIrritationDb = Number.isFinite(dryIrritationDb) ? dryIrritationDb : wetIrritationDb;
      const liveFallbackBaseDb = getTfcIrritationBaseLimitDb(programIrritationP95Db, tIrritationEnvelopeDb, controlIrritationDb);

      if (tfcPreAnalysisLimiterEnabled && tfcPreAnalysisFrozenBaseLimitDb === null && Number.isFinite(liveFallbackBaseDb)) {
        // EN: Freeze program/adapt reference for this A/B pass.
        // EN: This keeps the limiter from chasing its own wet output through slow histories.
        tfcPreAnalysisFrozenBaseLimitDb = liveFallbackBaseDb;
      }

      const baseForLimitDb = tfcPreAnalysisLimiterEnabled && Number.isFinite(tfcPreAnalysisFrozenBaseLimitDb)
        ? tfcPreAnalysisFrozenBaseLimitDb
        : liveFallbackBaseDb;

      tfcPreAnalysisLimitDb = getTfcIrritationLimitFromBaseDb(baseForLimitDb);
      const excessDb = Number.isFinite(controlIrritationDb) && Number.isFinite(tfcPreAnalysisLimitDb)
        ? controlIrritationDb - tfcPreAnalysisLimitDb
        : 0;

      tfcPreAnalysisTargetGainReductionDb = clamp(softKneeReductionDb(excessDb), 0, 12);
      tfcPreAnalysisGainReductionDb = smoothTfcReductionDb(tfcPreAnalysisGainReductionDb, tfcPreAnalysisTargetGainReductionDb);
      tfcPreAnalysisDryIrritationDb = dryIrritationDb;
      tfcPreAnalysisWetIrritationDb = wetIrritationDb;
      updateTfcPreAnalysisLimiterEq();
    }

    function resetTfcAbDiagnostics(reason = "TFC reset") {
      // EN: Reset only TFC control/diagnostic state; do not clear the main loudness histories.
      tfcPreAnalysisTargetGainReductionDb = 0;
      tfcPreAnalysisGainReductionDb = 0;
      tfcPreAnalysisReductionLastUpdateSec = null;
      tfcPreAnalysisLimitDb = null;
      tfcPreAnalysisFrozenBaseLimitDb = null;
      tfcPreAnalysisEqAppliedGainDb = 0;
      tfcPreAnalysisDryIrritationDb = null;
      tfcPreAnalysisWetIrritationDb = null;
      updateTfcPreAnalysisLimiterEq(true);
      console.log("[tfcAB] diagnostics reset", { reason });
    }

    function smoothTfcReductionDb(currentDb, targetDb) {
      const nowSec = performance.now() * 0.001;
      const safeTargetDb = Number.isFinite(targetDb) ? targetDb : 0;
      const safeCurrentDb = Number.isFinite(currentDb) ? currentDb : 0;

      if (tfcPreAnalysisReductionLastUpdateSec === null) {
        tfcPreAnalysisReductionLastUpdateSec = nowSec;
      } else {
        tfcPreAnalysisReductionLastUpdateSec = nowSec;
      }

      // EN: Asymmetric envelope follower for limiter control.
      // EN: Attack reacts quickly to new excess; release returns slowly to avoid pumping and oscillation.
      const coeff = safeTargetDb > safeCurrentDb
        ? tfcPreAnalysisReductionAttackCoeff
        : tfcPreAnalysisReductionReleaseCoeff;

      return safeCurrentDb + (safeTargetDb - safeCurrentDb) * coeff;
    }

    function updateTfcPreAnalysisLimiterEq(isInitialStart = false) {
      const targetGainDb = tfcPreAnalysisLimiterEnabled ? -Math.max(0, tfcPreAnalysisGainReductionDb) : 0;
      tfcPreAnalysisEqAppliedGainDb = targetGainDb;

      if (!tfcPreAnalysisEqNode || !audioContext) {
        if (tfcPreAnalysisLimiterValueEl) {
          tfcPreAnalysisLimiterValueEl.textContent = [
            `dry ${formatNullableDb(tfcPreAnalysisDryIrritationDb)}`,
            `wet ${formatNullableDb(tfcPreAnalysisWetIrritationDb)}`,
            `EQ ${targetGainDb.toFixed(1)} dB`
          ].join("\n");
        }
        return;
      }

      const now = audioContext.currentTime;

      // EN: This is the only write to the pre-analysis EQ gain.
      // EN: Keep a current value before scheduling the target so repeated UI/control updates do not leave stale automation behind.
      tfcPreAnalysisEqNode.gain.cancelScheduledValues(now);
      tfcPreAnalysisEqNode.gain.setValueAtTime(tfcPreAnalysisEqNode.gain.value, now);
      tfcPreAnalysisEqNode.gain.setTargetAtTime(targetGainDb, now, isInitialStart ? 0.005 : 0.02);

      if (tfcPreAnalysisLimiterValueEl) {
        const wetText = Number.isFinite(tfcPreAnalysisWetIrritationDb) ? tfcPreAnalysisWetIrritationDb.toFixed(1) : "--";
        const dryText = Number.isFinite(tfcPreAnalysisDryIrritationDb) ? tfcPreAnalysisDryIrritationDb.toFixed(1) : "--";
        const limitText = Number.isFinite(tfcPreAnalysisLimitDb) ? tfcPreAnalysisLimitDb.toFixed(1) : "--";
        tfcPreAnalysisLimiterValueEl.textContent = [
          `dry ${dryText}`,
          `wet ${wetText}`,
          `EQ ${targetGainDb.toFixed(1)} / tgt ${(-tfcPreAnalysisTargetGainReductionDb).toFixed(1)}`,
          `lim ${limitText}`
        ].join("\n");
      }
    }

    function formatTimeSec(timeSec) {
      if (!isFinite(timeSec)) return "--";
      const safeTime = Math.max(0, timeSec);
      const minutes = Math.floor(safeTime / 60);
      const seconds = safeTime - minutes * 60;
      return `${minutes}:${seconds.toFixed(1).padStart(4, "0")}`;

    function getFilePlaybackTimeSec() {
      if (!audioContext || activeInputMode !== "file" || !fileAudioBuffer) return 0;

    function updateFilePlaybackUI() {
      const fileIsAvailable = !!fileAudioBuffer;
      const fileIsActive = activeInputMode === "file" && fileIsAvailable;

      fileRestartBtn.disabled = !fileIsAvailable;
      fileSeekSliderEl.disabled = !fileIsAvailable;
      fileScopeFollowBtn.disabled = !fileIsAvailable;
      fileScopeSliderEl.disabled = !fileIsAvailable || fileScopeFollowPlayback;
      fileScopeFollowBtn.textContent = `Follow scope: ${fileScopeFollowPlayback ? "ON" : "OFF"}`;

      if (!fileIsAvailable) {
        fileSeekSliderEl.value = "0";
        fileScopeSliderEl.value = "0";
        fileTimeLabelEl.textContent = "-- / --";
        fileScopeLabelEl.textContent = "--";
        return;
      }

      const durationSec = fileAudioBuffer.duration;
      const positionSec = fileIsActive ? getFilePlaybackTimeSec() : filePlaybackOffsetSec;
      const maxScopeStartSec = Math.max(0, durationSec - levelScopeWindowSec);

      if (fileScopeFollowPlayback) {
        // EN: In follow mode the right edge of the offline scope is the playback cursor.
        // EN: At the beginning this allows a negative virtual start time, leaving empty space on the left like realtime scope startup.
        fileScopeViewStartSec = positionSec - levelScopeWindowSec;
      } else {
        fileScopeViewStartSec = clamp(fileScopeViewStartSec, 0, maxScopeStartSec);
      }

      if (!fileSeekIsDragging) {
        const sliderValue = durationSec > 0 ? Math.round((positionSec / durationSec) * 1000) : 0;
        fileSeekSliderEl.value = String(clamp(sliderValue, 0, 1000));
      }

      if (!fileScopeSliderIsDragging) {
        const scopeSliderValue = maxScopeStartSec > 0 ? Math.round((fileScopeViewStartSec / maxScopeStartSec) * 1000) : 0;
        fileScopeSliderEl.value = String(clamp(scopeSliderValue, 0, 1000));
      }

      const scopeEndSec = fileScopeFollowPlayback
        ? positionSec
        : Math.min(durationSec, fileScopeViewStartSec + levelScopeWindowSec);
      const scopeLabelStartSec = Math.max(0, fileScopeViewStartSec);
      fileTimeLabelEl.textContent = `${formatTimeSec(positionSec)} / ${formatTimeSec(durationSec)}`;
      fileScopeLabelEl.textContent = `${formatTimeSec(scopeLabelStartSec)}–${formatTimeSec(scopeEndSec)}`;
    }

    function buildPinkNoiseBuffer(context, durationSec = 2.0) {
      const length = Math.max(1, Math.floor(context.sampleRate * durationSec));
      const buffer = context.createBuffer(1, length, context.sampleRate);
      const data = buffer.getChannelData(0);

      let b0 = 0;
      let b1 = 0;
      let b2 = 0;
      let b3 = 0;
      let b4 = 0;
      let b5 = 0;
      let b6 = 0;

      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        b6 = white * 0.115926;
        data[i] = pink * 0.11;
      }

      console.log("[testNoise] pink noise buffer built", {
        durationSec,
        sampleRate: context.sampleRate,
        length
      });

      return buffer;
    }

    async function startSteppedSineHold(direction) {
      if (steppedSineOscillatorNode) return;
      steppedSineDirection = direction;
      await prepareTestSignalPath("stepped sine hold start");

      const freqHz = getCurrentSteppedSineFrequencyHz();
      steppedSineOscillatorNode = audioContext.createOscillator();
      steppedSineOscillatorNode.type = "sine";
      steppedSineOscillatorNode.frequency.value = freqHz;
      steppedSineGainNode = audioContext.createGain();
      steppedSineGainNode.gain.value = 0.0001;

      steppedSineOscillatorNode.connect(steppedSineGainNode);
      connectAnalysisOutputs(steppedSineGainNode);

      const now = audioContext.currentTime;
      const startAt = now + 0.02;
      const fadeInSec = 0.08;
      steppedSineGainNode.gain.cancelScheduledValues(now);
      steppedSineGainNode.gain.setValueAtTime(0.0001, now);
      // EN: Start from near-silence before oscillator start so the first non-zero sample is ramped in.
      steppedSineGainNode.gain.setValueAtTime(0.0001, startAt);
      steppedSineGainNode.gain.exponentialRampToValueAtTime(gainDbToLinear(testSineGainDb), startAt + fadeInSec);
      steppedSineOscillatorNode.start(startAt);

      updateSteppedSineUI(true);
      console.log("[steppedSine] hold start", { freqHz, testSineGainDb, direction, fadeInSec });
    }

    function stopSteppedSineHold(advanceAfterStop = true) {
      const oscNode = steppedSineOscillatorNode;
      const gainNode = steppedSineGainNode;
      const hadNode = !!oscNode;
      const fadeOutSec = 0.10;
      const stopDelaySec = 0.13;

      if (gainNode && audioContext) {
        const now = audioContext.currentTime;
        try {
          gainNode.gain.cancelScheduledValues(now);
          // EN: Do not disconnect immediately; ramp to near-silence first to avoid release clicks.
          gainNode.gain.setValueAtTime(Math.max(0.0001, gainNode.gain.value), now);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + fadeOutSec);
        } catch (error) {
          console.warn("[steppedSine] fade out failed", error);
        }
      }

      if (oscNode && audioContext) {
        oscNode.onended = () => {
          try { oscNode.disconnect(); } catch (error) {}
          if (gainNode) {
            try { gainNode.disconnect(); } catch (error) {}
          }
        };
        try { oscNode.stop(audioContext.currentTime + stopDelaySec); } catch (error) {}
      }

      steppedSineOscillatorNode = null;
      steppedSineGainNode = null;

      if (hadNode && advanceAfterStop) {
        advanceSteppedSineIndex(steppedSineDirection);
      } else {
        updateSteppedSineUI(false);
      }
    }

    async function analyzeAudioFileOffline(audioBuffer, fileName = "") {
      console.log("[offline] analysis start", {
        fileName,
        durationSec: audioBuffer.duration,
        sampleRate: audioBuffer.sampleRate,
        channels: audioBuffer.numberOfChannels
      });

      resetFileAnalysis();
      fileAnalysis.running = true;
      fileAnalysis.fileName = fileName;

      const offlineContext = new OfflineAudioContext(
        audioBuffer.numberOfChannels,
        audioBuffer.length,
        audioBuffer.sampleRate
      );

      const sourceNode = offlineContext.createBufferSource();
      sourceNode.buffer = audioBuffer;

      // EN: Keep these parameters matched with setupKWeightedAnalyser().
      const kPre = offlineContext.createBiquadFilter();
      kPre.type = "highshelf";
      kPre.frequency.value = 1500;
      kPre.gain.value = 4.0;

      const kHp = offlineContext.createBiquadFilter();
      kHp.type = "highpass";
      kHp.frequency.value = 60;
      kHp.Q.value = 0.5;

      sourceNode.connect(kPre);
      kPre.connect(kHp);
      kHp.connect(offlineContext.destination);

      sourceNode.start(0);
      const kRenderedBuffer = await offlineContext.startRendering();

      const supportRenderedBuffer = await renderOfflineTSupportBuffer(audioBuffer);
      const irritationRenderedBuffer = await renderOfflineTIrritationBuffer(audioBuffer);

      buildFileAnalysisArrays(audioBuffer, kRenderedBuffer, supportRenderedBuffer, irritationRenderedBuffer, fileName);
      fileAnalysis.running = false;

      console.log("[offline] analysis done", {
        fileName,
        totalBlockCount: fileAnalysis.totalBlockCount,
        relativeAcceptedCount: fileAnalysis.relativeAcceptedCount,
        kIntegratedEstimateDb: fileAnalysis.kIntegratedEstimateDb,
        gateThresholdDb: fileAnalysis.gateThresholdDb,
        lraEstimateDb: fileAnalysis.lraEstimateDb,
        lraGateThresholdDb: fileAnalysis.lraGateThresholdDb,
        tSupportIntegratedEstimateDb: fileAnalysis.tSupportIntegratedEstimateDb,
        tSupportLraEstimateDb: fileAnalysis.tSupportLraEstimateDb,
        tIrritationIntegratedEstimateDb: fileAnalysis.tIrritationIntegratedEstimateDb,
        tIrritationLraEstimateDb: fileAnalysis.tIrritationLraEstimateDb,
        segmentCount: fileAnalysis.segments.length,
        segmentRangeLu: fileAnalysis.segmentRangeLu
      });
    }


    async function renderOfflineTSupportBuffer(audioBuffer) {
      // EN: Offline T Support analysis uses a simple 20–63 Hz support-band render.
      // EN: This is intentionally separate from K weighting; the gate/LRA parameters are reused later for baseline TUFS comparison.
      const supportContext = new OfflineAudioContext(
        audioBuffer.numberOfChannels,
        audioBuffer.length,
        audioBuffer.sampleRate
      );

      const supportSource = supportContext.createBufferSource();
      supportSource.buffer = audioBuffer;

      const supportHp = supportContext.createBiquadFilter();
      supportHp.type = "highpass";
      supportHp.frequency.value = 20;
      supportHp.Q.value = 0.707;

      const supportLp = supportContext.createBiquadFilter();
      supportLp.type = "lowpass";
      supportLp.frequency.value = 63;
      supportLp.Q.value = 0.707;

      supportSource.connect(supportHp);
      supportHp.connect(supportLp);
      supportLp.connect(supportContext.destination);
      supportSource.start(0);

      return supportContext.startRendering();
    }


    async function renderOfflineTIrritationBuffer(audioBuffer) {
      // EN: Offline T Irritation analysis uses a simple 80–100 Hz upper-bass render.
      // EN: This is the analysis side of the later limiter-like TFC channel; no gain control is applied here.
      const irritationContext = new OfflineAudioContext(
        audioBuffer.numberOfChannels,
        audioBuffer.length,
        audioBuffer.sampleRate
      );

      const irritationSource = irritationContext.createBufferSource();
      irritationSource.buffer = audioBuffer;

      const irritationHp = irritationContext.createBiquadFilter();
      irritationHp.type = "highpass";
      irritationHp.frequency.value = 80;
      irritationHp.Q.value = 0.707;

      const irritationLp = irritationContext.createBiquadFilter();
      irritationLp.type = "lowpass";
      irritationLp.frequency.value = 100;
      irritationLp.Q.value = 0.707;

      irritationSource.connect(irritationHp);
      irritationHp.connect(irritationLp);
      irritationLp.connect(irritationContext.destination);
      irritationSource.start(0);

      return irritationContext.startRendering();
    }

    function buildFileAnalysisArrays(rawBuffer, kBuffer, supportBuffer, irritationBuffer, fileName) {
      const sampleRate = rawBuffer.sampleRate;
      const durationSec = rawBuffer.duration;
      const stepSec = fileAnalysis.blockStepSec;
      const block04Sec = fileAnalysis.blockSizeSec;
      const totalSteps = Math.max(1, Math.floor(durationSec / stepSec));

      const rawMono = mixToMonoArray(rawBuffer);
      const kMono = mixToMonoArray(kBuffer);
      const supportMono = mixToMonoArray(supportBuffer);
      const irritationMono = mixToMonoArray(irritationBuffer);
      const k04LinearBlocks = [];
      const tSupport04LinearBlocks = [];
      const tIrritation04LinearBlocks = [];

      for (let i = 0; i < totalSteps; i++) {
        const t = i * stepSec;

        const rms04 = meanSquareWindow(rawMono, sampleRate, t, block04Sec);
        const rms3 = meanSquareWindow(rawMono, sampleRate, t, shortTermWindowSec);
        const k04 = meanSquareWindow(kMono, sampleRate, t, block04Sec);
        const k3 = meanSquareWindow(kMono, sampleRate, t, shortTermWindowSec);
        const k30 = meanSquareWindow(kMono, sampleRate, t, longTermExposureWindowSec);
        const peak04 = peakSquareWindow(rawMono, sampleRate, t, block04Sec);
        const tSupport04 = meanSquareWindow(supportMono, sampleRate, t, block04Sec);
        const tSupport3 = meanSquareWindow(supportMono, sampleRate, t, shortTermWindowSec);
        const tIrritation04 = meanSquareWindow(irritationMono, sampleRate, t, block04Sec);
        const tIrritation3 = meanSquareWindow(irritationMono, sampleRate, t, shortTermWindowSec);

        fileAnalysis.times.push(t);
        fileAnalysis.rms04.push(rms04);
        fileAnalysis.rms3.push(rms3);
        fileAnalysis.k04.push(k04);
        fileAnalysis.k3.push(k3);
        fileAnalysis.k30.push(k30);
        fileAnalysis.peak04.push(peak04);
        fileAnalysis.tSupport04.push(tSupport04);
        fileAnalysis.tSupport3.push(tSupport3);
        fileAnalysis.tIrritation04.push(tIrritation04);
        fileAnalysis.tIrritation3.push(tIrritation3);
        k04LinearBlocks.push(k04);
        tSupport04LinearBlocks.push(tSupport04);
        tIrritation04LinearBlocks.push(tIrritation04);
      }

      // K ENVELOPE FOLLOWER + LOOK-AHEAD
      // EN: Offline envelope mirrors the realtime model using precomputed K 0.4 s blocks.
      // EN: Look-ahead is true offline look-ahead: control[t] = envelope[t + lookAhead].
      fileAnalysis.kAdaptive = buildKEnvelopeArrayFromK04(fileAnalysis.k04, stepSec);
      fileAnalysis.kAdaptiveLookAhead = buildLookAheadArray(fileAnalysis.kAdaptive, kEnvelopeLookAheadSteps);
      fileAnalysis.tSupportAdaptive = buildTSupportEnvelopeArrayFromT04(fileAnalysis.tSupport04, stepSec);
      fileAnalysis.tSupportNeed = fileAnalysis.tSupport04.map((linearValue, index) => {
        const t04Db = linearEnergyToDb(linearValue);
        const adaptDb = linearEnergyToDb(fileAnalysis.tSupportAdaptive[index]);
        return dbToLinearEnergy(Math.max(0, adaptDb - t04Db));
      });
      fileAnalysis.tSupportCrestDb = fileAnalysis.tSupport04.map((linearValue, index) => {
        return linearEnergyToDb(linearValue) - linearEnergyToDb(fileAnalysis.tSupport3[index]);
      });
      fileAnalysis.tSupportModDb = buildModulationDbArrayFromLinear(fileAnalysis.tSupport04, stepSec, shortTermWindowSec);
      fileAnalysis.tIrritationAdaptive = buildTIrritationEnvelopeArrayFromT04(fileAnalysis.tIrritation04, stepSec);
      fileAnalysis.tIrritationExcess = fileAnalysis.tIrritation04.map((linearValue, index) => {
        const t04Db = linearEnergyToDb(linearValue);
        const adaptDb = linearEnergyToDb(fileAnalysis.tIrritationAdaptive[index]);
        // EN: Listening-level context is added later at display time so the offline cache stays independent of UI state.
        return dbToLinearEnergy(Math.max(0, t04Db - adaptDb));
      });

      const gateStats = calculateIntegratedKEstimateFromBlocks(k04LinearBlocks);
      const tSupportGateStats = calculateIntegratedKEstimateFromBlocks(tSupport04LinearBlocks);
      const tIrritationGateStats = calculateIntegratedKEstimateFromBlocks(tIrritation04LinearBlocks);
      const lraStats = calculateOfflineLraEstimateFromK3Array(fileAnalysis.times, fileAnalysis.k3);
      const tSupportLraStats = calculateOfflineLraEstimateFromK3Array(fileAnalysis.times, fileAnalysis.tSupport3);
      const tIrritationLraStats = calculateOfflineLraEstimateFromK3Array(fileAnalysis.times, fileAnalysis.tIrritation3);
      const segmentStats = calculateOfflineSegmentStats(
        fileAnalysis.times,
        fileAnalysis.k04,
        fileAnalysis.k30,
        fileAnalysis.peak04,
        durationSec,
        fileAnalysis.segmentSec,
        gateStats.integratedDb
      );

      const kDistributionStats = calculateDbDistributionStatsFromLinear(fileAnalysis.k04);
      const tSupportDistributionStats = calculateDbDistributionStatsFromLinear(fileAnalysis.tSupport04);
      const tIrritationDistributionStats = calculateDbDistributionStatsFromLinear(fileAnalysis.tIrritation04);

      fileAnalysis.ready = true;
      fileAnalysis.fileName = fileName;
      fileAnalysis.sampleRate = sampleRate;
      fileAnalysis.durationSec = durationSec;
      fileAnalysis.kIntegratedEstimateDb = gateStats.integratedDb;
      fileAnalysis.gateThresholdDb = gateStats.relativeThresholdDb;
      fileAnalysis.tSupportIntegratedEstimateDb = tSupportGateStats.integratedDb;
      fileAnalysis.tSupportGateThresholdDb = tSupportGateStats.relativeThresholdDb;
      fileAnalysis.tSupportAcceptedCount = tSupportGateStats.relativeAcceptedCount;
      fileAnalysis.tSupportTotalCount = tSupportGateStats.totalBlockCount;
      fileAnalysis.tIrritationIntegratedEstimateDb = tIrritationGateStats.integratedDb;
      fileAnalysis.tIrritationGateThresholdDb = tIrritationGateStats.relativeThresholdDb;
      fileAnalysis.tIrritationAcceptedCount = tIrritationGateStats.relativeAcceptedCount;
      fileAnalysis.tIrritationTotalCount = tIrritationGateStats.totalBlockCount;
      fileAnalysis.lraEstimateDb = lraStats ? lraStats.lraDb : null;
      fileAnalysis.lraGateThresholdDb = lraStats ? lraStats.relativeThresholdDb : null;
      fileAnalysis.lraP10Db = lraStats ? lraStats.p10Db : null;
      fileAnalysis.lraP95Db = lraStats ? lraStats.p95Db : null;
      fileAnalysis.kP99Db = kDistributionStats.p99Db;
      fileAnalysis.kMaxDb = kDistributionStats.maxDb;
      fileAnalysis.tSupportLraEstimateDb = tSupportLraStats ? tSupportLraStats.lraDb : null;
      fileAnalysis.tSupportLraGateThresholdDb = tSupportLraStats ? tSupportLraStats.relativeThresholdDb : null;
      fileAnalysis.tSupportLraP10Db = tSupportLraStats ? tSupportLraStats.p10Db : null;
      fileAnalysis.tSupportLraP95Db = tSupportLraStats ? tSupportLraStats.p95Db : null;
      fileAnalysis.tSupportP99Db = tSupportDistributionStats.p99Db;
      fileAnalysis.tSupportMaxDb = tSupportDistributionStats.maxDb;
      fileAnalysis.tSupportMeanCrestDb = calculateMeanFinite(fileAnalysis.tSupportCrestDb);
      fileAnalysis.tSupportMeanModDb = calculateMeanFinite(fileAnalysis.tSupportModDb);
      fileAnalysis.tIrritationLraEstimateDb = tIrritationLraStats ? tIrritationLraStats.lraDb : null;
      fileAnalysis.tIrritationLraGateThresholdDb = tIrritationLraStats ? tIrritationLraStats.relativeThresholdDb : null;
      fileAnalysis.tIrritationLraP10Db = tIrritationLraStats ? tIrritationLraStats.p10Db : null;
      fileAnalysis.tIrritationLraP95Db = tIrritationLraStats ? tIrritationLraStats.p95Db : null;
      fileAnalysis.tIrritationP99Db = tIrritationDistributionStats.p99Db;
      fileAnalysis.tIrritationMaxDb = tIrritationDistributionStats.maxDb;
      fileAnalysis.lraAcceptedCount = lraStats ? lraStats.relativeGatedCount : 0;
      fileAnalysis.lraTotalCount = lraStats ? lraStats.totalCount : 0;
      fileAnalysis.absoluteAcceptedCount = gateStats.absoluteAcceptedCount;
      fileAnalysis.relativeAcceptedCount = gateStats.relativeAcceptedCount;
      fileAnalysis.totalBlockCount = gateStats.totalBlockCount;
      fileAnalysis.segments = segmentStats.segments;
      fileAnalysis.loudestSegmentIndex = segmentStats.loudestSegmentIndex;
      fileAnalysis.quietestSegmentIndex = segmentStats.quietestSegmentIndex;
      fileAnalysis.segmentRangeLu = segmentStats.segmentRangeLu;

      const overLimitStats = calculateTfcOfflineOverLimitStats(listeningLevelDb);
      fileAnalysis.tIrritationOverLimitPercent = overLimitStats.percent;
      fileAnalysis.tIrritationMaxOvershootDb = overLimitStats.maxOvershootDb;
      fileAnalysis.programCharacter = buildOfflineProgramCharacter();
    }

    function calculateDbDistributionStatsFromLinear(linearArray) {
      // EN: Offline fingerprint helper. Percentiles use display dB values from the fixed analysis arrays.
      const values = (linearArray || [])
        .map(value => linearEnergyToDb(value))
        .filter(value => Number.isFinite(value));

      if (values.length === 0) {
        return { p99Db: null, maxDb: null };
      }

      const sorted = [...values].sort((a, b) => a - b);
      return {
        p99Db: percentileSorted(sorted, 0.99),
        maxDb: sorted[sorted.length - 1]
      };
    }

    function calculateMeanFinite(values) {
      const valid = (values || []).filter(value => Number.isFinite(value));
      if (valid.length === 0) return null;
      return valid.reduce((sum, value) => sum + value, 0) / valid.length;
    }

    function calculateTfcOfflineOverLimitStats(listeningDb = listeningLevelDb) {
      // EN: Output-aware T Irr risk summary.
      // EN: This is recomputed for the current Listening Level; it does not change the stored dry analysis arrays.
      if (!fileAnalysis.ready || !Array.isArray(fileAnalysis.tIrritation04) || fileAnalysis.tIrritation04.length === 0) {
        return { percent: null, maxOvershootDb: null, count: 0, total: 0 };
      }

      const baseP95Db = fileAnalysis.tIrritationLraP95Db;
      if (!Number.isFinite(baseP95Db)) {
        return { percent: null, maxOvershootDb: null, count: 0, total: fileAnalysis.tIrritation04.length };
      }

      let count = 0;
      let total = 0;
      let maxOvershootDb = 0;

      for (const linearValue of fileAnalysis.tIrritation04) {
        const dryDb = linearEnergyToDb(linearValue);
        if (!Number.isFinite(dryDb)) continue;
        const limitDb = baseP95Db + tfcIrrProgramHeadroomDb - listeningDb - deviceGainDb;
        const overshootDb = dryDb - limitDb;
        total++;
        if (overshootDb > 0) {
          count++;
          maxOvershootDb = Math.max(maxOvershootDb, overshootDb);
        }
      }

      return {
        percent: total > 0 ? (100 * count) / total : null,
        maxOvershootDb: count > 0 ? maxOvershootDb : 0,
        count,
        total
      };
    }

    function buildOfflineProgramCharacter() {
      // EN: Descriptive only. This should not drive gain control.
      const labels = [];
      const supportP95 = fileAnalysis.tSupportLraP95Db;
      const irritationP95 = fileAnalysis.tIrritationLraP95Db;
      const kLra = fileAnalysis.lraEstimateDb;
      const supportMod = fileAnalysis.tSupportMeanModDb;

      if (Number.isFinite(supportP95) && Number.isFinite(irritationP95)) {
        const balanceDb = supportP95 - irritationP95;
        if (balanceDb > 6) labels.push("support-heavy");
        else if (balanceDb < -3) labels.push("irritation-heavy");
        else labels.push("balanced T");
      }

      if (Number.isFinite(kLra)) {
        if (kLra < 4) labels.push("dense");
        else if (kLra > 10) labels.push("dynamic");
      }

      if (Number.isFinite(supportMod) && supportMod > 1.5) {
        labels.push("modulated support");
      }

      return labels.length ? labels.join(" / ") : "--";
    }

    function calculateOfflineSegmentStats(times, k04Array, k30Array, peak04Array, durationSec, segmentSec, wholeFileIntegratedDb) {
      const segments = [];
      const segmentCount = Math.max(1, Math.ceil(durationSec / segmentSec));

      for (let segmentIndex = 0; segmentIndex < segmentCount; segmentIndex++) {
        const startSec = segmentIndex * segmentSec;
        const endSec = Math.min(durationSec, startSec + segmentSec);
        const k04Blocks = [];
        const k30Values = [];
        let peakMaxLinear = 0;

        for (let i = 0; i < times.length; i++) {
          const t = times[i];
          if (t < startSec || t >= endSec) continue;

          const k04 = k04Array[i];
          const k30 = k30Array[i];
          const peak04 = peak04Array[i];

          if (isFinite(k04) && k04 > 0) k04Blocks.push(k04);
          if (isFinite(k30) && k30 > 0) k30Values.push(k30);
          if (isFinite(peak04) && peak04 > peakMaxLinear) peakMaxLinear = peak04;
        }

        const integratedStats = calculateIntegratedKEstimateFromBlocks(k04Blocks);
        const k30MeanLinear = averageLinearArray(k30Values);
        const segmentIntegratedDb = integratedStats.integratedDb;
        const k30MeanDb = Number.isFinite(k30MeanLinear) ? linearEnergyToDb(k30MeanLinear) : null;
        const comparisonDb = Number.isFinite(segmentIntegratedDb) ? segmentIntegratedDb : k30MeanDb;
        const deltaFromIntegratedDb =
          Number.isFinite(comparisonDb) && Number.isFinite(wholeFileIntegratedDb)
            ? comparisonDb - wholeFileIntegratedDb
            : null;

        segments.push({
          index: segmentIndex,
          startSec,
          endSec,
          durationSec: endSec - startSec,
          kIntegratedEstimateDb: segmentIntegratedDb,
          k30MeanDb,
          comparisonDb,
          deltaFromIntegratedDb,
          peak04MaxDb: peakMaxLinear > 0 ? linearEnergyToDb(peakMaxLinear) : null,
          acceptedBlocks: integratedStats.relativeAcceptedCount,
          totalBlocks: integratedStats.totalBlockCount,
          gateThresholdDb: integratedStats.relativeThresholdDb
        });
      }

      let loudestSegmentIndex = -1;
      let quietestSegmentIndex = -1;
      let loudestValue = -Infinity;
      let quietestValue = Infinity;

      for (const segment of segments) {
        if (!Number.isFinite(segment.comparisonDb)) continue;
        if (segment.comparisonDb > loudestValue) {
          loudestValue = segment.comparisonDb;
          loudestSegmentIndex = segment.index;
        }
        if (segment.comparisonDb < quietestValue) {
          quietestValue = segment.comparisonDb;
          quietestSegmentIndex = segment.index;
        }
      }

      const segmentRangeLu =
        Number.isFinite(loudestValue) && Number.isFinite(quietestValue)
          ? loudestValue - quietestValue
          : null;

      return {
        segments,
        loudestSegmentIndex,
        quietestSegmentIndex,
        segmentRangeLu
      };
    }

    function mixToMonoArray(buffer) {
      const length = buffer.length;
      const channels = buffer.numberOfChannels;
      const mono = new Float32Array(length);

      for (let channelIndex = 0; channelIndex < channels; channelIndex++) {
        const data = buffer.getChannelData(channelIndex);
        for (let i = 0; i < length; i++) {
          mono[i] += data[i] / channels;
        }
      }

      return mono;
    }

    function meanSquareWindow(data, sampleRate, centerTimeSec, windowSec) {
      const halfWindowSec = windowSec * 0.5;
      const startIndex = Math.max(0, Math.floor((centerTimeSec - halfWindowSec) * sampleRate));
      const endIndex = Math.min(data.length, Math.floor((centerTimeSec + halfWindowSec) * sampleRate));

      if (endIndex <= startIndex) return dbToLinearEnergy(-100);

      let sumSquares = 0;
      for (let i = startIndex; i < endIndex; i++) {
        const value = data[i];
        sumSquares += value * value;
      }

      return sumSquares / (endIndex - startIndex);
    }

    function peakSquareWindow(data, sampleRate, centerTimeSec, windowSec) {
      const halfWindowSec = windowSec * 0.5;
      const startIndex = Math.max(0, Math.floor((centerTimeSec - halfWindowSec) * sampleRate));
      const endIndex = Math.min(data.length, Math.floor((centerTimeSec + halfWindowSec) * sampleRate));

      let maxAbs = 0;
      for (let i = startIndex; i < endIndex; i++) {
        const absValue = Math.abs(data[i]);
        if (absValue > maxAbs) maxAbs = absValue;
      }

      return maxAbs * maxAbs;
    }

    function calculateIntegratedKEstimateFromBlocks(kLinearBlocks) {
      const validBlocks = kLinearBlocks.filter(value => isFinite(value) && value > 0);
      const totalBlockCount = validBlocks.length;
      const absoluteThresholdLinear = dbToLinearEnergy(-70);
      const absoluteAccepted = validBlocks.filter(value => value >= absoluteThresholdLinear);

      if (absoluteAccepted.length === 0) {
        return {
          integratedDb: null,
          relativeThresholdDb: null,
          absoluteAcceptedCount: 0,
          relativeAcceptedCount: 0,
          totalBlockCount
        };
      }

      const absoluteMeanLinear = averageLinearArray(absoluteAccepted);
      const absoluteMeanDb = linearEnergyToDb(absoluteMeanLinear);
      const relativeThresholdDb = absoluteMeanDb - 10;
      const relativeThresholdLinear = dbToLinearEnergy(relativeThresholdDb);
      const relativeAccepted = absoluteAccepted.filter(value => value >= relativeThresholdLinear);

      if (relativeAccepted.length === 0) {
        return {
          integratedDb: null,
          relativeThresholdDb,
          absoluteAcceptedCount: absoluteAccepted.length,
          relativeAcceptedCount: 0,
          totalBlockCount
        };
      }

      return {
        // EN: Estimate only. This follows the current app dB scale, not certified BS.1770 LUFS.
        integratedDb: linearEnergyToDb(averageLinearArray(relativeAccepted)),
        relativeThresholdDb,
        absoluteAcceptedCount: absoluteAccepted.length,
        relativeAcceptedCount: relativeAccepted.length,
        totalBlockCount
      };
    }

    function calculateRunningIntegratedKEstimateFromBlocks(blocks, minBlockCount = realtimeIntegratedMinBlocks) {
      const energies = blocks
        .map(block => block.energy)
        .filter(value => isFinite(value) && value > 0);

      const totalBlockCount = energies.length;
      const absoluteThresholdLinear = dbToLinearEnergy(-70);
      const absoluteAccepted = energies.filter(value => value >= absoluteThresholdLinear);

      if (totalBlockCount < minBlockCount || absoluteAccepted.length < minBlockCount) {
        return {
          status: "warming up",
          integratedDb: null,
          relativeThresholdDb: null,
          absoluteAcceptedCount: absoluteAccepted.length,
          relativeAcceptedCount: 0,
          totalBlockCount,
          minBlockCount
        };
      }

      const absoluteMeanLinear = averageLinearArray(absoluteAccepted);
      const absoluteMeanDb = linearEnergyToDb(absoluteMeanLinear);
      const relativeThresholdDb = absoluteMeanDb - 10;
      const relativeThresholdLinear = dbToLinearEnergy(relativeThresholdDb);
      const relativeAccepted = absoluteAccepted.filter(value => value >= relativeThresholdLinear);

      if (relativeAccepted.length < minBlockCount) {
        return {
          status: "warming up",
          integratedDb: null,
          relativeThresholdDb,
          absoluteAcceptedCount: absoluteAccepted.length,
          relativeAcceptedCount: relativeAccepted.length,
          totalBlockCount,
          minBlockCount
        };
      }

      return {
        status: "ready",
        integratedDb: linearEnergyToDb(averageLinearArray(relativeAccepted)),
        relativeThresholdDb,
        absoluteAcceptedCount: absoluteAccepted.length,
        relativeAcceptedCount: relativeAccepted.length,
        totalBlockCount,
        minBlockCount
      };
    }

    function averageLinearArray(values) {
      if (!values.length) return null;
      let sum = 0;
      for (const value of values) sum += value;
      return sum / values.length;
    }

    function calculateOfflineLraEstimateFromK3Array(times, k3LinearArray) {
      const history = [];
      let lastSampleTimeSec = null;

      for (let i = 0; i < times.length; i++) {
        const t = times[i];
        const linearValue = k3LinearArray[i];
        if (!isFinite(t) || !isFinite(linearValue) || linearValue <= 0) continue;

        // EN: Offline LRA uses one 3 s short-term K value per second.
        // EN: Do not use the denser 0.1 s file scope array directly for LRA.
        if (lastSampleTimeSec === null || t - lastSampleTimeSec >= 1.0) {
          lastSampleTimeSec = t;
          history.push({
            t,
            value: linearEnergyToDb(linearValue)
          });
        }
      }

      return getStandardLikeLraStatsFromShortTermHistory(history);
    }

    function getNearestFileAnalysisIndex(timeSec) {
      if (!fileAnalysis.ready || fileAnalysis.times.length === 0) return -1;
      return clamp(Math.round(timeSec / fileAnalysis.blockStepSec), 0, fileAnalysis.times.length - 1);
    }

    function buildOfflineScopeWindow(startSec, windowSec = levelScopeWindowSec, endSecOverride = null) {
      if (!fileAnalysis.ready) return [];

      // EN: startSec may be negative in follow mode.
      // EN: This preserves empty space on the left until the playback cursor has filled the 20 s scope.
      const visibleStartSec = startSec;
      const visibleEndSec = Number.isFinite(endSecOverride)
        ? endSecOverride
        : visibleStartSec + windowSec;

      const dataStartSec = Math.max(0, visibleStartSec);
      const dataEndSec = Math.min(fileAnalysis.durationSec, visibleEndSec);
      const result = [];

      for (let i = 0; i < fileAnalysis.times.length; i++) {
        const t = fileAnalysis.times[i];
        if (t < dataStartSec || t > dataEndSec) continue;

        result.push({
          t,
          peak04Db: linearEnergyToDb(fileAnalysis.peak04[i]),
          rms04Db: linearEnergyToDb(fileAnalysis.rms04[i]),
          rms3Db: linearEnergyToDb(fileAnalysis.rms3[i]),
          kWeightedMomentaryScopeDb: linearEnergyToDb(fileAnalysis.k04[i]),
          kWeightedShortScopeDb: linearEnergyToDb(fileAnalysis.k3[i]),
          kWeightedLongScopeDb: linearEnergyToDb(fileAnalysis.k30[i]),
          kAdaptiveScopeDb: linearEnergyToDb(fileAnalysis.kAdaptive[i]),
          kAdaptiveLookAheadScopeDb: linearEnergyToDb(fileAnalysis.kAdaptiveLookAhead[i])
        });
      }

      return result;
    }


    function buildOfflineTfcScopeWindow(startSec, windowSec = levelScopeWindowSec, endSecOverride = null) {
      if (!fileAnalysis.ready) return [];

      // EN: File-mode TFC scope must use file-time stamps, not realtime performance.now() stamps.
      // EN: Otherwise curves clamp to the right edge or appear only after enough realtime history exists.
      const visibleStartSec = startSec;
      const visibleEndSec = Number.isFinite(endSecOverride)
        ? endSecOverride
        : visibleStartSec + windowSec;

      const dataStartSec = Math.max(0, visibleStartSec);
      const dataEndSec = Math.min(fileAnalysis.durationSec, visibleEndSec);
      const p95Db = fileAnalysis.tIrritationLraP95Db;
      const limitDb = getTfcIrritationLimitDb(p95Db, null, null);
      const limiterIsActive = tfcPreAnalysisLimiterEnabled;
      const result = [];
      let reductionDb = 0;

      for (let i = 0; i < fileAnalysis.times.length; i++) {
        const t = fileAnalysis.times[i];
        if (t > dataEndSec) break;

        const dryDb = linearEnergyToDb(fileAnalysis.tIrritation04[i]);
        const targetReductionDb = limiterIsActive && Number.isFinite(limitDb)
          ? clamp(softKneeReductionDb(dryDb - limitDb), 0, 12)
          : 0;
        const coeff = targetReductionDb > reductionDb
          ? tfcPreAnalysisReductionAttackCoeff
          : tfcPreAnalysisReductionReleaseCoeff;
        reductionDb += (targetReductionDb - reductionDb) * coeff;
        if (!limiterIsActive) reductionDb = 0;

        if (t < dataStartSec) continue;

        // EN: Wet is an offline display estimate for file scope continuity.
        // EN: The live analyser still provides the actual wet cursor value when playback is running.
        const errorDb = Number.isFinite(limitDb) ? dryDb - limitDb : null;
        const modelErrorDb = Number.isFinite(targetReductionDb) ? targetReductionDb - reductionDb : null;
        result.push({
          t,
          tIrrDryDb: dryDb,
          tIrrWetDb: dryDb - reductionDb,
          tIrrLimitDb: limitDb,
          tIrrErrorDb: errorDb,
          tIrrExpectedReductionDb: targetReductionDb,
          tIrrActualReductionDb: reductionDb,
          tIrrModelErrorDb: modelErrorDb,
          tIrrReductionDb: -reductionDb,
          tIrrTargetReductionDb: -targetReductionDb
        });
      }

      return result;
    }

    function formatNullableDb(value) {
      return Number.isFinite(value) ? (value.toFixed(1) + " dB") : "--";
    }

    function formatNullableLu(value) {
      return Number.isFinite(value) ? (value.toFixed(1) + " LU") : "--";
    }



    // ==============================
    // OFFLINE TFC STEP TEST
    // ==============================
    function runTfcOfflineStepTest() {
      // EN: Offline step test measures limiter dynamics, not perceptual tuning.
      // EN: It uses the same soft-knee target and coefficient envelope as the live TFC control path.
      const stepLevelsDb = [-36, -30, -24, -18, -12, -18, -24, -30];
      const stepDurationSec = 4.0;
      const sampleRateHz = 100;
      const listeningLevelsDb = [-12, 0, 12];
      const p95Db = percentileSorted([...stepLevelsDb].sort((a, b) => a - b), 0.95);
      const rows = [];

      for (const llDb of listeningLevelsDb) {
        const limitDb = p95Db + tfcIrrProgramHeadroomDb - llDb - deviceGainDb;
        let reductionDb = 0;

        for (let stepIndex = 0; stepIndex < stepLevelsDb.length; stepIndex++) {
          const dryDb = stepLevelsDb[stepIndex];
          const samplesPerStep = Math.round(stepDurationSec * sampleRateHz);
          const wetSeries = [];
          const redSeries = [];
          const targetSeries = [];

          for (let i = 0; i < samplesPerStep; i++) {
            const excessDb = dryDb - limitDb;
            const targetReductionDb = clamp(softKneeReductionDb(excessDb), 0, 12);
            const coeff = targetReductionDb > reductionDb
              ? tfcPreAnalysisReductionAttackCoeff
              : tfcPreAnalysisReductionReleaseCoeff;
            reductionDb += (targetReductionDb - reductionDb) * coeff;

            const wetDb = dryDb - reductionDb;
            wetSeries.push(wetDb);
            redSeries.push(reductionDb);
            targetSeries.push(targetReductionDb);
          }

          const halfIndex = Math.floor(samplesPerStep * 0.5);
          const lastHalfWet = wetSeries.slice(halfIndex);
          const lastHalfRed = redSeries.slice(halfIndex);
          const lastSecondWet = wetSeries.slice(Math.max(0, samplesPerStep - sampleRateHz));
          const prevSecondWet = wetSeries.slice(Math.max(0, samplesPerStep - sampleRateHz * 2), Math.max(0, samplesPerStep - sampleRateHz));
          const wetMeanDb = averageNumberArray(lastHalfWet);
          const reductionMeanDb = averageNumberArray(lastHalfRed);
          const actualReductionDb = dryDb - wetMeanDb;
          const targetReductionDb = targetSeries[targetSeries.length - 1];
          const targetWetDb = dryDb - targetReductionDb;
          const errorDb = targetReductionDb - actualReductionDb;
          const driftDb = averageNumberArray(lastSecondWet) - averageNumberArray(prevSecondWet);
          const settlingTimeSec = calculateSettlingTimeSec(wetSeries, targetWetDb, sampleRateHz, 1.0);
          const overshootDb = calculateOvershootDb(wetSeries, targetWetDb, sampleRateHz);
          const steadyStateErrorDb = averageNumberArray(lastSecondWet) - targetWetDb;

          rows.push({
            llDb,
            stepIndex: stepIndex + 1,
            dryDb,
            limitDb,
            targetReductionDb,
            wetMeanDb,
            actualReductionDb,
            errorDb,
            driftDb,
            settlingTimeSec,
            overshootDb,
            steadyStateErrorDb
          });
        }
      }

      const lines = [];
      lines.push("TFC OFFLINE 90 Hz STEP TEST");
      lines.push(`p95 anchor: ${p95Db.toFixed(1)} dB, headroom: ${tfcIrrProgramHeadroomDb.toFixed(1)} dB, device: ${deviceGainDb.toFixed(1)} dB`);

          row.overshootDb.toFixed(2).padStart(8) +
          row.steadyStateErrorDb.toFixed(2).padStart(8)
        );
      }
      const summary = analyzeTfcStepTestRows(rows);

      lines.push(`monotonic LL response: ${summary.monotonicOk ? "OK" : "CHECK"}`);
      lines.push(`worst row: LL ${summary.worstRow.llDb.toFixed(0)}, step ${summary.worstRow.stepIndex}, dry ${summary.worstRow.dryDb.toFixed(1)}, tgt ${summary.worstRow.targetReductionDb.toFixed(1)}, act ${summary.worstRow.actualReductionDb.toFixed(1)}, drift ${summary.worstRow.driftDb.toFixed(2)}, settle ${formatSettlingTime(summary.worstRow.settlingTimeSec)}`);

      lines.push("Monotonic check: for the same dry step, reduction should increase as Listening Level rises.");
      logStatus(lines.join("\n"));
      console.log("[tfcStepTest] results", rows, summary);
