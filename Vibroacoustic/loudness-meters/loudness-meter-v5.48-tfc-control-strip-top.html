    function calculateSettlingTimeSec(series, targetDb, sampleRateHz, toleranceDb = 1.0) {
      if (!Array.isArray(series) || series.length === 0 || !Number.isFinite(targetDb)) return null;
      for (let i = 0; i < series.length; i++) {
        let stable = true;
        for (let j = i; j < series.length; j++) {
          if (Math.abs(series[j] - targetDb) > toleranceDb) {
            stable = false;
            break;
          }
        }
        if (stable) return i / sampleRateHz;
      }
      return null;
    }

    function calculateOvershootDb(series, targetDb, sampleRateHz) {
      if (!Array.isArray(series) || series.length < 2 || !Number.isFinite(targetDb)) return 0;
      const startDb = series[0];
      const direction = targetDb >= startDb ? 1 : -1;
      let maxOvershootDb = 0;
      for (const value of series) {
        const overshootDb = direction > 0 ? value - targetDb : targetDb - value;
        if (overshootDb > maxOvershootDb) maxOvershootDb = overshootDb;
      }
      return maxOvershootDb;
    }

    function formatSettlingTime(valueSec) {
      return Number.isFinite(valueSec) ? `${valueSec.toFixed(2)}s` : "--";
    }

    function analyzeTfcStepTestRows(rows) {
      // EN: Automatic regression check for the offline TFC step test.
      // EN: It does not prove perceptual correctness; it only checks control stability and monotonic listening-level behavior.
      let maxAbsErrorDb = 0;
      let maxAbsDriftDb = 0;
      let maxSettlingTimeSec = 0;
      let maxOvershootDb = 0;
      let maxAbsSteadyStateErrorDb = 0;
      let worstRow = rows[0] || { llDb: 0, stepIndex: 0, dryDb: 0, targetReductionDb: 0, actualReductionDb: 0, driftDb: 0, settlingTimeSec: null };

      for (const row of rows) {
        const absError = Math.abs(row.errorDb);
        const absDrift = Math.abs(row.driftDb);
        const absSteadyStateError = Math.abs(row.steadyStateErrorDb);
        if (absError > maxAbsErrorDb) {
          maxAbsErrorDb = absError;
          worstRow = row;
        }
        if (absDrift > maxAbsDriftDb) {
          maxAbsDriftDb = absDrift;
        }
        if (Number.isFinite(row.settlingTimeSec) && row.settlingTimeSec > maxSettlingTimeSec) {
          maxSettlingTimeSec = row.settlingTimeSec;
        }
        if (Number.isFinite(row.overshootDb) && row.overshootDb > maxOvershootDb) {
          maxOvershootDb = row.overshootDb;
        }
        if (Number.isFinite(absSteadyStateError) && absSteadyStateError > maxAbsSteadyStateErrorDb) {
          maxAbsSteadyStateErrorDb = absSteadyStateError;
        }
      }

      let monotonicOk = true;
      const stepIndices = [...new Set(rows.map(row => row.stepIndex))];
      for (const stepIndex of stepIndices) {
        const sameStep = rows
          .filter(row => row.stepIndex === stepIndex)
          .sort((a, b) => a.llDb - b.llDb);
        for (let i = 1; i < sameStep.length; i++) {
          if (sameStep[i].actualReductionDb + 0.05 < sameStep[i - 1].actualReductionDb) {
            monotonicOk = false;
          }
        }
      }

      return {
        maxAbsErrorDb,
        maxAbsDriftDb,
        maxSettlingTimeSec,
        maxOvershootDb,
        maxAbsSteadyStateErrorDb,
        monotonicOk,
        worstRow
      };
    }

    function averageNumberArray(values) {
      if (!values || values.length === 0) return 0;
      let sum = 0;
      let count = 0;
      for (const value of values) {
        if (!Number.isFinite(value)) continue;
        sum += value;
        count++;
      }
      return count > 0 ? sum / count : 0;
    }

      if (over > 20 || overshoot > 8) return "high";

    function dbToLinearEnergy(dbValue) {

      if (!isFinite(linearValue) || linearValue <= 0) {
        return displayMinDb;
      }
      return 10 * Math.log10(linearValue);

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));

    async function appendAudioInputList(stream) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === "audioinput");

        appendStatus("Audio inputs:");
        audioInputs.forEach((device, index) => {
          const label = device.label || "(label hidden until permission granted)";
          appendStatus(`  ${index}: ${label} | ${device.deviceId}`);
        });

        const tracks = stream.getAudioTracks();
        if (tracks.length > 0) {
          const track = tracks[0];
          appendStatus(`active track.label: ${track.label || "(hidden until permission granted)"}`);
          appendStatus(`active track.readyState: ${track.readyState}`);
        }
      } catch (error) {
        appendStatus(`enumerateDevices failed: ${error.message}`);
      }
    }

    function calculateRMS(buffer) {
      let sumSquares = 0;
      for (let i = 0; i < buffer.length; i++) {
        const value = buffer[i];
        sumSquares += value * value;
      }
      return Math.sqrt(sumSquares / buffer.length);
    }

    function calculateMaxAbs(buffer) {
      let maxAbs = 0;
      for (let i = 0; i < buffer.length; i++) {
        const absValue = Math.abs(buffer[i]);
        if (absValue > maxAbs) maxAbs = absValue;
      }
      return maxAbs;
    }

    function maxHistoryLinear(history) {
      if (history.length === 0) return null;
      let maxValue = 0;
      for (const item of history) {
        if (isFinite(item.value) && item.value > maxValue) maxValue = item.value;
      }
      return maxValue;
    }

    function getFftLinearEnergySum(freqDbArray) {
      let sumLinear = 0;
      let count = 0;

      for (let i = 0; i < freqDbArray.length; i++) {
        const db = freqDbArray[i];
        if (isFinite(db)) {
          sumLinear += dbToLinearEnergy(db);
          count++;
        }
      }

      return { sumLinear, count };
    }

    function getBandLinearEnergy(freqDbArray, lowFreq, highFreq, sampleRate, fftEnergyScale) {
      const nyquist = sampleRate / 2;
      const fftBinCount = freqDbArray.length;
      const binWidthHz = nyquist / fftBinCount;

      let sumLinearRaw = 0;
      let weightedBinCount = 0;

      for (let i = 0; i < fftBinCount; i++) {
        const db = freqDbArray[i];
        if (!isFinite(db)) continue;

        // EN: Treat each FFT value as energy located in a finite-width frequency bin.
        // EN: Fractional overlap prevents edge bands, especially 20 Hz, from stealing too much energy.
        const binLow = Math.max(0, (i - 0.5) * binWidthHz);
        const binHigh = Math.min(nyquist, (i + 0.5) * binWidthHz);
        const overlapLow = Math.max(lowFreq, binLow);
        const overlapHigh = Math.min(highFreq, binHigh);
        const overlapHz = Math.max(0, overlapHigh - overlapLow);

        if (overlapHz <= 0) continue;

        const overlapFraction = overlapHz / Math.max(1e-12, binHigh - binLow);
        sumLinearRaw += dbToLinearEnergy(db) * overlapFraction;
        weightedBinCount += overlapFraction;
      }

      if (weightedBinCount <= 0) {
        return {
          linearSum: 0,
          binCount: 0
        };
      }

      // EN: Web Audio analyser FFT magnitudes include internal window/analyser scaling.
      // EN: fftEnergyScale normalizes total FFT-bin energy to time-domain RMS².
      return {
        linearSum: sumLinearRaw * fftEnergyScale,
        binCount: weightedBinCount
      };
    }

    function getThirdOctaveBandValues(freqDbArray, sampleRate, referenceTimeLinearEnergy) {
      const nyquist = sampleRate / 2;
      const bandValues = [];

      const fftTotal = getFftLinearEnergySum(freqDbArray);
      const fftEnergyScale =
        isFinite(referenceTimeLinearEnergy) && referenceTimeLinearEnergy > 0 && fftTotal.sumLinear > 0
          ? referenceTimeLinearEnergy / fftTotal.sumLinear
          : 1;

      for (const centerFreq of thirdOctaveCenters) {
        const low = centerFreq / Math.pow(2, 1 / 6);
        const high = centerFreq * Math.pow(2, 1 / 6);
        if (low >= nyquist) continue;

        const bandEnergy = getBandLinearEnergy(freqDbArray, low, Math.min(high, nyquist), sampleRate, fftEnergyScale);

        // EN: Use the same physical band-energy sum for both display and derived meters.
        // EN: Do not use per-bin mean here; mean would break octave-band energy interpretation.
        const dbRaw = linearEnergyToDb(bandEnergy.linearSum);

        bandValues.push({
          centerFreq,
          low,
          high,
          binCount: bandEnergy.binCount,
          dbRaw,
          dbCal: dbRaw,
          linear: bandEnergy.linearSum,
          linearRaw: bandEnergy.linearSum
        });
      }

      return bandValues;
    }

    function smoothLinearValue(previousValue, instantValue, dtSec, timeConstantSec) {
      if (previousValue === null || !isFinite(previousValue)) {
        return instantValue;
      }
      const alpha = 1 - Math.exp(-dtSec / Math.max(0.001, timeConstantSec));
      return previousValue + alpha * (instantValue - previousValue);
    }

    function smoothStep01(value) {
      const x = clamp(value, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function softKneeReductionDb(excessDb, kneeDb = 4.0, ratio = 0.75) {
      // EN: Positive excess becomes smooth gain reduction.
      // EN: Below 0 dB there is no cut; within knee the cut ramps gently to avoid zipper-like behavior.
      if (!Number.isFinite(excessDb) || excessDb <= 0) return 0;
      if (excessDb < kneeDb) {
        const x = excessDb / kneeDb;
        return ratio * kneeDb * x * x * 0.5;
      }
      return ratio * (excessDb - kneeDb * 0.5);
    }

    function getTfcIrritationBaseLimitDb(programIrritationP95Db = null, fallbackAdaptDb = null, currentIrritationDb = null) {
      // EN: Program p95 is preferred because it is a stable offline program reference.
      // EN: Realtime mode falls back to the local adaptive irritation context until a realtime p95 exists.
      if (Number.isFinite(programIrritationP95Db)) return programIrritationP95Db;
      if (Number.isFinite(fallbackAdaptDb)) return fallbackAdaptDb;
      return Number.isFinite(currentIrritationDb) ? currentIrritationDb : null;
    }

    function getTfcIrritationLimitFromBaseDb(baseLimitDb) {
      if (!Number.isFinite(baseLimitDb)) return null;

      // EN: Program-derived absolute limit prototype.
      // EN: p95/adapt is only the anchor; fixed negative headroom makes the limiter observable without adding a new slider.
      // EN: Higher listening level means the same signal feels more irritating, so the allowed signal limit drops.
      return baseLimitDb + tfcIrrProgramHeadroomDb - listeningLevelDb - deviceGainDb;
    }

    function getTfcIrritationLimitDb(programIrritationP95Db = null, fallbackAdaptDb = null, currentIrritationDb = null) {
      const baseLimitDb = getTfcIrritationBaseLimitDb(programIrritationP95Db, fallbackAdaptDb, currentIrritationDb);
      return getTfcIrritationLimitFromBaseDb(baseLimitDb);
    }


    function updatePassiveLevelerObserver(programTIrrP95Db, measuredTIrr3sDb, didAppendSample) {
      // EN: Passive observer only. Do not apply these values to any gain node yet.
      // EN: P95 target shows section-vs-program balance; limit target shows direct cut/boost need against the active TFC limit.
      const targetFromP95Db = Number.isFinite(programTIrrP95Db) && Number.isFinite(measuredTIrr3sDb)
        ? programTIrrP95Db - measuredTIrr3sDb
        : null;
      const targetFromLimitDb = Number.isFinite(tfcPreAnalysisLimitDb) && Number.isFinite(measuredTIrr3sDb)
        ? tfcPreAnalysisLimitDb - measuredTIrr3sDb
        : null;

      state.levelerGainDb = 0;
      state.levelerTargetFromP95Db = targetFromP95Db;
      state.levelerTargetFromLimitDb = targetFromLimitDb;
      state.levelerTargetDb = targetFromLimitDb;

      if (!Number.isFinite(targetFromLimitDb)) {
        state.levelerSlowEstimateDb = passiveLevelerSlowEstimateDb;
        return;
      }

      if (!Number.isFinite(passiveLevelerSlowEstimateDb)) {
        passiveLevelerSlowEstimateDb = targetFromLimitDb;
      } else if (didAppendSample) {
        const coeff = 0.03;
        passiveLevelerSlowEstimateDb += (targetFromLimitDb - passiveLevelerSlowEstimateDb) * coeff;
      }

      state.levelerSlowEstimateDb = passiveLevelerSlowEstimateDb;
    }

    function updateKEnvelopeFollowerDb(previousDb, inputDb, dtSec, state) {
      const safeInputDb = Math.max(kEnvelopeFloorDb, isFinite(inputDb) ? inputDb : kEnvelopeFloorDb);
      let nextDb = Math.max(kEnvelopeFloorDb, isFinite(previousDb) ? previousDb : safeInputDb);

      if (!isFinite(state.peakDb)) {
        state.peakDb = nextDb;
      }

      if (safeInputDb > nextDb) {
        // EN: Fast rise: follow increasing K energy quickly, but without a hard step.
        const attackAlpha = 1 - Math.exp(-dtSec / Math.max(0.001, kEnvelopeAttackTauSec));
        nextDb += attackAlpha * (safeInputDb - nextDb);
        state.peakDb = Math.max(state.peakDb, nextDb, safeInputDb);
        state.holdTimerSec = kEnvelopeHoldSec;
      } else if (state.holdTimerSec > 0) {
        // EN: Perceptual adaptation hold: keep the recent context for a short time before release.
        state.holdTimerSec = Math.max(0, state.holdTimerSec - dtSec);
      } else {
        // EN: 60 dB adaptation range: release cannot fall below the recent peak minus this range.
        // EN: The release is S-shaped: soft start, near-linear middle section, soft landing near the lower limit.
        const releaseFloorDb = Math.max(kEnvelopeFloorDb, state.peakDb - kEnvelopeDynamicRangeDb, safeInputDb);
        const droppedFromPeakDb = Math.max(0, state.peakDb - nextDb);
        const remainingToFloorDb = Math.max(0, nextDb - releaseFloorDb);
        const startEase = 0.35 + 0.65 * smoothStep01(droppedFromPeakDb / kEnvelopeStartEaseDb);
        const endEase = smoothStep01(remainingToFloorDb / kEnvelopeEndEaseDb);
        const releaseRateDbPerSec = kEnvelopeReleaseDbPerSec * startEase * endEase;
        nextDb = Math.max(releaseFloorDb, nextDb - releaseRateDbPerSec * dtSec);

        // EN: If the signal has been quiet long enough to reach the 60 dB floor, allow the peak anchor to drift down.
        if (Math.abs(nextDb - releaseFloorDb) < 0.001 && safeInputDb < releaseFloorDb) {
          state.peakDb = Math.max(safeInputDb + kEnvelopeDynamicRangeDb, state.peakDb - releaseRateDbPerSec * dtSec);
        }
      }

      return Math.max(kEnvelopeFloorDb, nextDb);
    }

    function updateTSupportEnvelopeFollowerDb(previousDb, inputDb, dtSec, state) {
      const safeInputDb = Math.max(tSupportEnvelopeFloorDb, isFinite(inputDb) ? inputDb : tSupportEnvelopeFloorDb);
      let nextDb = Math.max(tSupportEnvelopeFloorDb, isFinite(previousDb) ? previousDb : safeInputDb);

      if (!isFinite(state.peakDb)) {
        state.peakDb = nextDb;
      }

      if (safeInputDb > nextDb) {
        // EN: Support context rises moderately fast so a new low-bass bed becomes the local reference.
        const attackAlpha = 1 - Math.exp(-dtSec / Math.max(0.001, tSupportEnvelopeAttackTauSec));
        nextDb += attackAlpha * (safeInputDb - nextDb);
        state.peakDb = Math.max(state.peakDb, nextDb, safeInputDb);
        state.holdTimerSec = tSupportEnvelopeHoldSec;
      } else if (state.holdTimerSec > 0) {
        // EN: Slow support hold avoids treating short gaps as an immediate need for boost.
        state.holdTimerSec = Math.max(0, state.holdTimerSec - dtSec);
      } else {
        // EN: Support uses a smaller adaptation range than K because low-bass tactile foundation should not chase silence too far down.
        const releaseFloorDb = Math.max(tSupportEnvelopeFloorDb, state.peakDb - tSupportEnvelopeDynamicRangeDb, safeInputDb);
        const droppedFromPeakDb = Math.max(0, state.peakDb - nextDb);
        const remainingToFloorDb = Math.max(0, nextDb - releaseFloorDb);
        const startEase = 0.35 + 0.65 * smoothStep01(droppedFromPeakDb / tSupportEnvelopeStartEaseDb);
        const endEase = smoothStep01(remainingToFloorDb / tSupportEnvelopeEndEaseDb);
        const releaseRateDbPerSec = tSupportEnvelopeReleaseDbPerSec * startEase * endEase;
        nextDb = Math.max(releaseFloorDb, nextDb - releaseRateDbPerSec * dtSec);

        if (Math.abs(nextDb - releaseFloorDb) < 0.001 && safeInputDb < releaseFloorDb) {
          state.peakDb = Math.max(safeInputDb + tSupportEnvelopeDynamicRangeDb, state.peakDb - releaseRateDbPerSec * dtSec);
        }
      }

      return Math.max(tSupportEnvelopeFloorDb, nextDb);
    }

    function buildKEnvelopeArrayFromK04(k04Array, stepSec) {
      const result = [];
      const state = { holdTimerSec: 0.0 };
      let envDb = kEnvelopeFloorDb;
      state.peakDb = kEnvelopeFloorDb;

      for (const linearValue of k04Array) {
        const inputDb = linearEnergyToDb(linearValue);
        envDb = updateKEnvelopeFollowerDb(envDb, inputDb, stepSec, state);
        result.push(dbToLinearEnergy(envDb));
      }

      return result;
    }


    function buildTSupportEnvelopeArrayFromT04(tSupport04Array, stepSec) {
      const result = [];
      const state = { holdTimerSec: 0.0 };
      let envDb = tSupportEnvelopeFloorDb;
      state.peakDb = tSupportEnvelopeFloorDb;

      for (const linearValue of tSupport04Array) {
        const inputDb = linearEnergyToDb(linearValue);
        envDb = updateTSupportEnvelopeFollowerDb(envDb, inputDb, stepSec, state);
        result.push(dbToLinearEnergy(envDb));
      }

      return result;
    }

    function buildModulationDbArrayFromLinear(linearArray, stepSec, windowSec) {
      const result = [];
      const windowSteps = Math.max(2, Math.round(windowSec / Math.max(0.001, stepSec)));

      for (let i = 0; i < linearArray.length; i++) {
        const startIndex = Math.max(0, i - windowSteps + 1);
        let sumDelta = 0;
        let count = 0;

        for (let j = startIndex + 1; j <= i; j++) {
          const previousDb = linearEnergyToDb(linearArray[j - 1]);
          const currentDb = linearEnergyToDb(linearArray[j]);
          if (!isFinite(previousDb) || !isFinite(currentDb)) continue;
          sumDelta += Math.abs(currentDb - previousDb);
          count++;
        }

        result.push(count > 0 ? sumDelta / count : 0);
      }

      return result;
    }

    function updateTIrritationEnvelopeFollowerDb(previousDb, inputDb, dtSec, state) {
      const safeInputDb = Math.max(tIrritationEnvelopeFloorDb, isFinite(inputDb) ? inputDb : tIrritationEnvelopeFloorDb);
      let nextDb = Math.max(tIrritationEnvelopeFloorDb, isFinite(previousDb) ? previousDb : safeInputDb);

      if (!isFinite(state.peakDb)) {
        state.peakDb = nextDb;
      }

      if (safeInputDb > nextDb) {
        // EN: Fast rise for limiter-like tactile irritation context.
        const attackAlpha = 1 - Math.exp(-dtSec / Math.max(0.001, tIrritationEnvelopeAttackTauSec));
        nextDb += attackAlpha * (safeInputDb - nextDb);
        state.peakDb = Math.max(state.peakDb, nextDb, safeInputDb);
        state.holdTimerSec = tIrritationEnvelopeHoldSec;
      } else if (state.holdTimerSec > 0) {
        state.holdTimerSec = Math.max(0, state.holdTimerSec - dtSec);
      } else {
        const releaseFloorDb = Math.max(tIrritationEnvelopeFloorDb, state.peakDb - tIrritationEnvelopeDynamicRangeDb, safeInputDb);
        const droppedFromPeakDb = Math.max(0, state.peakDb - nextDb);
        const remainingToFloorDb = Math.max(0, nextDb - releaseFloorDb);
        const startEase = 0.35 + 0.65 * smoothStep01(droppedFromPeakDb / tIrritationEnvelopeStartEaseDb);
        const endEase = smoothStep01(remainingToFloorDb / tIrritationEnvelopeEndEaseDb);
        const releaseRateDbPerSec = tIrritationEnvelopeReleaseDbPerSec * startEase * endEase;
        nextDb = Math.max(releaseFloorDb, nextDb - releaseRateDbPerSec * dtSec);

        if (Math.abs(nextDb - releaseFloorDb) < 0.001 && safeInputDb < releaseFloorDb) {
          state.peakDb = Math.max(safeInputDb + tIrritationEnvelopeDynamicRangeDb, state.peakDb - releaseRateDbPerSec * dtSec);
        }
      }

      return Math.max(tIrritationEnvelopeFloorDb, nextDb);
    }

    function buildTIrritationEnvelopeArrayFromT04(tIrritation04Array, stepSec) {
      const result = [];
      const state = { holdTimerSec: 0.0 };
      let envDb = tIrritationEnvelopeFloorDb;
      state.peakDb = tIrritationEnvelopeFloorDb;

      for (const linearValue of tIrritation04Array) {
        const inputDb = linearEnergyToDb(linearValue);
        envDb = updateTIrritationEnvelopeFollowerDb(envDb, inputDb, stepSec, state);
        result.push(dbToLinearEnergy(envDb));
      }

      return result;
    }

    function buildLookAheadArray(linearArray, lookAheadSteps) {
      const result = [];
      if (!Array.isArray(linearArray) || linearArray.length === 0) return result;

      for (let i = 0; i < linearArray.length; i++) {
        const sourceIndex = Math.min(linearArray.length - 1, i + lookAheadSteps);
        result.push(linearArray[sourceIndex]);
      }

      return result;
    }

    function appendHistorySample(history, timeSec, value) {
      history.push({ t: timeSec, value });
    }

    // EN: Remove samples older than the active history window.
    function trimLinearHistoryBySeconds(history, windowSec, nowSec) {
      const minTime = nowSec - windowSec;
      while (history.length > 0 && history[0].t < minTime) {
        history.shift();
      }
    }

    function averageHistoryLinear(history) {
      if (history.length === 0) return null;
      let sum = 0;
      for (const item of history) {
        sum += item.value;
      }
      return sum / history.length;
    }

    function meanAbsoluteDeltaFromHistory(history) {
      if (!history || history.length < 2) return 0;

      let sumDelta = 0;
      let count = 0;

      for (let i = 1; i < history.length; i++) {
        const previous = history[i - 1].value;
        const current = history[i].value;
        if (!isFinite(previous) || !isFinite(current)) continue;

        sumDelta += Math.abs(current - previous);
        count++;
      }

      return count > 0 ? sumDelta / count : 0;
    }

    function averageDbHistory(history) {
      if (!history || history.length === 0) return null;

      let sum = 0;
      let count = 0;

      for (const item of history) {
        if (!isFinite(item.value)) continue;
        sum += item.value;
        count++;
      }

      return count > 0 ? sum / count : null;
    }

    function averageDbValues(dbValues) {
      if (!dbValues.length) return null;
      let sumLinear = 0;
      for (const value of dbValues) {
        sumLinear += dbToLinearEnergy(value);
      }
      return linearEnergyToDb(sumLinear / dbValues.length);
    }

    function percentileSorted(sortedValues, percentile) {
      if (!sortedValues.length) return null;
      const index = (sortedValues.length - 1) * percentile;
      const lowerIndex = Math.floor(index);
      const upperIndex = Math.ceil(index);
      if (lowerIndex === upperIndex) return sortedValues[lowerIndex];
      const fraction = index - lowerIndex;
      return sortedValues[lowerIndex] + fraction * (sortedValues[upperIndex] - sortedValues[lowerIndex]);
    }

    // ==============================
    // HISTOGRAM & GATING
    // ==============================
    // EN: Basic ungated percentile statistics for quick A/B comparison against the gated version.
    function getUngatedStatsFromHistory(history) {
      if (!history || history.length < 10) return null;

      const values = history.map(item => item.value).filter(value => isFinite(value));
      const absoluteGated = values.filter(value => value >= -70);
      if (absoluteGated.length < 5) return null;

      const sorted = [...absoluteGated].sort((a, b) => a - b);
      const p10 = percentileSorted(sorted, 0.10);
      const p95 = percentileSorted(sorted, 0.95);
      if (!isFinite(p10) || !isFinite(p95)) return null;

      return {
        absoluteThresholdDb: -70,
        relativeThresholdDb: null,
        p10Db: p10,
        p95Db: p95,
        lraDb: p95 - p10,
        values: absoluteGated
      };
    }

    // EN: Derive true two-stage gated loudness statistics from recent short-term history.
    // EN: Stage 1 = absolute gate at -70 LUFS-style dB.
    // EN: Stage 2 = relative gate at 10 LU below the average of the absolute-gated set.
    function getLraStatsFromShortTermHistory(history) {
      if (!history || history.length < 20) return null;

      const values = history.map(item => item.value).filter(value => isFinite(value));
      const absoluteGated = values.filter(value => value >= -70);
      if (absoluteGated.length < 10) return null;

      const meanAbsGateDb = averageDbValues(absoluteGated);
      if (!isFinite(meanAbsGateDb)) return null;

      const relativeThresholdDb = meanAbsGateDb - 10;
      const relativeGated = absoluteGated.filter(value => value >= relativeThresholdDb);
      if (relativeGated.length < 10) return null;

      const sorted = [...relativeGated].sort((a, b) => a - b);
      const p10 = percentileSorted(sorted, 0.10);
      const p95 = percentileSorted(sorted, 0.95);
      if (!isFinite(p10) || !isFinite(p95)) return null;

      return {
        absoluteThresholdDb: -70,
        relativeThresholdDb,
        meanAbsoluteGatedDb: meanAbsGateDb,
        p10Db: p10,
        p95Db: p95,
        lraDb: p95 - p10,
        values: relativeGated,
        absoluteGatedCount: absoluteGated.length,
        relativeGatedCount: relativeGated.length,
        totalCount: values.length
      };
    }

    function getStandardLikeLraStatsFromShortTermHistory(history) {
      if (!history || history.length < 10) return null;

      const values = history
        .map(item => item.value)
        .filter(value => isFinite(value));

      const absoluteGated = values.filter(value => value >= -70);
      if (absoluteGated.length < 5) return null;

      const meanAbsGateDb = averageDbValues(absoluteGated);
      if (!isFinite(meanAbsGateDb)) return null;

      // EN: LRA-style relative gate is 20 LU below the absolute-gated mean.
      // EN: This differs from integrated loudness gating, which uses -10 LU.
      const relativeThresholdDb = meanAbsGateDb - 20;
      const relativeGated = absoluteGated.filter(value => value >= relativeThresholdDb);
      if (relativeGated.length < 5) return null;

      const sorted = [...relativeGated].sort((a, b) => a - b);
      const p10 = percentileSorted(sorted, 0.10);
      const p95 = percentileSorted(sorted, 0.95);
      if (!isFinite(p10) || !isFinite(p95)) return null;

      return {
        absoluteThresholdDb: -70,
        relativeThresholdDb,
        meanAbsoluteGatedDb: meanAbsGateDb,
        p10Db: p10,
        p95Db: p95,
        lraDb: p95 - p10,
        values: relativeGated,
        absoluteGatedCount: absoluteGated.length,
        relativeGatedCount: relativeGated.length,
        totalCount: values.length
      };
    }

    // EN: Build a loudness histogram from recent Full short-term values to visualize dynamics distribution.
    function getRealtimeProgramStatsFromDbHistory(history) {
      // EN: Program-style realtime summary for generated/test signals.
      // EN: It is intentionally descriptive and does not feed the limiter.
      const values = (history || [])
        .map(item => item.value)
        .filter(value => Number.isFinite(value));

      if (values.length < 10) {
        return { p95Db: null, lraDb: null, p10Db: null };
      }

      const sorted = [...values].sort((a, b) => a - b);
      const p10Db = percentileSorted(sorted, 0.10);
      const p95Db = percentileSorted(sorted, 0.95);
      return {
        p10Db,
        p95Db,
        lraDb: Number.isFinite(p10Db) && Number.isFinite(p95Db) ? p95Db - p10Db : null
      };
    }

    function buildHistogramFromValues(values, minDb, maxDb, binSizeDb) {
      const binCount = Math.ceil((maxDb - minDb) / binSizeDb);
      const bins = new Array(binCount).fill(0);

      for (const value of values) {
        if (!isFinite(value)) continue;
        const clamped = Math.min(maxDb - 1e-9, Math.max(minDb, value));
        const index = Math.floor((clamped - minDb) / binSizeDb);
        bins[index] += 1;
      }

      return bins;
    }
    // ==============================
    // MAIN ANALYSIS + RENDER LOOP
    // ==============================
    function draw() {
      animationId = requestAnimationFrame(draw);

      const nowSec = performance.now() * 0.001;
      let dtSec = 1 / 60;
      if (previousFrameTimeSec !== null) {
        dtSec = clamp(nowSec - previousFrameTimeSec, 0.001, 0.25);
      }
      previousFrameTimeSec = nowSec;

      // EN: Robust file-end detection. Some browsers call onended slightly late,
      // EN: so also freeze when the playback cursor reaches the decoded duration.
      if (
        activeInputMode === "file" &&
        fileAudioBuffer &&
        !filePlaybackEnded &&
        audioContext &&
        audioContext.currentTime - fileStartedAtContextTime >= fileAudioBuffer.duration - 0.02
      ) {
        filePlaybackEnded = true;
        filePlaybackOffsetSec = fileAudioBuffer.duration;
        fileStartedAtContextTime = audioContext.currentTime - filePlaybackOffsetSec;
        console.log("[file] playback end detected by draw loop; freezing analysis");
      }

      const freezeFileAnalysis = activeInputMode === "file" && filePlaybackEnded && fileAnalysis.ready;
      if (freezeFileAnalysis) {
        loudnessUpdateAccumSec = 0;
      }

      if (audioPaused || freezeFileAnalysis) {
        // EN: When audio is paused, keep the analysis loop running but feed synthetic silence.
        // EN: When a file has ended, also avoid feeding stale analyser samples into realtime histories.
        timeData.fill(0);
        freqData.fill(-100);
        if (kTimeData) kTimeData.fill(0);
        if (tfcPreAnalysisDryTimeData) tfcPreAnalysisDryTimeData.fill(0);
        if (tfcPreAnalysisDryFreqData) tfcPreAnalysisDryFreqData.fill(-100);
      } else {
        analyser.getFloatTimeDomainData(timeData);
        analyser.getFloatFrequencyData(freqData);
        if (kAnalyser && kTimeData) {
          kAnalyser.getFloatTimeDomainData(kTimeData);
        }
        if (tfcPreAnalysisDryAnalyser && tfcPreAnalysisDryTimeData && tfcPreAnalysisDryFreqData) {
          tfcPreAnalysisDryAnalyser.getFloatTimeDomainData(tfcPreAnalysisDryTimeData);
          tfcPreAnalysisDryAnalyser.getFloatFrequencyData(tfcPreAnalysisDryFreqData);
        }
      }

      const nowMs = performance.now();
      if (DEBUG_LOGS && nowMs - lastAnalyserDebugLogTimeMs > 1000) {
        lastAnalyserDebugLogTimeMs = nowMs;
        console.log("[analyser] data snapshot", {
          activeInputMode,
          firstTimeSample: Number(timeData[0].toFixed(6)),
          firstFreqSample: Number(freqData[0].toFixed(2)),
          audioContextState: audioContext ? audioContext.state : "none"
        });
      }

      const rms = calculateRMS(timeData);
      const rmsDbFs = rms > 0 ? 20 * Math.log10(rms) : -100;
      const samplePeak = calculateMaxAbs(timeData);
      const samplePeakLinear = samplePeak > 0 ? samplePeak * samplePeak : dbToLinearEnergy(-100);

      // EN: K-weighted energy is measured from the parallel filtered time-domain path.
      // EN: Energy is stored as RMS² and converted to dB only for display/debug.
      const kWeightedRms = kTimeData ? calculateRMS(kTimeData) : 0;
      const kWeightedLinear = kWeightedRms > 0 ? kWeightedRms * kWeightedRms : dbToLinearEnergy(-100);

      const timeDomainLinear = rms > 0 ? rms * rms : dbToLinearEnergy(-100);
      const bandValues = getThirdOctaveBandValues(freqData, audioContext.sampleRate, timeDomainLinear);

      let dryBandValues = null;
      if (tfcPreAnalysisDryFreqData && tfcPreAnalysisDryTimeData) {
        const dryRms = calculateRMS(tfcPreAnalysisDryTimeData);
        const dryTimeDomainLinear = dryRms > 0 ? dryRms * dryRms : dbToLinearEnergy(-100);
        dryBandValues = getThirdOctaveBandValues(tfcPreAnalysisDryFreqData, audioContext.sampleRate, dryTimeDomainLinear);
      }

      const supportBands = bandValues.filter(band => band.centerFreq >= 20 && band.centerFreq <= 63);
      const supportLinear = supportBands.reduce((sum, band) => sum + band.linear, 0);

      const irritationBands = bandValues.filter(band => band.centerFreq === 80 || band.centerFreq === 100);
      const irritationLinear = irritationBands.reduce((sum, band) => sum + band.linear, 0) || dbToLinearEnergy(-100);

      const dryIrritationBands = Array.isArray(dryBandValues)
        ? dryBandValues.filter(band => band.centerFreq === 80 || band.centerFreq === 100)
        : null;
      const dryIrritationLinear = dryIrritationBands
        ? (dryIrritationBands.reduce((sum, band) => sum + band.linear, 0) || dbToLinearEnergy(-100))
        : null;

      const audioBands = bandValues.filter(band => band.centerFreq >= 125);
      const audioLinear = audioBands.reduce((sum, band) => sum + band.linear, 0);

      const fullLinear = bandValues.reduce((sum, band) => sum + band.linear, 0) || dbToLinearEnergy(rmsDbFs);
      const fullLinearRaw = bandValues.reduce((sum, band) => sum + band.linearRaw, 0) || timeDomainLinear;

      // EN: Update loudness histories at 10 Hz so the short-term meter uses a true sliding window.
      loudnessUpdateAccumSec += dtSec;
      let didAppendShortTermSample = false;
      while (!freezeFileAnalysis && loudnessUpdateAccumSec >= loudnessUpdateIntervalSec) {
        loudnessUpdateAccumSec -= loudnessUpdateIntervalSec;
        didAppendShortTermSample = true;

        appendHistorySample(supportShortHistory, nowSec, supportLinear);
        appendHistorySample(tSupportMomentaryWindowHistory, nowSec, supportLinear);
        appendHistorySample(tIrritationMomentaryWindowHistory, nowSec, irritationLinear);
        appendHistorySample(irritationShortHistory, nowSec, irritationLinear);
        appendHistorySample(audioShortHistory, nowSec, audioLinear);
        appendHistorySample(fullShortHistory, nowSec, fullLinear);
        appendHistorySample(fullShortRawHistory, nowSec, fullLinearRaw);

        // EN: Store the same Full-band analysis-path energy for the 10 s exposure reference.
        // EN: This uses the same filters, band summing, and gain staging as the short-term Full meter.
        appendHistorySample(fullLongExposureHistory, nowSec, fullLinear);
        appendHistorySample(kWeightedShortHistory, nowSec, kWeightedLinear);
        appendHistorySample(kWeightedLongExposureHistory, nowSec, kWeightedLinear);

        appendHistorySample(levelPeakFastHistory, nowSec, samplePeakLinear);
        appendHistorySample(levelRmsFastHistory, nowSec, timeDomainLinear);

        trimLinearHistoryBySeconds(supportShortHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(tSupportMomentaryWindowHistory, realtimeIntegratedBlockWindowSec, nowSec);
        trimLinearHistoryBySeconds(tIrritationMomentaryWindowHistory, realtimeIntegratedBlockWindowSec, nowSec);
        trimLinearHistoryBySeconds(irritationShortHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(audioShortHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(fullShortHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(fullShortRawHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(fullLongExposureHistory, longTermExposureWindowSec, nowSec);
        trimLinearHistoryBySeconds(kWeightedShortHistory, shortTermWindowSec, nowSec);
        trimLinearHistoryBySeconds(kWeightedLongExposureHistory, longTermExposureWindowSec, nowSec);
        trimLinearHistoryBySeconds(levelPeakFastHistory, fastLevelWindowSec, nowSec);
        trimLinearHistoryBySeconds(levelRmsFastHistory, fastLevelWindowSec, nowSec);
        trimLinearHistoryBySeconds(levelScopeHistory, levelScopeWindowSec, nowSec);
      }

      const supportShortLinear = averageHistoryLinear(supportShortHistory) ?? supportLinear;
      const irritationShortLinear = averageHistoryLinear(irritationShortHistory) ?? irritationLinear;
      const audioShortLinear = averageHistoryLinear(audioShortHistory) ?? audioLinear;
      const fullShortLinear = averageHistoryLinear(fullShortHistory) ?? fullLinear;
      const fullShortLinearRaw = averageHistoryLinear(fullShortRawHistory) ?? fullLinearRaw;

      const peak04Linear = maxHistoryLinear(levelPeakFastHistory) ?? samplePeakLinear;
      const rms04Linear = averageHistoryLinear(levelRmsFastHistory) ?? timeDomainLinear;
      const rms3Linear = fullShortLinearRaw;
      const peak04Db = linearEnergyToDb(peak04Linear);
      const rms04Db = linearEnergyToDb(rms04Linear);
      const rms3Db = linearEnergyToDb(rms3Linear);

      // EN: 10 s exposure is calculated from linear energy and converted to dB only for display/debug.
      // EN: Delta compares current perceived loudness context: positive = build-up, negative = release.
      const fullLongExposureLinear = averageHistoryLinear(fullLongExposureHistory) ?? fullLinear;
      const kWeightedShortLinear = averageHistoryLinear(kWeightedShortHistory) ?? kWeightedLinear;
      const kWeightedLongExposureLinear = averageHistoryLinear(kWeightedLongExposureHistory) ?? kWeightedLinear;
      const kWeightedShortScopeDb = linearEnergyToDb(kWeightedShortLinear);
      const kWeightedMomentaryScopeLinear = averageHistoryLinear(kRealtimeMomentaryWindowHistory) ?? kWeightedLinear;
      const kWeightedMomentaryScopeDb = linearEnergyToDb(kWeightedMomentaryScopeLinear);
      const kWeightedLongScopeDb = linearEnergyToDb(kWeightedLongExposureLinear);
      const kAdaptiveScopeDb = linearEnergyToDb(kAdaptiveContextLinear ?? kWeightedShortLinear);
      const kAdaptiveLookAheadDb = kAdaptiveScopeDb;

      const supportDb = linearEnergyToDb(supportLinear);
      const supportShortDb = linearEnergyToDb(supportShortLinear);

      // EN: T = tactile support channel in v5.14.
      // EN: T04 and T3 mirror the LUFS/K time layers, but the weighting is the support band itself (20–63 Hz).
      // EN: T Support Need is analysis-only for now: positive deficit = adapt - current, later a boost candidate.
      const tSupport04Linear = averageHistoryLinear(tSupportMomentaryWindowHistory) ?? supportLinear;
      const tSupport04Db = linearEnergyToDb(tSupport04Linear);
      const tSupport3Db = supportShortDb;

      if (didAppendShortTermSample && isFinite(tSupport04Db)) {
        // EN: Store T04 in dB for structure diagnostics.
        // EN: Modulation is the mean absolute dB change over the recent 3 s window.
        // EN: It does not classify content as good/bad; it only separates steady vs changing support.
        appendHistorySample(tSupportStructureHistory, nowSec, tSupport04Db);
        trimLinearHistoryBySeconds(tSupportStructureHistory, shortTermWindowSec, nowSec);

        // EN: Keep a longer realtime Support distribution for program-style overlay statistics.
        appendHistorySample(tSupportRealtimeProgramHistory, nowSec, tSupport04Db);
        trimLinearHistoryBySeconds(tSupportRealtimeProgramHistory, maxHistogramHistorySec, nowSec);
      }

      const tSupportModDb = meanAbsoluteDeltaFromHistory(tSupportStructureHistory);
      const tSupportCrestDb = tSupport04Db - tSupport3Db;

      if (didAppendShortTermSample && isFinite(tSupport04Linear) && tSupport04Linear > 0) {
        tSupportEnvelopeDb = updateTSupportEnvelopeFollowerDb(
          tSupportEnvelopeDb,
          tSupport04Db,
          loudnessUpdateIntervalSec,
          {
            get holdTimerSec() { return tSupportEnvelopeHoldTimerSec; },
            set holdTimerSec(value) { tSupportEnvelopeHoldTimerSec = value; },
            get peakDb() { return tSupportEnvelopePeakDb; },
            set peakDb(value) { tSupportEnvelopePeakDb = value; }
          }
        );
        tSupportAdaptContextLinear = dbToLinearEnergy(tSupportEnvelopeDb);
      }

      const tSupportAdaptDb = linearEnergyToDb(tSupportAdaptContextLinear ?? tSupport04Linear);
      const tSupportNeedDb = Math.max(0, tSupportAdaptDb - tSupport04Db);


      if (didAppendShortTermSample) {
        // EN: Store display-ready dB values for the scrolling 20 s scope.
        // EN: K 10 s is a rolling K-weighted exposure estimate, not full BS.1770 integrated LUFS.
        levelScopeHistory.push({
          t: nowSec,
          peak04Db,
          rms04Db,
          rms3Db,
          kWeightedMomentaryScopeDb,
          kWeightedShortScopeDb,
          kWeightedLongScopeDb,
          kAdaptiveScopeDb,
          kAdaptiveLookAheadScopeDb: kAdaptiveLookAheadDb
        });
        trimLinearHistoryBySeconds(levelScopeHistory, levelScopeWindowSec, nowSec);
      }

      const irritationDb = linearEnergyToDb(irritationLinear);
      const irritationShortDb = linearEnergyToDb(irritationShortLinear);

      // EN: T Irritation is the upper-bass tactile overload channel.
      // EN: It mirrors the K/T Support timing layers, but uses the irritation band energy.
      // EN: Excess is positive-only and is intended as a future limiter candidate, not active gain control.
      if (didAppendShortTermSample && isFinite(irritationLinear) && irritationLinear > 0) {
        appendHistorySample(tIrritationMomentaryWindowHistory, nowSec, irritationLinear);
        trimLinearHistoryBySeconds(tIrritationMomentaryWindowHistory, realtimeIntegratedBlockWindowSec, nowSec);
      }

      const tIrritation04Linear = averageHistoryLinear(tIrritationMomentaryWindowHistory) ?? irritationLinear;
      const tIrritation04Db = linearEnergyToDb(tIrritation04Linear);
      const tIrritation3Db = irritationShortDb;

      if (didAppendShortTermSample && Number.isFinite(tIrritation04Db)) {
        // EN: Keep a longer realtime Irritation distribution for program-style overlay statistics.
        appendHistorySample(tIrritationRealtimeProgramHistory, nowSec, tIrritation04Db);
        trimLinearHistoryBySeconds(tIrritationRealtimeProgramHistory, maxHistogramHistorySec, nowSec);
      }

      if (didAppendShortTermSample && isFinite(tIrritation04Linear) && tIrritation04Linear > 0) {
        tIrritationEnvelopeDb = updateTIrritationEnvelopeFollowerDb(
          tIrritationEnvelopeDb,
          tIrritation04Db,
          loudnessUpdateIntervalSec,
          {
            get holdTimerSec() { return tIrritationEnvelopeHoldTimerSec; },
            set holdTimerSec(value) { tIrritationEnvelopeHoldTimerSec = value; },
            get peakDb() { return tIrritationEnvelopePeakDb; },
            set peakDb(value) { tIrritationEnvelopePeakDb = value; }
          }
        );
        tIrritationAdaptContextLinear = dbToLinearEnergy(tIrritationEnvelopeDb);
      }

      const tIrritationAdaptDb = linearEnergyToDb(tIrritationAdaptContextLinear ?? tIrritation04Linear);
      const realtimeTIrritationLimitDb = getTfcIrritationLimitDb(null, tIrritationAdaptDb, tIrritation04Db);
      const tIrritationExcessDb = Number.isFinite(realtimeTIrritationLimitDb)
        ? Math.max(0, tIrritation04Db - realtimeTIrritationLimitDb)
        : 0;

      const audioDb = linearEnergyToDb(audioLinear);
      const audioShortDb = linearEnergyToDb(audioShortLinear);

      const fullDb = linearEnergyToDb(fullLinear);
      const fullShortDb = linearEnergyToDb(fullShortLinear);
      const fullLongExposureDb = linearEnergyToDb(fullLongExposureLinear);
      const fullExposureDeltaDb = fullShortDb - fullLongExposureDb;
      const kWeightedDb = linearEnergyToDb(kWeightedLinear);
      const kWeightedShortDb = linearEnergyToDb(kWeightedShortLinear);
      const kWeightedLongExposureDb = linearEnergyToDb(kWeightedLongExposureLinear);
      const kWeightedExposureDeltaDb = kWeightedShortDb - kWeightedLongExposureDb;
      const kAdaptiveDb = linearEnergyToDb(kAdaptiveContextLinear ?? kWeightedShortLinear);
      const kAdaptiveDeltaDb = kWeightedShortDb - kAdaptiveDb;
      const kMinusFullShortDb = kWeightedShortDb - fullShortDb;
      const kMinusAudioShortDb = kWeightedShortDb - audioShortDb;

      if (DEBUG_LOGS && didAppendShortTermSample && nowMs - lastExposureDebugLogTimeMs > 1000) {
        lastExposureDebugLogTimeMs = nowMs;
        console.log("[exposure] short vs long", {
          shortTerm3sDb: Number(fullShortDb.toFixed(2)),
          longTerm10sDb: Number(fullLongExposureDb.toFixed(2)),
          deltaDb: Number(fullExposureDeltaDb.toFixed(2)),
          kShortTerm3sDb: Number(kWeightedShortDb.toFixed(2)),
          kLongTerm10sDb: Number(kWeightedLongExposureDb.toFixed(2)),
          kDeltaDb: Number(kWeightedExposureDeltaDb.toFixed(2)),
          kMinusFullShortDb: Number(kMinusFullShortDb.toFixed(2)),
          kMinusAudioShortDb: Number(kMinusAudioShortDb.toFixed(2)),
          longWindowSamples: fullLongExposureHistory.length
        });
      }

      if (didAppendShortTermSample && isFinite(fullShortLinearRaw) && fullShortLinearRaw > 0) {
        fullShortTermRawHistory.push({ t: nowSec, value: fullShortLinearRaw });
        trimLinearHistoryBySeconds(fullShortTermRawHistory, maxHistogramHistorySec, nowSec);
      }

      if (didAppendShortTermSample && isFinite(kWeightedShortLinear) && kWeightedShortLinear > 0) {
        kWeightedShortTermRawHistory.push({ t: nowSec, value: kWeightedShortLinear });
        trimLinearHistoryBySeconds(kWeightedShortTermRawHistory, maxHistogramHistorySec, nowSec);
      }

      if (didAppendShortTermSample && isFinite(kWeightedLinear) && kWeightedLinear > 0) {
        // EN: Build a 400 ms K-weighted momentary block from raw K energy samples.
        // EN: Store the block for a running integrated loudness estimate using -70 / -10 gating.
        kRealtimeMomentaryWindowHistory.push({ t: nowSec, value: kWeightedLinear });
        trimLinearHistoryBySeconds(kRealtimeMomentaryWindowHistory, realtimeIntegratedBlockWindowSec, nowSec);

        const k04RealtimeLinear = averageHistoryLinear(kRealtimeMomentaryWindowHistory);
        if (isFinite(k04RealtimeLinear) && k04RealtimeLinear > 0) {
          kRealtimeIntegratedBlockHistory.push({
            t: nowSec,
            energy: k04RealtimeLinear,
            db: linearEnergyToDb(k04RealtimeLinear)
          });
          trimLinearHistoryBySeconds(kRealtimeIntegratedBlockHistory, maxHistogramHistorySec, nowSec);

          // K ENVELOPE FOLLOWER + LOOK-AHEAD
          // EN: Realtime envelope follows 400 ms K blocks. True future look-ahead is only available offline.
          kEnvelopeDb = updateKEnvelopeFollowerDb(
            kEnvelopeDb,
            linearEnergyToDb(k04RealtimeLinear),
            loudnessUpdateIntervalSec,
            {
              get holdTimerSec() { return kEnvelopeHoldTimerSec; },
              set holdTimerSec(value) { kEnvelopeHoldTimerSec = value; },
              get peakDb() { return kEnvelopePeakDb; },
              set peakDb(value) { kEnvelopePeakDb = value; }
            }
          );
          kAdaptiveContextLinear = dbToLinearEnergy(kEnvelopeDb);
        }
      }

      if (
        didAppendShortTermSample &&
        isFinite(kWeightedShortLinear) &&
        kWeightedShortLinear > 0 &&
        (lastLraSampleTimeSec === null || nowSec - lastLraSampleTimeSec >= 1.0)
      ) {
        lastLraSampleTimeSec = nowSec;

        kWeightedLraShortTermHistory.push({
          t: nowSec,
          value: linearEnergyToDb(kWeightedShortLinear)
        });

        trimLinearHistoryBySeconds(kWeightedLraShortTermHistory, maxHistogramHistorySec, nowSec);
      }

      const calibratedKShortTermHistory = kWeightedShortTermRawHistory
        .map(item => ({ t: item.t, value: linearEnergyToDb(item.value) }))
        .filter(item => isFinite(item.value));

      const kUngatedStats = getUngatedStatsFromHistory(calibratedKShortTermHistory);
      const kGatedStats = getLraStatsFromShortTermHistory(calibratedKShortTermHistory);
      const kLraStats = getStandardLikeLraStatsFromShortTermHistory(kWeightedLraShortTermHistory);
      const kRunningIntegratedStats = calculateRunningIntegratedKEstimateFromBlocks(kRealtimeIntegratedBlockHistory);
      const tSupportRealtimeProgramStats = getRealtimeProgramStatsFromDbHistory(tSupportRealtimeProgramHistory);
      const tIrritationRealtimeProgramStats = getRealtimeProgramStatsFromDbHistory(tIrritationRealtimeProgramHistory);

      // EN: Histogram still uses the denser 10 Hz history.
      // EN: LRA display uses the 1 Hz / 3 s standard-like estimate.
      const activeHistogramStats = histogramGateEnabled ? (kLraStats || kGatedStats) : kUngatedStats;

      // EN: Evaluate gating only for the newest short-term block.
      // EN: This answers: "would this block be rejected right now?"
      if (didAppendShortTermSample && histogramGateEnabled && kGatedStats) {
        const currentDb = linearEnergyToDb(kWeightedShortLinear);
        const absGate = kGatedStats.absoluteThresholdDb;
        const relGate = kGatedStats.relativeThresholdDb;

        const rejected =
          (isFinite(absGate) && currentDb < absGate) ||
          (isFinite(relGate) && currentDb < relGate);

        gateBlockRejectedNow = rejected;

        if (rejected) {
          // EN: Trigger a short visual flash for one rejected analysis block.
          gateFlashUntilMs = nowMs + 150;
        }
      } else if (didAppendShortTermSample) {
        gateBlockRejectedNow = false;
      }

      let histogramSourceValues;
      if (histogramGateEnabled && kGatedStats && kGatedStats.values.length > 0) {
        histogramSourceValues = kGatedStats.values;
      } else {
        histogramSourceValues = calibratedKShortTermHistory.map(item => item.value);
      }

      const histogramBins = buildHistogramFromValues(histogramSourceValues, histogramMinDb, histogramMaxDb, histogramBinSizeDb);

      // EN: Do not show persistent "gate active" state.
      // EN: Only momentary current-block rejection events are visualized.
      const histogramGateActive = false;

      let renderLevelScopeHistory = levelScopeHistory;
      let renderPeak04Db = peak04Db;
      let renderRms04Db = rms04Db;
      let renderRms3Db = rms3Db;
      let renderK04Db = kWeightedMomentaryScopeDb;
      let renderK3Db = kWeightedShortScopeDb;
      let renderK30Db = kWeightedLongScopeDb;
      let renderKAdaptiveDb = kAdaptiveScopeDb;
      let renderKAdaptiveLookAheadDb = kAdaptiveLookAheadDb;
      let renderTSupport04Db = tSupport04Db;
      let renderTSupport3Db = tSupport3Db;
      let renderTSupportAdaptDb = tSupportAdaptDb;
      let renderTSupportNeedDb = tSupportNeedDb;
      let renderTSupportModDb = tSupportModDb;
      let renderTSupportCrestDb = tSupportCrestDb;
      let renderTIrritation04Db = tIrritation04Db;
      let renderTIrritation3Db = tIrritation3Db;
      let renderTIrritationAdaptDb = tIrritationAdaptDb;
      let renderTIrritationExcessDb = tIrritationExcessDb;
      let renderDryTIrritation04Db = Number.isFinite(dryIrritationLinear) ? linearEnergyToDb(dryIrritationLinear) : tIrritation04Db;
      let renderProgramLraDb = activeHistogramStats ? activeHistogramStats.lraDb : null;
      let renderProgramP10Db = activeHistogramStats ? activeHistogramStats.p10Db : null;
      let renderProgramP95Db = activeHistogramStats ? activeHistogramStats.p95Db : null;
      let renderProgramRelativeGateDb = histogramGateEnabled && activeHistogramStats ? activeHistogramStats.relativeThresholdDb : null;
      let renderKIntegratedDb = kRunningIntegratedStats.integratedDb;
      let renderKIntegratedGateDb = kRunningIntegratedStats.relativeThresholdDb;
      let renderKIntegratedStatus = kRunningIntegratedStats.status;
      let renderKIntegratedAcceptedCount = kRunningIntegratedStats.relativeAcceptedCount;
      let renderKIntegratedTotalCount = kRunningIntegratedStats.totalBlockCount;
      let renderKIntegratedMinBlocks = kRunningIntegratedStats.minBlockCount;
      let renderTSupportIntegratedDb = null;
      let renderTSupportLraDb = tSupportRealtimeProgramStats.lraDb;
      let renderTSupportLraP10Db = tSupportRealtimeProgramStats.p10Db;
      let renderTSupportLraP95Db = tSupportRealtimeProgramStats.p95Db;
      let renderTIrritationIntegratedDb = null;
      let renderTIrritationLraDb = tIrritationRealtimeProgramStats.lraDb;
      let renderTIrritationLraP10Db = tIrritationRealtimeProgramStats.p10Db;
      let renderTIrritationLraP95Db = tIrritationRealtimeProgramStats.p95Db;
      let renderScopeStartSec = null;
      let renderTfcScopeHistory = tfcScopeHistory;

      // EN: During file playback, the scope reads precomputed offline arrays.
      // EN: Follow mode keeps the visible 20 s window attached to playback; manual mode scrolls independently.
      if (activeInputMode === "file" && fileAnalysis.ready) {
        const fileCursorSec = getFilePlaybackTimeSec();
        const fileIndex = getNearestFileAnalysisIndex(fileCursorSec);
        const maxScopeStartSec = Math.max(0, fileAnalysis.durationSec - levelScopeWindowSec);

        let renderScopeEndSec = fileScopeViewStartSec + levelScopeWindowSec;

        if (fileScopeFollowPlayback) {
          // EN: Match realtime startup behavior: right edge = cursor, left side remains empty before 20 s has elapsed.
          fileScopeViewStartSec = fileCursorSec - levelScopeWindowSec;
          renderScopeEndSec = fileCursorSec;
        } else {
          fileScopeViewStartSec = clamp(fileScopeViewStartSec, 0, maxScopeStartSec);
          renderScopeEndSec = fileScopeViewStartSec + levelScopeWindowSec;
        }

        renderScopeStartSec = fileScopeViewStartSec;
        renderLevelScopeHistory = buildOfflineScopeWindow(fileScopeViewStartSec, levelScopeWindowSec, renderScopeEndSec);
        renderTfcScopeHistory = buildOfflineTfcScopeWindow(fileScopeViewStartSec, levelScopeWindowSec, renderScopeEndSec);

        if (fileIndex >= 0) {
          renderPeak04Db = linearEnergyToDb(fileAnalysis.peak04[fileIndex]);
          renderRms04Db = linearEnergyToDb(fileAnalysis.rms04[fileIndex]);
          renderRms3Db = linearEnergyToDb(fileAnalysis.rms3[fileIndex]);
          renderK04Db = linearEnergyToDb(fileAnalysis.k04[fileIndex]);
          renderK3Db = linearEnergyToDb(fileAnalysis.k3[fileIndex]);
          renderK30Db = linearEnergyToDb(fileAnalysis.k30[fileIndex]);
          renderKAdaptiveDb = linearEnergyToDb(fileAnalysis.kAdaptive[fileIndex]);
          renderKAdaptiveLookAheadDb = linearEnergyToDb(fileAnalysis.kAdaptiveLookAhead[fileIndex]);
          renderTSupport04Db = linearEnergyToDb(fileAnalysis.tSupport04[fileIndex]);
          renderTSupport3Db = linearEnergyToDb(fileAnalysis.tSupport3[fileIndex]);
          renderTSupportAdaptDb = linearEnergyToDb(fileAnalysis.tSupportAdaptive[fileIndex]);
          renderTSupportNeedDb = linearEnergyToDb(fileAnalysis.tSupportNeed[fileIndex]);
          renderTSupportModDb = fileAnalysis.tSupportModDb[fileIndex];
          renderTSupportCrestDb = fileAnalysis.tSupportCrestDb[fileIndex];
          // EN: Offline file analysis is the dry/cursor reference.
          // EN: When pre-analysis TFC is enabled, keep the live analyser values as wet so dry/wet can actually diverge.
          const offlineDryTIrritation04Db = linearEnergyToDb(fileAnalysis.tIrritation04[fileIndex]);
          const offlineDryTIrritation3Db = linearEnergyToDb(fileAnalysis.tIrritation3[fileIndex]);
          const offlineDryTIrritationAdaptDb = linearEnergyToDb(fileAnalysis.tIrritationAdaptive[fileIndex]);
          renderDryTIrritation04Db = offlineDryTIrritation04Db;
          if (!tfcPreAnalysisLimiterEnabled) {
            renderTIrritation04Db = offlineDryTIrritation04Db;
            renderTIrritation3Db = offlineDryTIrritation3Db;
            renderTIrritationAdaptDb = offlineDryTIrritationAdaptDb;
          }
          const irritationLimitDb = getTfcIrritationLimitDb(fileAnalysis.tIrritationLraP95Db, renderTIrritationAdaptDb, renderDryTIrritation04Db);
          renderTIrritationExcessDb = Number.isFinite(irritationLimitDb)
            ? Math.max(0, renderDryTIrritation04Db - irritationLimitDb)
            : 0;
        }

        // EN: In file mode, Program data is frozen offline analysis, not realtime analyser history.
        renderProgramLraDb = fileAnalysis.lraEstimateDb;
        renderProgramP10Db = fileAnalysis.lraP10Db;
        renderProgramP95Db = fileAnalysis.lraP95Db;
        renderProgramRelativeGateDb = fileAnalysis.lraGateThresholdDb;
        renderKIntegratedDb = fileAnalysis.kIntegratedEstimateDb;
        renderKIntegratedGateDb = fileAnalysis.gateThresholdDb;
        renderKIntegratedStatus = "ready";
        renderKIntegratedAcceptedCount = fileAnalysis.relativeAcceptedCount;
        renderKIntegratedTotalCount = fileAnalysis.totalBlockCount;
        renderKIntegratedMinBlocks = fileAnalysis.totalBlockCount;
        renderTSupportIntegratedDb = fileAnalysis.tSupportIntegratedEstimateDb;
        renderTSupportLraDb = fileAnalysis.tSupportLraEstimateDb;
        renderTSupportLraP10Db = fileAnalysis.tSupportLraP10Db;
        renderTSupportLraP95Db = fileAnalysis.tSupportLraP95Db;
        renderTIrritationIntegratedDb = fileAnalysis.tIrritationIntegratedEstimateDb;
        renderTIrritationLraDb = fileAnalysis.tIrritationLraEstimateDb;
        renderTIrritationLraP10Db = fileAnalysis.tIrritationLraP10Db;
        renderTIrritationLraP95Db = fileAnalysis.tIrritationLraP95Db;
      }

      updateTfcIrritationPreviewControl(renderTIrritation04Db, renderTIrritationLraP95Db);
      updateTfcPreAnalysisLimiterControl(renderDryTIrritation04Db, renderTIrritation04Db, renderTIrritationLraP95Db);
      updatePassiveLevelerObserver(renderTIrritationLraP95Db, renderTIrritation3Db, didAppendShortTermSample);

      if (didAppendShortTermSample && activeInputMode !== "file") {
        // EN: Separate realtime TFC scope history keeps control-loop visibility independent from the classic K scope.
        const tfcErrorDb = Number.isFinite(renderDryTIrritation04Db) && Number.isFinite(tfcPreAnalysisLimitDb)
          ? renderDryTIrritation04Db - tfcPreAnalysisLimitDb
          : null;
        const tfcExpectedReductionDb = Number.isFinite(tfcErrorDb) ? clamp(softKneeReductionDb(tfcErrorDb), 0, 12) : null;
        const tfcActualReductionDb = Number.isFinite(renderDryTIrritation04Db) && Number.isFinite(renderTIrritation04Db)
          ? Math.max(0, renderDryTIrritation04Db - renderTIrritation04Db)
          : null;
        const tfcModelErrorDb = Number.isFinite(tfcExpectedReductionDb) && Number.isFinite(tfcActualReductionDb)
          ? tfcExpectedReductionDb - tfcActualReductionDb
          : null;
        state.tfcModelErrorDb = tfcModelErrorDb;
        tfcScopeHistory.push({
          t: nowSec,
          tIrrDryDb: renderDryTIrritation04Db,
          tIrrWetDb: renderTIrritation04Db,
          tIrrLimitDb: tfcPreAnalysisLimitDb,
          tIrrErrorDb: tfcErrorDb,
          tIrrExpectedReductionDb: tfcExpectedReductionDb,
          tIrrActualReductionDb: tfcActualReductionDb,
          tIrrModelErrorDb: tfcModelErrorDb,
          tIrrReductionDb: tfcPreAnalysisLimiterEnabled ? -tfcPreAnalysisGainReductionDb : 0,
          tIrrTargetReductionDb: tfcPreAnalysisLimiterEnabled ? -tfcPreAnalysisTargetGainReductionDb : null
        });
        trimLinearHistoryBySeconds(tfcScopeHistory, levelScopeWindowSec, nowSec);
      }

      const renderTIrritationLimitDb = tfcPreAnalysisLimitDb;

      renderCanvas(bandValues, {
        supportDb,
        supportShortDb,
        tSupport04Db: renderTSupport04Db,
        tSupport3Db: renderTSupport3Db,
        tSupportAdaptDb: renderTSupportAdaptDb,
        tSupportNeedDb: renderTSupportNeedDb,
        tSupportModDb: renderTSupportModDb,
        tSupportCrestDb: renderTSupportCrestDb,
        tSupportIntegratedDb: renderTSupportIntegratedDb,
        tSupportLraDb: renderTSupportLraDb,
        tSupportLraP10Db: renderTSupportLraP10Db,
        tSupportLraP95Db: renderTSupportLraP95Db,
        tIrritation04Db: renderTIrritation04Db,
        tIrritation3Db: renderTIrritation3Db,
        tIrritationAdaptDb: renderTIrritationAdaptDb,
        tIrritationLimitDb: renderTIrritationLimitDb,
        tIrritationDryDb: renderDryTIrritation04Db,
        tIrritationWetDb: renderTIrritation04Db,
        tIrritationReductionDb: tfcPreAnalysisLimiterEnabled ? tfcPreAnalysisGainReductionDb : tfcIrrPreviewGainReductionDb,
        tIrritationErrorDb: Number.isFinite(renderDryTIrritation04Db) && Number.isFinite(tfcPreAnalysisLimitDb) ? renderDryTIrritation04Db - tfcPreAnalysisLimitDb : null,
        tIrritationExpectedReductionDb: Number.isFinite(renderDryTIrritation04Db) && Number.isFinite(tfcPreAnalysisLimitDb) ? clamp(softKneeReductionDb(renderDryTIrritation04Db - tfcPreAnalysisLimitDb), 0, 12) : null,
        tIrritationActualReductionDb: Number.isFinite(renderDryTIrritation04Db) && Number.isFinite(renderTIrritation04Db) ? Math.max(0, renderDryTIrritation04Db - renderTIrritation04Db) : null,
        tIrritationModelErrorDb: state.tfcModelErrorDb,
        levelerTargetDb: state.levelerTargetDb,
        levelerTargetFromP95Db: state.levelerTargetFromP95Db,
        levelerTargetFromLimitDb: state.levelerTargetFromLimitDb,
        levelerSlowEstimateDb: state.levelerSlowEstimateDb,
        deviceGainDb,
        tfcIrrLimitDb: tfcPreAnalysisLimitDb,
        tIrritationExcessDb: renderTIrritationExcessDb,
        tIrritationIntegratedDb: renderTIrritationIntegratedDb,
        tIrritationLraDb: renderTIrritationLraDb,
        tIrritationLraP10Db: renderTIrritationLraP10Db,
        tIrritationLraP95Db: renderTIrritationLraP95Db,
        listeningLevelDb,
        irritationDb,
        irritationShortDb,
        audioDb,
        audioShortDb,
        fullDb,
        fullShortDb,
        fullLongExposureDb,
        fullExposureDeltaDb,
        kWeightedDb,
        kWeightedShortDb,
        kWeightedLongExposureDb,
        kWeightedExposureDeltaDb,
        kAdaptiveDb,
        kAdaptiveDeltaDb,
        kAdaptiveLookAheadDb,
        kMinusFullShortDb,
        kMinusAudioShortDb,
        fullLraDb: renderProgramLraDb,
        fullP10Db: renderProgramP10Db,
        fullP95Db: renderProgramP95Db,
        fullRelativeGateDb: renderProgramRelativeGateDb,
        kRunningIntegratedDb: renderKIntegratedDb,
        kRunningIntegratedGateDb: renderKIntegratedGateDb,
        kRunningIntegratedStatus: renderKIntegratedStatus,
        kRunningIntegratedAcceptedCount: renderKIntegratedAcceptedCount,
        kRunningIntegratedTotalCount: renderKIntegratedTotalCount,
        kRunningIntegratedMinBlocks: renderKIntegratedMinBlocks,
        histogramBins,
        histogramMinDb,
        histogramMaxDb,
        histogramBinSizeDb,
        histogramGateOn: histogramGateEnabled,
        histogramGateActive,
        histogramGateFlash: nowMs < gateFlashUntilMs,
        histogramGateBlockRejectedNow: gateBlockRejectedNow,
        histogramAbsoluteGateDb: histogramGateEnabled && activeHistogramStats ? activeHistogramStats.absoluteThresholdDb : null,
        histogramRelativeGateDb: histogramGateEnabled && activeHistogramStats ? activeHistogramStats.relativeThresholdDb : null,
        levelScopeHistory: renderLevelScopeHistory,
        tfcScopeHistory: renderTfcScopeHistory,
        scopeMode,
        levelScopeWindowSec,
        scopeStartSec: renderScopeStartSec,
        peak04Db: renderPeak04Db,
        rms04Db: renderRms04Db,
        rms3Db: renderRms3Db,
        kWeightedMomentaryScopeDb: renderK04Db,
        kWeightedShortScopeDb: renderK3Db,
        kWeightedLongScopeDb: renderK30Db,
        kAdaptiveScopeDb: renderKAdaptiveDb,
        kAdaptiveLookAheadScopeDb: renderKAdaptiveLookAheadDb,
        rmsDbFs
      });

      updateFilePlaybackUI();

      if (activeInputMode === "file" && fileAnalysis.ready && nowMs - lastFileStatusUpdateMs > 500) {
        lastFileStatusUpdateMs = nowMs;
        const fileCursorSec = getFilePlaybackTimeSec();
        logStatus(
          [
            "FILE STATUS",
            `source: ${fileAnalysis.fileName}`,
            `playback: ${formatTimeSec(fileCursorSec)} / ${formatTimeSec(fileAnalysis.durationSec)}`,
            `scope view: ${fileScopeFollowPlayback ? "follow playback" : "manual scroll"} ${formatTimeSec(Math.max(0, fileScopeViewStartSec))}–${formatTimeSec(fileScopeFollowPlayback ? fileCursorSec : Math.min(fileAnalysis.durationSec, fileScopeViewStartSec + levelScopeWindowSec))}`,
            "",
            buildOfflineProgramStatusTable(),
            "",
            buildLiveCursorStatusTable(
              renderK04Db,
              renderK3Db,
              renderKAdaptiveDb,
              renderTSupport04Db,
              renderTSupport3Db,
              renderTSupportAdaptDb,
              renderTSupportNeedDb,
              renderTSupportModDb,
              renderTSupportCrestDb,
              renderTIrritation04Db,
              renderTIrritation3Db,
              renderTIrritationAdaptDb,
              renderTIrritationExcessDb
            ),
            "",
            "SEGMENT DETAILS (10 S)",
            formatSegmentSummaryLine("current", getCurrentFileSegmentIndex(fileCursorSec)),
            formatSegmentSummaryLine("loudest", fileAnalysis.loudestSegmentIndex),
            formatSegmentSummaryLine("quietest", fileAnalysis.quietestSegmentIndex),
            "",
            "NOTES",
            "Offline Program Summary is static. Live / Cursor Monitor follows playback or realtime input.",
            "Preview output uses -12 dB headroom plus Listening Level; pre-analysis TFC routes limiter before analyser when enabled.",
            "K estimates use the current app K-path; T Support/Irritation are experimental TUFS analyses."
          ].join("\n")
        );
      }

      if (activeInputMode === "file" && filePlaybackEnded && fileAnalysis.ready) {
        // EN: Stop refreshing after the file has ended. Offline Program/K/T data remains visible and stable.
        stopDrawLoop("audio file ended");
        appendStatus("\nAnalysis frozen at file end. Use Restart file or seek to continue.");
        return;
      } else if ((activeInputMode === "mic" || activeInputMode === "test") && nowMs - lastRealtimeStatusUpdateMs > 1000) {
        lastRealtimeStatusUpdateMs = nowMs;
        logStatus(
          [
            "REALTIME STATUS",
            `source: ${activeInputMode}`,
            "",
            buildKttStatusTable("RUNNING PROGRAM ESTIMATE", "K / LUFS", "T Sup", "T Irr", [
              {
                label: "Integrated",
                k: kRunningIntegratedStats.status === "ready" ? fmtStatusDb(kRunningIntegratedStats.integratedDb) : fmtStatusText(`warm ${kRunningIntegratedStats.totalBlockCount}/${kRunningIntegratedStats.minBlockCount}`),
                s: "--",
                i: "--"
              },
              { label: "Gate", k: fmtStatusDb(kRunningIntegratedStats.relativeThresholdDb), s: "--", i: "--" },
              { label: "Accepted", k: fmtAcceptedStatus(kRunningIntegratedStats.relativeAcceptedCount, kRunningIntegratedStats.totalBlockCount), s: "--", i: "--" },
              { label: "LRA", k: activeHistogramStats ? fmtStatusDb(activeHistogramStats.lraDb) : "--", s: "--", i: "--" }
            ]),
            "",
            buildLiveCursorStatusTable(
              kWeightedMomentaryScopeDb,
              kWeightedShortScopeDb,
              kAdaptiveDb,
              tSupport04Db,
              tSupport3Db,
              tSupportAdaptDb,
              tSupportNeedDb,
              tSupportModDb,
              tSupportCrestDb,
              tIrritation04Db,
              tIrritation3Db,
              tIrritationAdaptDb,
              tIrritationExcessDb
            ),
            "",
            "NOTES",
            "Realtime integrated K uses 400 ms K blocks and becomes valid after warm-up.",
            "T Support is analysis-only. T Irr can optionally drive a pre-analysis EQ limiter for testing."
          ].join("\n")
        );
      }
    }

    // ==============================
    // RENDERING LAYOUT
    // ==============================
    function renderCanvas(bandValues, meters) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      const outerLeft = 68;
      const outerRight = 20;
      const top = 20;
      const bottom = 86;
      const plotW = w - outerLeft - outerRight;
      const plotH = h - top - bottom;

      const dividerGap = 18;
      const derivedCount = 5;
      const derivedBarW = 62;
      const derivedGap = 16;
      const fullHistogramGap = 0;
      const fullHistogramW = derivedBarW;
      const scopeGap = 18;
      const scopeW = 280;
      const derivedSectionW = (derivedCount - 1) * (derivedBarW + derivedGap) + derivedBarW;
      const spectrumW = plotW - dividerGap - derivedSectionW - scopeGap - scopeW;

      const spectrumLeft = outerLeft;
      const spectrumRight = spectrumLeft + spectrumW;
      const derivedLeft = spectrumRight + dividerGap;
      const derivedRight = derivedLeft + derivedSectionW;
      const scopeLeft = derivedRight + scopeGap;

      drawGrid(spectrumLeft, top, plotW, plotH, displayMinDb, displayMaxDb);
      drawSpectrumBars(bandValues, spectrumLeft, top, spectrumW, plotH, displayMinDb, displayMaxDb);
      const programOverlayLeft = spectrumLeft + 12;
      const programOverlayRight = derivedLeft + 4 * (derivedBarW + derivedGap) - 12;
      drawProgramSummary(programOverlayLeft, top + 12, Math.max(560, programOverlayRight - programOverlayLeft), meters);

      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(spectrumRight + dividerGap / 2, top);
      ctx.lineTo(spectrumRight + dividerGap / 2, top + plotH);
      ctx.stroke();

      const derivedBars = [
        {
          label: "Support",
          color: "#66d9e8",
          stroke: "#c8f7ff",
          instantDb: meters.supportDb,
          shortDb: meters.supportShortDb,
          // EN: T Support adapt marker shows the tactile support context on the support bar.
          adaptDb: meters.tSupportAdaptDb,
          adaptLabel: "T adapt",
          bottom1: `3s ${meters.supportShortDb.toFixed(1)}`,
          bottom2: Number.isFinite(meters.tSupportAdaptDb) ? `T-adapt ${meters.tSupportAdaptDb.toFixed(1)}` : "T-adapt --"
        },
        {
          label: "Irrit.",
          color: "#ffb347",
          stroke: "#ffe2b5",
          instantDb: meters.irritationDb,
          shortDb: meters.irritationShortDb,
          // EN: T Irr adapt is the local context line; limit is the active reduction threshold.
          adaptDb: meters.tIrritationAdaptDb,
          adaptLabel: "I adapt",
          limitDb: meters.tIrritationLimitDb,
          limitLabel: "limit",
          // EN: Visualize the part of the dry irritation level that the limiter is currently catching.
          limiterInputDb: meters.tIrritationDryDb,
          limiterReductionDb: meters.tIrritationReductionDb,
          bottom1: `3s ${meters.irritationShortDb.toFixed(1)}`,
          bottom2: Number.isFinite(meters.tIrritationLimitDb) ? `limit ${meters.tIrritationLimitDb.toFixed(1)}` : "limit --"
        },
        {
          label: "Audio",
          color: "#777777",
          stroke: "#b0b0b0",
          instantDb: meters.audioDb,
          shortDb: meters.audioShortDb,
          bottom1: `3s ${meters.audioShortDb.toFixed(1)}`,
          bottom2: ""
        },
        {
          label: "Full",
          color: "#777777",
          stroke: "#b0b0b0",
          instantDb: meters.fullDb,
          shortDb: meters.fullShortDb,
          bottom1: `3s ${meters.fullShortDb.toFixed(1)}`,
          bottom2: `10s ${meters.fullLongExposureDb.toFixed(1)}`
        },
        {
          label: "K",
          color: "#66d9a8",
          stroke: "#c8ffe8",
          instantDb: meters.kWeightedDb,
          shortDb: meters.kWeightedShortDb,
          // EN: K adapt marker shows the auditory program context on the K bar.
          adaptDb: meters.kAdaptiveDb,
          adaptLabel: "K adapt",
          bottom1: `3s ${meters.kWeightedShortDb.toFixed(1)}`,
          bottom2: meters.kRunningIntegratedStatus === "ready"
            ? `K-int ${meters.kRunningIntegratedDb.toFixed(1)}`
            : `warm ${meters.kRunningIntegratedTotalCount}/${meters.kRunningIntegratedMinBlocks}`
        }
      ];

      for (let i = 0; i < derivedBars.length; i++) {
        const x = derivedLeft + i * (derivedBarW + derivedGap);
        const isKHistogramBar = derivedBars[i].label === "K";
        drawDerivedBar(
          x,
          top,
          derivedBarW,
          plotH,
          derivedBars[i],
          displayMinDb,
          displayMaxDb,
          isKHistogramBar ? {
            bins: meters.histogramBins,
            minDb: meters.histogramMinDb,
            maxDb: meters.histogramMaxDb,
            currentDb: meters.kWeightedShortDb,
            lraDb: meters.fullLraDb,
            p10Db: meters.fullP10Db,
            p95Db: meters.fullP95Db,
            absoluteGateDb: meters.histogramAbsoluteGateDb,
            relativeGateDb: meters.histogramRelativeGateDb,
            gateOn: meters.histogramGateOn,
            gateActive: meters.histogramGateActive,
            gateFlash: meters.histogramGateFlash,
            gateBlockRejectedNow: meters.histogramGateBlockRejectedNow,
            runningIntegratedDb: meters.kRunningIntegratedDb,
            runningIntegratedGateDb: meters.kRunningIntegratedGateDb,
            runningIntegratedStatus: meters.kRunningIntegratedStatus,
            runningIntegratedAcceptedCount: meters.kRunningIntegratedAcceptedCount,
            runningIntegratedTotalCount: meters.kRunningIntegratedTotalCount,
            runningIntegratedMinBlocks: meters.kRunningIntegratedMinBlocks,
            stripGap: fullHistogramGap,
            stripW: fullHistogramW
          } : null
        );
      }

      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(derivedRight + scopeGap / 2, top);
      ctx.lineTo(derivedRight + scopeGap / 2, top + plotH);
      ctx.stroke();

      drawLevelScope(scopeLeft, top, scopeW, plotH, meters, displayMinDb, displayMaxDb);

      ctx.fillStyle = "#ddd";
      ctx.font = "14px Arial";
      ctx.textAlign = "left";
      ctx.fillText(document.title, spectrumLeft, 15);
    }

    // ==============================
    // TIME SCOPE RENDERING
    // ==============================
    function drawLevelScope(left, top, width, height, meters, minDb, maxDb) {
      const history = Array.isArray(meters.levelScopeHistory) ? meters.levelScopeHistory : [];
      const windowSec = meters.levelScopeWindowSec || 20;
      const nowSec = history.length > 0 ? history[history.length - 1].t : performance.now() * 0.001;
      const startSec = Number.isFinite(meters.scopeStartSec) ? meters.scopeStartSec : nowSec - windowSec;
      const endSec = startSec + windowSec;

      ctx.save();
      ctx.fillStyle = "rgba(10, 10, 10, 0.32)";
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, width, height);

      // EN: Draw a 20 s scrolling scope using the same dB scale as the bars.
      // EN: Labels are intentionally kept at the bottom so the active mid/top curves stay readable.
      const drawCurve = (key, strokeStyle, lineWidth) => {
        ctx.beginPath();
        let started = false;
        for (const item of history) {
          const db = item[key];
          if (!isFinite(db)) continue;
          const x = left + clamp((item.t - startSec) / windowSec, 0, 1) * width;
          const y = top + (1 - clamp((db - minDb) / (maxDb - minDb), 0, 1)) * height;
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      };

      if (meters.scopeMode === "TFC") {
        const tfcHistory = Array.isArray(meters.tfcScopeHistory) ? meters.tfcScopeHistory : [];

        // EN: Absolute T Irritation levels stay on the same dB scale as the main bars.
        // EN: Error/reduction are dB differences, so they are drawn in a separate top strip above the text panel.
        const drawTfcLevelCurve = (key, strokeStyle, lineWidth) => {
          ctx.beginPath();
          let started = false;
          for (const item of tfcHistory) {
            const db = item[key];
            if (!isFinite(db)) continue;
            const x = left + clamp((item.t - startSec) / windowSec, 0, 1) * width;
            const y = top + (1 - clamp((db - minDb) / (maxDb - minDb), 0, 1)) * height;
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        };

        const fillTfcReductionArea = () => {
          const points = [];
          for (const item of tfcHistory) {
            if (!isFinite(item.tIrrDryDb) || !isFinite(item.tIrrWetDb)) continue;
            const x = left + clamp((item.t - startSec) / windowSec, 0, 1) * width;
            const dryY = top + (1 - clamp((item.tIrrDryDb - minDb) / (maxDb - minDb), 0, 1)) * height;
            const wetY = top + (1 - clamp((item.tIrrWetDb - minDb) / (maxDb - minDb), 0, 1)) * height;
            points.push({ x, dryY, wetY });
          }
          if (points.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].dryY);
          for (const point of points) ctx.lineTo(point.x, point.dryY);
          for (let i = points.length - 1; i >= 0; i--) ctx.lineTo(points[i].x, points[i].wetY);
          ctx.closePath();
          ctx.fillStyle = "rgba(255, 90, 90, 0.10)";
          ctx.fill();
        };

        const controlStripH = Math.min(64, Math.max(48, height * 0.22));
        // EN: Keep the control strip at the top so it does not sit under the bottom-right numeric legend.
        const controlTop = top + 10;
        const controlMinDb = 0;
        const controlMaxDb = 24;
        const controlToY = (db) => controlTop + (1 - clamp((db - controlMinDb) / (controlMaxDb - controlMinDb), 0, 1)) * controlStripH;

        const drawTfcControlCurve = (key, strokeStyle, lineWidth) => {
          ctx.beginPath();
          let started = false;
          for (const item of tfcHistory) {
            const db = item[key];
            if (!isFinite(db)) continue;
            const positiveDb = Math.max(0, db);
            const x = left + clamp((item.t - startSec) / windowSec, 0, 1) * width;
            const y = controlToY(positiveDb);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        };

        fillTfcReductionArea();
        drawTfcLevelCurve("tIrrWetDb", "rgba(120, 210, 255, 0.42)", 1.4);
        drawTfcLevelCurve("tIrrDryDb", "rgba(255, 179, 71, 0.98)", 2.6);
        drawTfcLevelCurve("tIrrLimitDb", "rgba(255, 90, 90, 0.98)", 2.2);

        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
        ctx.fillRect(left, controlTop, width, controlStripH);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
        ctx.lineWidth = 1.0;
        ctx.strokeRect(left, controlTop, width, controlStripH);
        ctx.setLineDash([4, 5]);
