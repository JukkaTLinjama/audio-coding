        ctx.strokeStyle = "rgba(255, 255, 255, 0.20)";
        ctx.beginPath();
        ctx.moveTo(left, controlToY(12));
        ctx.lineTo(left + width, controlToY(12));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.textAlign = "left";
        ctx.font = "11px Arial";
        ctx.fillStyle = "rgba(255, 255, 255, 0.62)";
        ctx.fillText("control 0–24 dB", left + 8, controlTop + 14);
        ctx.restore();

        drawTfcControlCurve("tIrrErrorDb", "rgba(255, 235, 59, 0.96)", 2.0);
        drawTfcControlCurve("tIrrExpectedReductionDb", "rgba(180, 180, 180, 0.70)", 1.3);
        drawTfcControlCurve("tIrrActualReductionDb", "rgba(255, 255, 255, 0.94)", 2.0);
      } else {
        drawCurve("peak04Db", "rgba(255, 255, 255, 1.00)", 2.0);
        drawCurve("rms3Db", "rgba(255, 210, 100, 0.96)", 2.2);
        drawCurve("kWeightedMomentaryScopeDb", "rgba(120, 210, 255, 0.86)", 1.6);
        drawCurve("kWeightedShortScopeDb", "rgba(102, 217, 168, 0.98)", 2.4);
        drawCurve("kWeightedLongScopeDb", "rgba(102, 217, 168, 0.42)", 1.4);
        drawCurve("kAdaptiveScopeDb", "rgba(255, 120, 220, 0.96)", 2.0);
        drawCurve("kAdaptiveLookAheadScopeDb", "rgba(255, 255, 255, 0.55)", 1.1);
      }

      const panelH = meters.scopeMode === "TFC" ? 230 : 132;
      const panelY = top + height - panelH - 8;
      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(left + 6, panelY, width - 12, panelH);

      const labelX = left + 14;
      const valueX = left + width - 14;
      let yText = panelY + 24;
      const rowStep = 19;

      ctx.textAlign = "left";
      ctx.font = "bold 16px Arial";
      ctx.fillStyle = "#ddd";
      ctx.fillText(`20 s scope: ${meters.scopeMode}`, labelX, yText);
      yText += 23;

      const drawMetricRow = (label, value, color) => {
        ctx.font = "14px Arial";
        ctx.textAlign = "left";
        ctx.fillStyle = color;
        ctx.fillText(label, labelX, yText);
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "right";
        ctx.fillText(Number.isFinite(value) ? value.toFixed(1) : "--", valueX, yText);
        yText += rowStep;
      };

      if (meters.scopeMode === "TFC") {
        drawMetricRow("T Irr dry", meters.tIrritationDryDb, "rgba(255, 179, 71, 0.98)");
        drawMetricRow("Limit", meters.tfcIrrLimitDb, "rgba(255, 90, 90, 0.98)");
        drawMetricRow("Error", meters.tIrritationErrorDb, "rgba(255, 235, 59, 0.96)");
        drawMetricRow("Exp red", meters.tIrritationExpectedReductionDb, "rgba(180, 180, 180, 0.82)");
        drawMetricRow("Act red", meters.tIrritationActualReductionDb, "rgba(255, 255, 255, 0.94)");
        drawMetricRow("Model err", meters.tIrritationModelErrorDb, "rgba(210, 160, 255, 0.78)");
        drawMetricRow("Lvl p95 tgt", meters.levelerTargetFromP95Db, "rgba(102, 217, 168, 0.72)");
        drawMetricRow("Lvl lim tgt", meters.levelerTargetFromLimitDb, "rgba(102, 217, 168, 0.92)");
        drawMetricRow("Lvl slow", meters.levelerSlowEstimateDb, "rgba(102, 217, 168, 0.52)");
      } else {
        drawMetricRow("Peak 0.4s", meters.peak04Db, "rgba(255, 255, 255, 0.90)");
        drawMetricRow("RMS 3s", meters.rms3Db, "rgba(255, 210, 100, 0.96)");
        drawMetricRow("K 0.4s", meters.kWeightedMomentaryScopeDb, "rgba(120, 210, 255, 0.86)");
        drawMetricRow("K 3s", meters.kWeightedShortScopeDb, "rgba(102, 217, 168, 0.98)");
        drawMetricRow("K adapt", meters.kAdaptiveScopeDb, "rgba(255, 120, 220, 0.96)");
      }

      ctx.textAlign = "right";
      ctx.fillStyle = "#aaa";
      ctx.font = "12px Arial";
      if (Number.isFinite(meters.scopeStartSec)) {
        ctx.textAlign = "left";
        ctx.fillText(formatTimeSec(startSec), left, top + height + 20);
        ctx.textAlign = "right";
        ctx.fillText(formatTimeSec(endSec), left + width, top + height + 20);
      } else {
        ctx.fillText("-20 s", left + 42, top + height + 20);
        ctx.fillText("now", left + width, top + height + 20);
      }

      ctx.restore();
    }

    function drawProgramSummary(left, top, width, meters, layout = null) {
      if (width < 520) return;

      // EN: Integrated program-level values only. No live limiter details are shown here.
      // EN: The three columns follow the main bar order: Support, Irritation, K loudness.
      const panelH = 126;
      ctx.save();
      // EN: Keep the program text directly over the spectrum so it does not hide spectral bars.
      // EN: Text shadow preserves readability without an opaque panel background.
      ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;

      const rowTitle = top + 30;
      const rowSub = top + 60;
      const rowValue = top + 91;
      const rowLra = top + 116;

      const drawColumn = (x, colW, title, subTitle, value1, value2, color) => {
        ctx.textAlign = "left";
        ctx.font = "bold 23px Arial";
        ctx.fillStyle = color;
        ctx.fillText(title, x, rowTitle, colW - 8);
        ctx.font = "18px Arial";
        ctx.fillText(subTitle, x, rowSub, colW - 8);
        ctx.font = "bold 25px Arial";
        ctx.fillText(value1, x, rowValue, colW - 8);
        ctx.font = "22px Arial";
        ctx.fillText(value2, x, rowLra, colW - 8);
      };

      const supportP95Text = Number.isFinite(meters.tSupportLraP95Db)
        ? `p95 ${meters.tSupportLraP95Db.toFixed(1)}`
        : "p95 --";
      const supportLraText = Number.isFinite(meters.tSupportLraDb)
        ? `LRA ${meters.tSupportLraDb.toFixed(1)}`
        : "LRA --";
      const irritationP95Text = Number.isFinite(meters.tIrritationLraP95Db)
        ? `p95 ${meters.tIrritationLraP95Db.toFixed(1)}`
        : "p95 --";
      const irritationLraText = Number.isFinite(meters.tIrritationLraDb)
        ? `LRA ${meters.tIrritationLraDb.toFixed(1)}`
        : "LRA --";
      const kText = meters.kRunningIntegratedStatus === "ready" && Number.isFinite(meters.kRunningIntegratedDb)
        ? `K-I ${meters.kRunningIntegratedDb.toFixed(1)}`
        : `K warm ${meters.kRunningIntegratedTotalCount}/${meters.kRunningIntegratedMinBlocks}`;
      const kLraText = Number.isFinite(meters.fullLraDb)
        ? `LRA ${meters.fullLraDb.toFixed(1)}`
        : "LRA --";

      const gap = 34;
      const colW = (width - 24 - gap * 2) / 3;
      const x1 = left + 12;
      const x2 = x1 + colW + gap;
      const x3 = x2 + colW + gap;

      drawColumn(x1, colW, "Integrated tactile", "Support", supportP95Text, supportLraText, "#66d9e8");
      drawColumn(x2, colW, "Integrated tactile", "Irritation", irritationP95Text, irritationLraText, "#ffb347");
      drawColumn(x3, colW, "Integrated loudness", "K / LUFS", kText, kLraText, "#66d9a8");

      ctx.restore();
    }

    // ==============================
    // BAR / GRID / HISTOGRAM RENDERING
    // ==============================
    function drawGrid(left, top, plotW, plotH, minDb, maxDb) {
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      const ticks = buildTicksForRange(minDb, maxDb);

      for (const db of ticks) {
        const norm = clamp((db - minDb) / (maxDb - minDb), 0, 1);
        const y = top + (1 - norm) * plotH;

        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + plotW, y);
        ctx.stroke();

        ctx.fillStyle = "#b3b3b3";
        ctx.font = "14px Arial";
        ctx.textAlign = "right";
        ctx.fillText(`${db.toFixed(0)}`, left - 8, y + 4);
      }

      ctx.strokeStyle = "#666";
      ctx.strokeRect(left, top, plotW, plotH);
    }

    function drawSpectrumBars(bandValues, left, top, plotW, plotH, minDb, maxDb) {
      const barGap = 4;
      const barWidth = (plotW - barGap * (bandValues.length - 1)) / bandValues.length;

      for (let i = 0; i < bandValues.length; i++) {
        const band = bandValues[i];
        const x = left + i * (barWidth + barGap);

        const norm = clamp((band.dbCal - minDb) / (maxDb - minDb), 0, 1);
        const barHeight = norm * plotH;
        const y = top + (plotH - barHeight);

        const isSupportBand = band.centerFreq >= 20 && band.centerFreq <= 63;
        const isIrritationBand = band.centerFreq === 80 || band.centerFreq === 100;
        const isAudioBand = band.centerFreq >= 125;

        ctx.save();
        ctx.globalAlpha = 0.38;
        ctx.fillStyle = isSupportBand ? "#66d9e8" : (isIrritationBand ? "#ffb347" : (isAudioBand ? "#777777" : "#777777"));
        ctx.fillRect(x, y, barWidth, barHeight);
        ctx.restore();

        ctx.strokeStyle = isSupportBand ? "#c8f7ff" : (isIrritationBand ? "#ffe2b5" : (isAudioBand ? "#b0b0b0" : "#b0b0b0"));
        ctx.strokeRect(x, y, barWidth, barHeight);

        ctx.save();
        ctx.fillStyle = "#ddd";
        ctx.font = "13px Arial";
        ctx.textAlign = "center";
        ctx.translate(x + barWidth / 2, top + plotH + 22);
        ctx.rotate(-Math.PI / 4);
        ctx.fillText(formatFreqLabel(band.centerFreq), 0, 0);
        ctx.restore();
      }
    }

    function drawDerivedBar(x, top, width, plotH, meter, minDb, maxDb, histogramStrip = null) {
      const instantNorm = clamp((meter.instantDb - minDb) / (maxDb - minDb), 0, 1);
      const instantHeight = instantNorm * plotH;
      const y = top + (plotH - instantHeight);

      ctx.save();
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = meter.color;
      ctx.fillRect(x, y, width, instantHeight);
      ctx.restore();

      ctx.strokeStyle = meter.stroke;
      ctx.strokeRect(x, y, width, instantHeight);

      if (Number.isFinite(meter.limitDb) && Number.isFinite(meter.limiterInputDb) && Number.isFinite(meter.limiterReductionDb) && meter.limiterReductionDb > 0.05) {
        // EN: Red overlay shows the dry irritation region above the active limit.
        // EN: This is a diagnostic view of what the limiter is catching, not an extra gain stage.
        const limitNorm = clamp((meter.limitDb - minDb) / (maxDb - minDb), 0, 1);
        const inputNorm = clamp((meter.limiterInputDb - minDb) / (maxDb - minDb), 0, 1);
        const yLimit = top + (1 - limitNorm) * plotH;
        const yInput = top + (1 - inputNorm) * plotH;
        const zoneTop = Math.min(yLimit, yInput);
        const zoneBottom = Math.max(yLimit, yInput);
        const zoneHeight = Math.max(2, zoneBottom - zoneTop);

        ctx.save();
        ctx.fillStyle = "rgba(255, 40, 40, 0.30)";
        ctx.fillRect(x + 5, zoneTop, width - 10, zoneHeight);
        ctx.strokeStyle = "rgba(255, 90, 90, 0.95)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 5, zoneTop, width - 10, zoneHeight);
        ctx.fillStyle = "#ffb3b3";
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`${meter.limiterReductionDb.toFixed(1)} dB`, x + width / 2, Math.max(top + 12, zoneTop - 4));
        ctx.restore();
      }

      const shortNorm = clamp((meter.shortDb - minDb) / (maxDb - minDb), 0, 1);
      const yShort = top + (1 - shortNorm) * plotH;

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 3, yShort);
      ctx.lineTo(x + width - 3, yShort);
      ctx.stroke();

      // EN: Show the 3 s value just above the white marker line.
      ctx.fillStyle = meter.stroke;
      ctx.font = "13px Arial";
      ctx.textAlign = "center";
      ctx.fillText(`${meter.shortDb.toFixed(1)}`, x + width / 2, Math.max(top + 10, yShort - 6));

      const drawAdaptMarker = () => {
        if (!Number.isFinite(meter.adaptDb)) return;

        // EN: Adapt marker is a context line, separate from the white 3 s marker.
        // EN: Draw it after the optional histogram strip so K adapt remains visible on the K bar.
        const adaptNorm = clamp((meter.adaptDb - minDb) / (maxDb - minDb), 0, 1);
        const yAdapt = top + (1 - adaptNorm) * plotH;

        ctx.strokeStyle = meter.stroke;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(x + 4, yAdapt);
        ctx.lineTo(x + width - 4, yAdapt);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = meter.stroke;
        ctx.font = "11px Arial";
        ctx.textAlign = "center";
        ctx.fillText("adapt", x + width / 2, Math.min(top + plotH - 6, Math.max(top + 12, yAdapt + 13)));
      };

      const drawLimitMarker = () => {
        if (!Number.isFinite(meter.limitDb)) return;

        // EN: Limit marker is the active TFC threshold that drives gain reduction.
        // EN: It is drawn separately from adapt because adapt is context, while limit is control.
        const limitNorm = clamp((meter.limitDb - minDb) / (maxDb - minDb), 0, 1);
        const yLimit = top + (1 - limitNorm) * plotH;

        ctx.strokeStyle = "#ff3333";
        ctx.lineWidth = 2;
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(x + 4, yLimit);
        ctx.lineTo(x + width - 4, yLimit);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = "#ff9999";
        ctx.font = "11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(meter.limitLabel || "limit", x + width / 2, Math.min(top + plotH - 6, Math.max(top + 12, yLimit - 5)));
      };

      if (histogramStrip && Array.isArray(histogramStrip.bins) && histogramStrip.bins.length > 0) {
        drawVerticalHistogramStrip(
          x + histogramStrip.stripGap,
          top,
          histogramStrip.stripW,
          plotH,
          histogramStrip.bins,
          histogramStrip.minDb,
          histogramStrip.maxDb,
          histogramStrip.currentDb,
          histogramStrip.lraDb,
          histogramStrip.p10Db,
          histogramStrip.p95Db,
          histogramStrip.absoluteGateDb,
          histogramStrip.relativeGateDb,
          histogramStrip.gateOn,
          histogramStrip.gateActive,
          histogramStrip.gateFlash,
          histogramStrip.gateBlockRejectedNow,
          histogramStrip.runningIntegratedDb,
          histogramStrip.runningIntegratedGateDb,
          histogramStrip.runningIntegratedStatus,
          histogramStrip.runningIntegratedAcceptedCount,
          histogramStrip.runningIntegratedTotalCount,
          histogramStrip.runningIntegratedMinBlocks
        );
      }

      drawAdaptMarker();
      drawLimitMarker();

      ctx.fillStyle = "#fff";
      ctx.font = "15px Arial";
      ctx.fillText(meter.label, x + width / 2, top + plotH + 20);

      ctx.fillStyle = "#aaa";
      ctx.font = "13px Arial";
      ctx.fillText(meter.bottom1, x + width / 2, top + plotH + 40);
      if (meter.bottom2) {
        ctx.fillText(meter.bottom2, x + width / 2, top + plotH + 58);
      }
    }


    function getHistogramInfoLayout(left, top, width, canvasWidth) {
      // EN: Larger text panel for the compact histogram/LRA area.
      // EN: The right edge is anchored to the histogram strip so the panel stays inside the canvas.
      const margin = 8;
      const panelWidth = 250;
      const right = Math.min(canvasWidth - margin, left + width);
      const x = Math.max(margin, right - panelWidth);

      return {
        x,
        right,
        panelWidth: right - x,
        labelX: x + 10,
        valueX: right - 10,
        row1Y: top + 24,
        row2Y: top + 50,
        row3Y: top + 72,
        row4Y: top + 96,
        row5Y: top + 120
      };
    }

    function drawVerticalHistogramStrip(left, top, width, height, bins, minDb, maxDb, currentDb, lraDb, p10Db, p95Db, absoluteGateDb, relativeGateDb, gateOn, gateActive, gateFlash, gateBlockRejectedNow, runningIntegratedDb = null, runningIntegratedGateDb = null, runningIntegratedStatus = "warming up", runningIntegratedAcceptedCount = 0, runningIntegratedTotalCount = 0, runningIntegratedMinBlocks = 0) {
      // EN: Draw a compact vertical histogram strip using the same dB scale as the Full meter.
      // EN: Only flash on actual rejection; no persistent active-state shading.
      ctx.fillStyle = gateFlash ? "rgba(80, 0, 0, 0.45)" : "rgba(5, 5, 5, 0.18)";
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, width, height);

      const maxBin = Math.max(1, ...bins);
      // EN: bins[] is ordered from low dB to high dB.
      // EN: Draw from bottom to top so the histogram matches the vertical dB axis.
      for (let i = 0; i < bins.length; i++) {
        const binValue = bins[i];
        const drawIndex = bins.length - 1 - i;
        const y0 = top + (drawIndex / bins.length) * height;
        const y1 = top + ((drawIndex + 1) / bins.length) * height;
        const barH = Math.max(1, y1 - y0 - 1);
        const spikeW = Math.max(1, (binValue / maxBin) * (width - 2));

        ctx.fillStyle = gateFlash ? "rgba(255, 51, 51, 0.85)" : (gateOn ? "rgba(230, 230, 230, 0.55)" : "rgba(109, 140, 255, 0.55)");
        ctx.fillRect(left + 1, y0 + 0.5, spikeW, barH);
      }

      const tickStep = 10;
      ctx.strokeStyle = "#3f3f3f";
      ctx.lineWidth = 1;
      for (let db = Math.ceil(minDb / tickStep) * tickStep; db <= maxDb; db += tickStep) {
        const yTick = top + (1 - (db - minDb) / (maxDb - minDb)) * height;
        ctx.beginPath();
        ctx.moveTo(left, yTick);
        ctx.lineTo(left + width, yTick);
        ctx.stroke();
      }

      if (Number.isFinite(absoluteGateDb)) {
        const yAbsoluteGate = top + (1 - (clamp(absoluteGateDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#666";
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(left, yAbsoluteGate);
        ctx.lineTo(left + width, yAbsoluteGate);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (Number.isFinite(relativeGateDb)) {
        const yRelativeGate = top + (1 - (clamp(relativeGateDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = gateActive ? "#ff9999" : "#999";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(left, yRelativeGate);
        ctx.lineTo(left + width, yRelativeGate);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (Number.isFinite(p10Db)) {
        const yP10 = top + (1 - (clamp(p10Db, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yP10);
        ctx.lineTo(left + width, yP10);
        ctx.stroke();
      }

      if (Number.isFinite(p95Db)) {
        const yP95 = top + (1 - (clamp(p95Db, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#06d6a0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yP95);
        ctx.lineTo(left + width, yP95);
        ctx.stroke();
      }

      if (Number.isFinite(currentDb)) {
        const yCurrent = top + (1 - (clamp(currentDb, minDb, maxDb) - minDb) / (maxDb - minDb)) * height;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left, yCurrent);
        ctx.lineTo(left + width, yCurrent);
        ctx.stroke();
      }

      const historySec = kWeightedShortTermRawHistory.length / loudnessUpdateHz;

      // EN: Main LRA and K-integrated text is drawn in drawProgramSummary() above the spectrum.
      // EN: Keep the histogram strip mostly graphical so it does not cover the derived bars.
      ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;
      ctx.textAlign = "center";
      ctx.font = "bold 13px Arial";
      ctx.fillStyle = gateFlash ? "#ff3333" : "#ddd";
      ctx.fillText(gateFlash ? "REJECT" : `${historySec.toFixed(0)} s`, left + width / 2, top + 23);
      ctx.font = "12px Arial";
      ctx.fillStyle = "#aaa";
      ctx.fillText(Number.isFinite(lraDb) ? `LRA ${lraDb.toFixed(1)}` : "LRA --", left + width / 2, top + 42);
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    }


    function buildTicksForRange(minDb, maxDb) {
      const ticks = [];
      const step = 10;
      const start = Math.ceil(minDb / step) * step;

      for (let db = start; db <= maxDb; db += step) {
        ticks.push(db);
      }

      if (!ticks.includes(minDb)) ticks.unshift(minDb);
      if (!ticks.includes(maxDb)) ticks.push(maxDb);
      return ticks;
    }

    function buildIdleBandValues() {
      // EN: Static preview data for the initial screen. This is not measurement data.
      const demoDbByFreq = new Map([
        [20, -52], [25, -50], [31.5, -48], [40, -45], [50, -42], [63, -39],
        [80, -34], [100, -36], [125, -42], [160, -47], [200, -50], [250, -48],
        [315, -46], [400, -49], [500, -52], [630, -54], [800, -56], [1000, -58]
      ]);
      return thirdOctaveCenters.map(centerFreq => {
        const low = centerFreq / Math.pow(2, 1 / 6);
        const high = centerFreq * Math.pow(2, 1 / 6);
        const dbRaw = demoDbByFreq.has(centerFreq) ? demoDbByFreq.get(centerFreq) : -60;
        const linear = dbToLinearEnergy(dbRaw);
        return { centerFreq, low, high, binCount: 1, dbRaw, dbCal: dbRaw, linear, linearRaw: linear };
      });
    }

    function buildIdleMeters() {
      // EN: Idle meters make the UI readable before the first user gesture starts Web Audio.
      // EN: Values are intentionally null/preview-like and must not be interpreted as analysis results.
      return {
        supportDb: -42,
        supportShortDb: -42,
        tSupport04Db: -42,
        tSupport3Db: -42,
        tSupportAdaptDb: -41,
        tSupportNeedDb: 0,
        tSupportModDb: 0,
        tSupportCrestDb: 0,
        tSupportIntegratedDb: null,
        tSupportLraDb: null,
        tSupportLraP10Db: null,
        tSupportLraP95Db: null,
        tIrritation04Db: -35,
        tIrritation3Db: -35,
        tIrritationAdaptDb: -34,
        tIrritationLimitDb: null,
        tIrritationDryDb: null,
        tIrritationWetDb: null,
        tIrritationReductionDb: 0,
        tIrritationErrorDb: null,
        tIrritationExpectedReductionDb: null,
        tIrritationActualReductionDb: null,
        tIrritationModelErrorDb: null,
        levelerTargetDb: null,
        levelerTargetFromP95Db: null,
        levelerTargetFromLimitDb: null,
        levelerSlowEstimateDb: null,
        deviceGainDb,
        tfcIrrLimitDb: null,
        tIrritationExcessDb: 0,
        tIrritationIntegratedDb: null,
        tIrritationLraDb: null,
        tIrritationLraP10Db: null,
        tIrritationLraP95Db: null,
        listeningLevelDb,
        irritationDb: -35,
        irritationShortDb: -35,
        audioDb: -48,
        audioShortDb: -48,
        fullDb: -38,
        fullShortDb: -38,
        fullLongExposureDb: -38,
        fullExposureDeltaDb: 0,
        kWeightedDb: -40,
        kWeightedShortDb: -40,
        kWeightedLongExposureDb: -40,
        kWeightedExposureDeltaDb: 0,
        kAdaptiveDb: -39,
        kAdaptiveDeltaDb: 0,
        kAdaptiveLookAheadDb: -39,
        kMinusFullShortDb: 0,
        kMinusAudioShortDb: 0,
        fullLraDb: null,
        fullP10Db: null,
        fullP95Db: null,
        fullRelativeGateDb: null,
        kRunningIntegratedDb: null,
        kRunningIntegratedGateDb: null,
        kRunningIntegratedStatus: "idle",
        kRunningIntegratedAcceptedCount: 0,
        kRunningIntegratedTotalCount: 0,
        kRunningIntegratedMinBlocks: realtimeIntegratedMinBlocks,
        histogramBins: buildHistogramFromValues([], histogramMinDb, histogramMaxDb, histogramBinSizeDb),
        histogramMinDb,
        histogramMaxDb,
        histogramBinSizeDb,
        histogramGateOn: histogramGateEnabled,
        histogramGateActive: false,
        histogramGateFlash: false,
        histogramGateBlockRejectedNow: false,
        histogramAbsoluteGateDb: null,
        histogramRelativeGateDb: null,
        levelScopeHistory: [],
        levelScopeWindowSec,
        scopeStartSec: null,
        scopeMode,
        peak04Db: null,
        rms04Db: null,
        rms3Db: null,
        kWeightedMomentaryScopeDb: null,
        kWeightedShortScopeDb: null,
        kWeightedLongScopeDb: null,
        kAdaptiveScopeDb: null,
        kAdaptiveLookAheadScopeDb: null,
        rmsDbFs: null
      };
    }

    function renderIdleScreen() {
      renderCanvas(buildIdleBandValues(), buildIdleMeters());
      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(430, 390, 540, 72);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
      ctx.strokeRect(430, 390, 540, 72);
      ctx.textAlign = "center";
      ctx.font = "bold 25px Arial";
      ctx.fillStyle = "#ddd";
      ctx.fillText("Ready — press Play test signal or load an audio file", 700, 421);
      ctx.font = "18px Arial";
      ctx.fillStyle = "#aaa";
      ctx.fillText("Preview display only; Web Audio starts after a user action.", 700, 446);
      ctx.restore();
      logStatus("Ready. Press Play test signal, Start microphone, or Select file. The preview screen is not measured audio.");
    }

    renderIdleScreen();

    function formatFreqLabel(freq) {
      if (freq >= 1000) {
        const k = freq / 1000;
        return Number.isInteger(k) ? `${k}k` : `${k.toFixed(1)}k`;
      }
      return `${freq}`;
    }
  </script>
