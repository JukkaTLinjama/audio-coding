<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Vibro L/R Beat Keyboard v2.9</title>
    <style>
        :root {
            --gap: 10px;
            --white-h: 110px;
            --black-h: 70px;
            --white-w: 1fr;
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #fafafa;
            color: #111;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            font-weight: 650;
        }

        .row {
            margin: 12px 0;
        }

        .controls {
            display: grid;
            gap: 10px;
            padding: 12px;
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
        }

        .control {
            display: grid;
            grid-template-columns: 160px 1fr auto;
            align-items: center;
            gap: 10px;
        }

        .control label {
            font-size: 14px;
            opacity: 0.9;
        }

        .control input[type="range"] {
            width: 100%;
        }

        .control select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #d0d0d0;
            background: #fff;
            font-size: 14px;
        }
        /* EN: Nested sub-controls (indentation under the main label). */
        .panSub {
        margin-left: 20px;
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        }

        .val {
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            opacity: 0.85;
            min-width: 70px;
            text-align: right;
        }

        .btns {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-bottom-width: 3px;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
        }

        button:active {
            transform: translateY(1px);
            border-bottom-width: 2px;
        }

        /* --- Loop status badge --- */
        .status {
            align-self: center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #d0d0d0;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            user-select: none;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .status.idle { background: #f6f6f6; color: #333; }
        .status.rec  { background: #ffe9e9; color: #8a0000; border-color: #f2b3b3; animation: pulse 1s infinite; }
        .status.loop { background: #e9f2ff; color: #003a8a; border-color: #b3ccf2; }

        /* --- Disabled control (mode-dependent) --- */
        .control.disabled {
            opacity: 0.35;
        }
        .control.disabled input,
        .control.disabled select {
            pointer-events: none;
        }


        /* --- Piano keyboard --- */
        .kbdWrap {
            margin-top: 14px;
            padding: 14px;
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .kbdTitle {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: baseline;
            margin-bottom: 10px;
            font-size: 13px;
            opacity: 0.85;
        }

        .piano {                    /* 8 white keys => A0..A1 inclusive */
            position: relative;
            width: 100%;
            height: var(--white-h);
            display: grid;       
            grid-template-columns: repeat(8, var(--white-w)); /* A B C D E F G A */
            gap: 0;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            background: #f2f2f2;
            overflow: hidden;
        }

        .whiteKey {
            position: relative;
            border-right: 1px solid #ddd;
            background: linear-gradient(#ffffff, #f1f1f1);
            height: var(--white-h);
            padding: 0;
            margin: 0;
            border-radius: 0;
            border-left: none;
            border-top: none;
            border-bottom: none;
            border-right: 1px solid #ddd;
            touch-action: none;
        }

        .whiteKey:last-child {
            border-right: none;
        }

        .whiteKey.active {
            background: linear-gradient(#f1f1f1, #e6e6e6);
        }

        .whiteKey .footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 8px;              /* keep inside the key so it won't be clipped */
            text-align: center;
            font-size: 11px;
            opacity: 0.85;
            pointer-events: none;
            line-height: 1.05;
        }
        .whiteKey .footer .hz {
            display: block;
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .whiteKey .hz {
            display: block;
            font-variant-numeric: tabular-nums;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .blackKey {
            position: absolute;
            top: 0;
            width: calc(100% / 8 * 0.4);
            height: var(--black-h);
            background: linear-gradient(#3a3a3a, #111);
            border: 1px solid #000;
            border-top: none;
            border-radius: 0 0 10px 10px;
            z-index: 10;
            padding: 0;
            touch-action: none;
        }

        .blackKey.active {
            background: linear-gradient(#2a2a2a, #000);
        }

        .blackKey .label {
            position: absolute;
            left: 6px;
            top: 6px;            /* ennen: bottom */
            bottom: auto;
            color: #fff;
            font-size: 10px;
            opacity: 0.9;
            line-height: 1.1;
        }

        .blackKey .hz {
            display: block;
            font-variant-numeric: tabular-nums;
            font-size: 10px;
            opacity: 0.75;
            margin-top: 3px;
        }
    
        .tiny { font-size: 12px; opacity: 0.9; }
        .hint { font-size: 12px; opacity: 0.75; margin-top: 6px; }
</style>
</head>

<body>
    <h1>Vibro L/R Beat Keyboard v2.9 ------ </h1>

    <div class="row controls">
        <div class="btns">
            <button id="startBtn" type="button">Rec loop</button>
            <button id="playBtn" type="button">Play loop</button>
                <button id="storeBtn" type="button">Store loop</button>
            <button id="wavBtn" type="button">Render WAV</button>
            <span id="loopStatus" class="status idle" aria-live="polite">IDLE</span>
        </div>

        <div class="control">
            <label for="masterVol">Master Volume (0–1.0)</label>
            <input id="masterVol" type="range" min="0" max="1" step="0.05" value="0.5" />
            <span class="val" id="masterVal"></span>
        </div>

    <div class="control">
        <label>Pan LFO</label>
    
        <div class="panSub">
            <div class="row">
                <label class="tiny"><input id="panEnabled" type="checkbox" /> Enable</label>
                <span class="val" id="panRateVal">rate: 0.00 Hz</span>
            </div>
    
            <div class="row">
                <label class="tiny" for="panDepth">Depth</label>
                <input id="panDepth" type="range" min="0" max="1" step="0.01" value="0" />
                <span class="val" id="panDepthVal">0.00</span>
            </div>
    
            <div class="row">
                <label class="tiny" for="panPhaseDeg">Phase</label>
                <input id="panPhaseDeg" type="range" min="0" max="360" step="1" value="0" />
                <span class="val" id="panPhaseVal">0°</span>
            </div>
    
            <div class="hint">Pan rate follows beat/2.</div>
        </div>
    </div>

        <div class="control">
            <label for="beatHz">L/R Beat Δf (Hz) — split ±Δf/2</label>
            <input id="beatHz" type="range" min="0" max="5" step="0.1" value="0.5" />
            <span class="val" id="beatVal"></span>
        </div>

        <div class="control">
            <label for="lrMode">L/R Mode</label>
            <select id="lrMode">
                <option value="beat" selected>Beat (Δf)</option>
                <option value="phase">Phase (deg)</option>
            </select>
            <span class="val" id="modeVal"></span>
        </div>
        
        <div class="control">
            <label for="phaseDeg">L/R Phase Offset (deg)</label>
            <input id="phaseDeg" type="range" min="0" max="360" step="1" value="0" />
            <span class="val" id="phaseVal"></span>
        </div>

        <div class="control">
            <label for="glideS">Glide (s)</label>
            <input id="glideS" type="range" min="0" max="5" step="0.05" value="0.2" />
            <span class="val" id="glideVal"></span>
        </div>
    </div>

    <div class="row kbdWrap">
        <div class="kbdTitle">
        <div><strong>Range:</strong> A0–A1 (13 keys, + accidentals)</div>
        <div><strong>Sound:</strong> sine L/R, fL = f − Δf/2, fR = f + Δf/2</div>
        </div>

        <div id="piano" class="piano" aria-label="Virtual piano keyboard"></div>

        <div class="hint">
            Touch/hold a key to play. Slide to another key for glides. Output is intentionally low-frequency; keep
            volume conservative.
        </div>
    </div>

    <script src="./js/sineGenerator.js"></script>

    <script>
        // EN: Realtime recording (captures the master bus as a blob via MediaRecorder).
        let recDest = null;
        let mediaRecorder = null;
        let recChunks = [];
        let isStoring = false;
// ---------- Audio state ----------
        let ctx, oscL, oscR, gainL, gainR, delayR, merger, masterGain, gateGain;
        let gen = null; // EN: Current source generator instance (live AudioContext).
        let panSplitter, panGainL, panGainR, panMerger;
        let panAnimId = null; // EN: requestAnimationFrame id for pan LFO loop

        const state = {
            running: false,

            // L/R relationship mode:
            // - "beat": fR = fL + beatHz
            // - "phase": fR = fL, and Right channel gets a time delay that corresponds to phaseDeg at baseHz
            lrMode: "beat",

            beatHz: 0.5,     // Hz offset used only in "beat" mode
            phaseDeg: 0,      // degrees used only in "phase" mode

            glideS: 0.2,       // seconds for frequency glides (portamento)
            masterVol: 0.5,
            panEnabled: false,
            panDepth: 0.0,
            panPhaseDeg: 0,
            baseHz: 27.5
        };

        function now() { return ctx.currentTime; }

        function setParamSmooth(param, target, glideS) {
            const t0 = now();
            param.cancelScheduledValues(t0);
            param.setValueAtTime(param.value, t0);
            param.linearRampToValueAtTime(target, t0 + Math.max(0, glideS));
        }

        /**
         * L/R beat control:
         * fL = baseHz
         * fR = baseHz + beatHz
         * Keeping the inter-channel offset constant (Hz) preserves the beat period during glides.
         */
        function updateFrequencies(glide = true) {
            // EN: Delegate pitch/phase updates to the current generator.
            if (!gen) return;
            gen.update(glide);
        }

        function updateMasterVolume() {
            if (!masterGain) return;
            masterGain.gain.setValueAtTime(state.masterVol, now());
        }

        // ---------- Pan LFO (rate = beatHz / 2) ----------
        function getPanRateHz() {
            // EN: Follow beat frequency at half-rate (beat/2). Use absolute value to avoid negatives.
            return Math.max(0, Math.abs(Number(state.beatHz)) * 0.5);
        }

        function stopPanLFO() {
            if (panAnimId !== null) {
                cancelAnimationFrame(panAnimId);
                panAnimId = null;
            }
            // EN: Return to centered pan.
            if (panGainL && panGainR) {
                const t = now();
                panGainL.gain.setTargetAtTime(0.5, t, 0.02);
                panGainR.gain.setTargetAtTime(0.5, t, 0.02);
            }
        }

        function startPanLFO() {
            // EN: Lightweight UI-rate LFO that updates stereo gains (suitable for low-frequency autopan).
            stopPanLFO();
            if (!state.running) return;
            if (!state.panEnabled) return;
            if (!panGainL || !panGainR) return;

            const tick = () => {
                if (!state.running || !state.panEnabled) {
                    stopPanLFO();
                    return;
                }

                const rate = getPanRateHz();
                const depth = Math.max(0, Math.min(1, Number(state.panDepth) || 0));
                const t = now();

                if (rate <= 0 || depth <= 0) {
                    panGainL.gain.setTargetAtTime(0.5, t, 0.05);
                    panGainR.gain.setTargetAtTime(0.5, t, 0.05);
                } else {
                    const phaseRad = (Number(state.panPhaseDeg) || 0) * Math.PI / 180;
                    const pan = depth * Math.sin(2 * Math.PI * rate * t + phaseRad);

                    // EN: Gains stay in 0..1 for depth 0..1.
                    const gL = 0.5 * (1 + pan);
                    const gR = 0.5 * (1 - pan);

                    panGainL.gain.setTargetAtTime(gL, t, 0.02);
                    panGainR.gain.setTargetAtTime(gR, t, 0.02);
                }

                panAnimId = requestAnimationFrame(tick);
            };

            panAnimId = requestAnimationFrame(tick);
        }

        function updatePanUI() {
            const rate = getPanRateHz();
            const rateEl = document.getElementById("panRateVal");
            if (rateEl) rateEl.textContent = `rate: ${rate.toFixed(2)} Hz`;

            const dEl = document.getElementById("panDepthVal");
            if (dEl) dEl.textContent = (Number(state.panDepth) || 0).toFixed(2);

            const pEl = document.getElementById("panPhaseVal");
            if (pEl) pEl.textContent = `${Math.round(Number(state.panPhaseDeg) || 0)}°`;
        }


        function updatePhaseDelay(glide = true) {
            if (!delayR || !ctx) return;

            // Convert phase (deg) to time delay (seconds): delay = (phase/360) * period
            // NOTE: This implements a phase *lag* on Right (not a true phase advance).
            const f = Math.max(1e-6, state.baseHz);
            const period = 1 / f;
            const phaseDeg = ((state.phaseDeg % 360) + 360) % 360; // normalize
            const delaySec = (phaseDeg / 360) * period;

            const t0 = now();
            delayR.delayTime.cancelScheduledValues(t0);

            if (glide && state.glideS > 0) {
                // Smooth delay changes to reduce clicks
                delayR.delayTime.setValueAtTime(delayR.delayTime.value, t0);
                delayR.delayTime.linearRampToValueAtTime(delaySec, t0 + state.glideS);
            } else {
                delayR.delayTime.setValueAtTime(delaySec, t0);
            }
        }

        function setGate(on) {
            if (!gateGain) return;
            const t0 = now();
            gateGain.gain.cancelScheduledValues(t0);
            gateGain.gain.setValueAtTime(gateGain.gain.value, t0);
            gateGain.gain.linearRampToValueAtTime(on ? 1.0 : 0.0, t0 + 0.02);
        }

        
        async function start() {
            if (state.running) return;

            ctx = new (window.AudioContext || window.webkitAudioContext)();

            // --- Master / output chain ---
            masterGain = ctx.createGain();
            masterGain.gain.value = state.masterVol;

            gateGain = ctx.createGain();
            gateGain.gain.value = 0.0; // off until a key is pressed

            // --- Source generator ---
        gen = window.createSineGenerator(ctx, state, now, {
            setParamSmooth,
            updatePhaseDelay,
        });

            // EN: Keep legacy globals pointing to generator internals for compatibility.
            delayR = gen.delayR;
            oscL = gen._oscL;
            oscR = gen._oscR;
            gainL = null;
            gainR = null;
            merger = gen.merger;

            gen.merger.connect(masterGain);

            // --- Master autopan (rate follows beat/2) ---
            panSplitter = ctx.createChannelSplitter(2);
            panGainL = ctx.createGain();
            panGainR = ctx.createGain();
            panMerger = ctx.createChannelMerger(2);

            // EN: Default center pan (equal L/R).
            panGainL.gain.value = 0.5;
            panGainR.gain.value = 0.5;

            masterGain.connect(panSplitter);
            panSplitter.connect(panGainL, 0);
            panSplitter.connect(panGainR, 1);

            panGainL.connect(panMerger, 0, 0);
            panGainR.connect(panMerger, 0, 1);

            panMerger.connect(gateGain);
            gateGain.connect(ctx.destination);

            // EN: Prepare a recording tap from the final master bus (post-gate, post-pan).
            recDest = ctx.createMediaStreamDestination();
            gateGain.connect(recDest);

            // Start at current base frequency without glide
            updateFrequencies(false);

            gen.start();

            state.running = true;
            updatePanUI();
            startPanLFO();
        }


        
        function stop() {
            if (!state.running) return;

            stopPanLFO();

            const t0 = now();
            if (gen) gen.stop(t0);

            ctx.close();

            state.running = false;
            ctx = null;
            gen = null;
        }


        function setBaseHz(hz) {
            state.baseHz = hz; // no clamp

            // Update UI readouts when the base frequency changes (key press).
            if (typeof window.refreshLabels === "function") window.refreshLabels();

            if (state.running) updateFrequencies(true);
        }


        // ---------- Loop recorder / player (manual toggle) ----------
        const loopState = {
            isRecording: false,
            isLooping: false,

            recordStartTime: 0,

            // Events are relative to recordStartTime:
            // { t: seconds, type: 'gateOn'|'gateOff'|'setHz', hz?: number }
            events: [],
            loopDuration: 0,
            hasLoop: false,

            cycleTimerId: null,
            eventTimerIds: []
        };

        function setLoopStatus(mode) {
            // EN: Minimal UI indicator for loop state (idle / recording / looping).
            const el = document.getElementById("loopStatus");
            if (!el) return;

            el.classList.remove("idle", "rec", "loop");

            if (mode === "rec") {
                el.textContent = "REC…";
                el.classList.add("rec");
            } else if (mode === "loop") {
                el.textContent = "LOOPING";
                el.classList.add("loop");
            } else {
                el.textContent = "IDLE";
                el.classList.add("idle");
            }
        }

        function setRecButton(isRecording) {
            // EN: Single Rec button toggles between "Rec loop" and "Stop rec".
            const b = document.getElementById("startBtn");
            if (b) b.textContent = isRecording ? "Stop rec" : "Rec loop";
        }

        function setPlayButton(isLooping) {
            // EN: Single Play button toggles between "Play" and "Stop loop".
            const b = document.getElementById("playBtn");
            if (b) b.textContent = isLooping ? "Stop loop" : "Play loop";
        }

        function clearLoopTimers() {
            if (loopState.cycleTimerId) {
                window.clearTimeout(loopState.cycleTimerId);
                loopState.cycleTimerId = null;
            }
            // EN: Cancel per-event timeouts scheduled within the cycle.
            for (const id of loopState.eventTimerIds) window.clearTimeout(id);
            loopState.eventTimerIds = [];
        }

        function recordEvent(ev) {
            // EN: Record only while explicitly recording and audio context exists.
            if (!loopState.isRecording || !ctx) return;

            const t = ctx.currentTime - loopState.recordStartTime;
            loopState.events.push({ ...ev, t });
        }

        function startRecordingLoop() {
            // EN: Begin a new recording (replaces any existing loop).
            stopLoopPlayback();
            loopState.hasLoop = false;

            loopState.isRecording = true;
            loopState.events = [];
            loopState.loopDuration = 0;

            loopState.recordStartTime = ctx ? ctx.currentTime : 0;

            setLoopStatus("rec");
            setRecButton(true);
            setPlayButton(false); // rec overrides playback UI
        }

        function cancelRecordingLoop() {
            // EN: Abort recording and discard what was captured.
            loopState.isRecording = false;
            loopState.events = [];
            loopState.loopDuration = 0;
            loopState.hasLoop = false;

            setGate(false);
            setLoopStatus("idle");
            setRecButton(false);
            setPlayButton(false);
        }

        function finalizeRecordingLoop() {
            // EN: Stop recording and compute loop duration with a fixed tail silence.
            if (!loopState.isRecording) return;

            loopState.isRecording = false;

            if (!loopState.events.length) {
                setLoopStatus("idle");
                setRecButton(false);
                setPlayButton(false); // EN: No loop captured, keep Play label in default state.
                return;
            }

            // EN: Ensure phrase ends with gateOff so playback won't get stuck ON.
            const last = loopState.events[loopState.events.length - 1];
            if (last.type !== "gateOff") {
                const t = ctx ? (ctx.currentTime - loopState.recordStartTime) : last.t;
                loopState.events.push({ t, type: "gateOff" });
            }

            // EN: Always silence immediately at finalize time.
            setGate(false);

            const lastT = loopState.events[loopState.events.length - 1].t;
            loopState.loopDuration = lastT;
            loopState.hasLoop = true;

            // Not auto-playing by design; Play button starts playback.
            setLoopStatus("idle");
            setRecButton(false);  // EN: Return Rec button label back to "Rec loop" after stopping recording.
            setPlayButton(false); // EN: Ensure Play label is reset (will read "Play loop" after rename).
        }

        async function startLoopPlayback() {
            // EN: Play the recorded loop (if any) until Stop is pressed.
            if (!loopState.hasLoop || !loopState.loopDuration || !loopState.events.length) return;

            if (!state.running) await start();

            loopState.isLooping = true;
            setPlayButton(true);
            setLoopStatus("loop");
            scheduleLoopCycle();
        }

        function scheduleLoopCycle() {
            if (!loopState.isLooping) return;

            clearLoopTimers();

            // EN: Reset gate at cycle start to avoid stuck sound between cycles.
            setGate(false);

            for (const ev of loopState.events) {
                const delayMs = Math.max(0, ev.t * 1000);

                const id = window.setTimeout(() => {
                    if (!loopState.isLooping) return;

                    if (ev.type === "gateOn") {
                        if (Number.isFinite(ev.hz)) setBaseHz(ev.hz);
                        setGate(true);
                    } else if (ev.type === "setHz") {
                        if (Number.isFinite(ev.hz)) setBaseHz(ev.hz);
                    } else if (ev.type === "gateOff") {
                        setGate(false);

                    }
                }, delayMs);

                loopState.eventTimerIds.push(id);
            }

            const cycleMs = Math.max(0, loopState.loopDuration * 1000);
            loopState.cycleTimerId = window.setTimeout(() => {
                scheduleLoopCycle();
            }, cycleMs);
        }

        function stopLoopPlayback() {
            // EN: Stop loop playback; keep the recorded loop for later Play.
            loopState.isLooping = false;
            clearLoopTimers();

            setGate(false);
            setLoopStatus(loopState.isRecording ? "rec" : "idle");
            setPlayButton(false);
        }

        // ---------- UI bindings ----------

    // =========================
    // Realtime recording helpers
    // =========================

    function downloadBlob(blob, filename) {
        // EN: Trigger a client-side download.
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function startBlobRecording() {
        // EN: Start MediaRecorder on the tapped master bus.
        if (!ctx || !recDest) return false;

        recChunks = [];

        // EN: Browser chooses container/codec; typically "audio/webm;codecs=opus".
        mediaRecorder = new MediaRecorder(recDest.stream);

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recChunks.push(e.data);
        };

        mediaRecorder.start();
        return true;
    }

    function stopBlobRecordingAndSave(filenameBase) {
        // EN: Stop MediaRecorder and download the resulting blob.
        return new Promise((resolve) => {
            if (!mediaRecorder) { resolve(false); return; }

            mediaRecorder.onstop = () => {
                const mime = mediaRecorder.mimeType || "audio/webm";
                const blob = new Blob(recChunks, { type: mime });

                // EN: Use a simple extension mapping (webm is common).
                const ext = mime.includes("webm") ? "webm" : (mime.includes("ogg") ? "ogg" : "dat");
                downloadBlob(blob, `${filenameBase}.${ext}`);

                mediaRecorder = null;
                recChunks = [];
                resolve(true);
            };

            mediaRecorder.stop();
        });
    }

    // =========================
    // One-shot loop scheduling
    // =========================

    function scheduleLoopOneShot() {
        // EN: Schedule a single loop cycle (one-shot). Does NOT reschedule itself.
        // EN: Uses the same event list as normal looping playback.
        clearLoopTimers();

        // EN: Reset gate at cycle start to avoid stuck sound at boundaries.
        setGate(false);

        for (const ev of loopState.events) {
            const delayMs = Math.max(0, ev.t * 1000);

            const id = window.setTimeout(() => {
                // EN: One-shot ignores loopState.isLooping; it always runs once.
                if (ev.type === "gateOn") {
                    if (Number.isFinite(ev.hz)) setBaseHz(ev.hz);
                    setGate(true);
                } else if (ev.type === "setHz") {
                    if (Number.isFinite(ev.hz)) setBaseHz(ev.hz);
                } else if (ev.type === "gateOff") {
                    setGate(false);
                }
            }, delayMs);

            loopState.eventTimerIds.push(id);
        }
    }

    async function storeLoopOnce() {
        // EN: Store loop from a STOP state: play one cycle as a monitor, record it, then stop.
        if (!loopState.hasLoop || !loopState.loopDuration || !loopState.events.length) return;

        // EN: Enforce STOP state before starting store (clear any existing looping playback).
        if (loopState.isLooping) stopLoopPlayback();

        if (!state.running) await start();

        const name = window.prompt("Filename for loop recording (no extension):", "loop-1");
        if (!name) return;

        // EN: Prevent re-entry.
        if (isStoring) return;
        isStoring = true;

        // EN: Show temporary status while storing.
        setLoopStatus("loop");
        setPlayButton(true);

        const ok = startBlobRecording();
        if (!ok) {
            isStoring = false;
            setLoopStatus("idle");
            setPlayButton(false);
            return;
        }

        // EN: Schedule exactly one cycle.
        scheduleLoopOneShot();

        const ms = Math.max(0, loopState.loopDuration * 1000);

        // EN: Stop after exactly one cycle (+ tiny margin to catch last ondataavailable).
        window.setTimeout(async () => {
            setGate(false);
            await stopBlobRecordingAndSave(name);

            // Return to STOP state
            setLoopStatus("idle");
            setPlayButton(false);
            isStoring = false;
        }, ms + 50);
    }


        
        // =========================
        // v2.8: Offline WAV Export
        // =========================

        function downloadBlob(blob, filename = "render.wav") {
            // EN: Trigger a client-side download without a server roundtrip.
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function encodeWavFromAudioBuffer(buffer) {
            // EN: Encode an AudioBuffer as 16-bit PCM WAV (RIFF/WAVE).
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const numFrames = buffer.length;

            const bitsPerSample = 16;
            const blockAlign = numChannels * (bitsPerSample / 8);
            const byteRate = sampleRate * blockAlign;
            const dataSize = numFrames * blockAlign;

            const out = new ArrayBuffer(44 + dataSize);
            const view = new DataView(out);

            let o = 0;
            const ws = (s) => { for (let i = 0; i < s.length; i++) view.setUint8(o++, s.charCodeAt(i)); };
            const u32 = (v) => { view.setUint32(o, v, true); o += 4; };
            const u16 = (v) => { view.setUint16(o, v, true); o += 2; };

            ws("RIFF"); u32(36 + dataSize); ws("WAVE");
            ws("fmt "); u32(16); u16(1); u16(numChannels);
            u32(sampleRate); u32(byteRate); u16(blockAlign); u16(bitsPerSample);
            ws("data"); u32(dataSize);

            const chData = Array.from({ length: numChannels }, (_, ch) => buffer.getChannelData(ch));

            for (let i = 0; i < numFrames; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let x = chData[ch][i];
                    x = Math.max(-1, Math.min(1, x));
                    const s = x < 0 ? Math.round(x * 0x8000) : Math.round(x * 0x7fff);
                    view.setInt16(o, s, true);
                    o += 2;
                }
            }

            return new Blob([out], { type: "audio/wav" });
        }

        function scheduleGate(offlineCtx, gateGain, t, on) {
            // EN: Short fade to avoid clicks.
            const v = on ? 1.0 : 0.0;
            gateGain.gain.setValueAtTime(gateGain.gain.value, t);
            gateGain.gain.linearRampToValueAtTime(v, t + 0.02);
        }

        function scheduleHz(offlineCtx, oscParam, t, hz, glideS) {
            // EN: Mirror the live glide behavior (linear ramp).
            const g = Math.max(0, Number(glideS) || 0);
            oscParam.cancelScheduledValues(t);
            oscParam.setValueAtTime(oscParam.value, t);
            if (g > 0) oscParam.linearRampToValueAtTime(hz, t + g);
            else oscParam.setValueAtTime(hz, t);
        }

        async function renderOfflineToBuffer({ durationSec = 5, sampleRate = 48000, stateSnapshot, loopSnapshot } = {}) {
            // EN: OfflineAudioContext requires rebuilding the audio graph; you cannot reuse live nodes.
            const channels = 2;
            const length = Math.floor(durationSec * sampleRate);
            const offline = new OfflineAudioContext(channels, length, sampleRate);

            const s = stateSnapshot || { ...state };

            // --- Rebuild the same core topology as the live graph ---
            const delayR = offline.createDelay(0.1);
            delayR.delayTime.value = 0;

            const oscL = offline.createOscillator();
            const oscR = offline.createOscillator();
            oscL.type = "sine";
            oscR.type = "sine";

            const gainL = offline.createGain();
            const gainR = offline.createGain();
            gainL.gain.value = 0.9;
            gainR.gain.value = 0.9;

            const merger = offline.createChannelMerger(2);

            const masterGain = offline.createGain();
            masterGain.gain.value = Number(s.masterVol ?? 0.5);

            const gateGain = offline.createGain();
            gateGain.gain.value = 0.0;

            // Autopan chain (matches live topology: masterGain -> splitter -> panGains -> panMerger -> gateGain)
            const panSplitter = offline.createChannelSplitter(2);
            const panGainL = offline.createGain();
            const panGainR = offline.createGain();
            const panMerger = offline.createChannelMerger(2);

            panGainL.gain.value = 0.5;
            panGainR.gain.value = 0.5;

            oscL.connect(gainL);
            gainL.connect(merger, 0, 0);

            oscR.connect(gainR);
            gainR.connect(delayR);
            delayR.connect(merger, 0, 1);

            merger.connect(masterGain);
            masterGain.connect(panSplitter);

            panSplitter.connect(panGainL, 0);
            panSplitter.connect(panGainR, 1);

            panGainL.connect(panMerger, 0, 0);
            panGainR.connect(panMerger, 0, 1);

            panMerger.connect(gateGain);
            gateGain.connect(offline.destination);

            // --- Initial frequency + optional phase delay ---
            const baseHz = Number(s.baseHz || 27.5);

            if (s.lrMode === "phase") {
                oscL.frequency.value = baseHz;
                oscR.frequency.value = baseHz;

                const phaseDeg = ((Number(s.phaseDeg || 0) % 360) + 360) % 360;
                const delaySec = (phaseDeg / 360) * (1 / Math.max(1e-6, baseHz));
                delayR.delayTime.value = delaySec;
            } else {
                const half = (Number(s.beatHz || 0) * 0.5);
                oscL.frequency.value = Math.max(0.001, baseHz - half);
                oscR.frequency.value = baseHz + half;
                delayR.delayTime.value = 0;
            }

            // --- Offline autopan modulation (optional) ---
            if (s.panEnabled && Number(s.panDepth) > 0) {
                // EN: LFO-based gain modulation in offline mode (deterministic, no RAF).
                const depth = Math.max(0, Math.min(1, Number(s.panDepth) || 0));
                const beat = Math.abs(Number(s.beatHz) || 0);
                const rate = Math.max(0, beat * 0.5); // same idea as live: rate follows beat/2
                const phase = (Number(s.panPhaseDeg) || 0) * Math.PI / 180;

                const lfo = offline.createOscillator();
                lfo.type = "sine";
                lfo.frequency.value = rate;

                const lfoGain = offline.createGain();
                lfoGain.gain.value = 0.5 * depth;

                const baseL = offline.createConstantSource();
                const baseR = offline.createConstantSource();
                baseL.offset.value = 0.5;
                baseR.offset.value = 0.5;

                const inv = offline.createGain();
                inv.gain.value = -1;

                // Phase shift: start LFO at phase by setting initial value via a DelayNode trick is overkill;
                // simplest: rotate by setting an AudioParam at t=0 isn't possible directly.
                // So: approximate by starting LFO normally; phase control is ignored in offline export for now.
                // EN: Phase offset is not applied in offline export to keep the implementation minimal.

                lfo.connect(lfoGain);
                lfoGain.connect(panGainL.gain);
                lfoGain.connect(inv);
                inv.connect(panGainR.gain);

                baseL.connect(panGainL.gain);
                baseR.connect(panGainR.gain);

                baseL.start(0);
                baseR.start(0);
                lfo.start(0);
            } else {
                // Center
                panGainL.gain.setValueAtTime(0.5, 0);
                panGainR.gain.setValueAtTime(0.5, 0);
            }

            // --- Schedule loop events if provided, else gate ON for full duration ---
            if (loopSnapshot && Array.isArray(loopSnapshot.events) && loopSnapshot.events.length) {
                gateGain.gain.setValueAtTime(0.0, 0);

                for (const ev of loopSnapshot.events) {
                    const t = Math.max(0, Number(ev.t) || 0);
                    if (t > durationSec) continue;

                    if (ev.type === "gateOn") scheduleGate(offline, gateGain, t, true);
                    if (ev.type === "gateOff") scheduleGate(offline, gateGain, t, false);

                    if (ev.type === "setHz" && typeof ev.hz === "number") {
                        const hz = Math.max(0.001, ev.hz);
                        // In beat mode we treat baseHz as "center" and split +/- beat/2 (as in live code).
                        if (s.lrMode === "phase") {
                            scheduleHz(offline, oscL.frequency, t, hz, s.glideS);
                            scheduleHz(offline, oscR.frequency, t, hz, s.glideS);
                            // keep delayR consistent with phase at *this* hz
                            const phaseDeg = ((Number(s.phaseDeg || 0) % 360) + 360) % 360;
                            const delaySec = (phaseDeg / 360) * (1 / Math.max(1e-6, hz));
                            delayR.delayTime.setValueAtTime(delaySec, t);
                        } else {
                            const half = (Number(s.beatHz || 0) * 0.5);
                            scheduleHz(offline, oscL.frequency, t, Math.max(0.001, hz - half), s.glideS);
                            scheduleHz(offline, oscR.frequency, t, hz + half, s.glideS);
                            delayR.delayTime.setValueAtTime(0, t);
                        }
                    }
                }
            } else {
                // EN: No loop snapshot: export a steady tone with gate open.
                gateGain.gain.setValueAtTime(1.0, 0.01);
            }

            oscL.start(0);
            oscR.start(0);
            oscL.stop(durationSec);
            oscR.stop(durationSec);

            return await offline.startRendering();
        }

        async function renderAndSaveWav({ durationSec = 5, sampleRate = 48000, stateSnapshot, loopSnapshot, filename = "render.wav" } = {}) {
            const buffer = await renderOfflineToBuffer({ durationSec, sampleRate, stateSnapshot, loopSnapshot });
            const wavBlob = encodeWavFromAudioBuffer(buffer);
            downloadBlob(wavBlob, filename);
        }

function bindUI() {

        }
         else {

                }
            updatePanUI(); // Update pan readouts regardless of mode.

                if (state.running) {

});

            phaseDeg.addEventListener("input", () => {

            $("startBtn").addEventListener("click", async () => {

        $("storeBtn").addEventListener("click", async () => {
            // EN: Store a single-cycle render of the loop to a downloadable blob.

        $("wavBtn").addEventListener("click", async () => {
            // EN: Offline render + WAV encode + download based on the current UI state (and optional loop events).
            const durationSec = (loopState.hasLoop && loopState.loopDuration) ? loopState.loopDuration : 5;
            const snapState = { ...state };

        bindUI();

        // ---------- Virtual piano (A=440, equal temperament) ----------
        const A0 = 27.5;
        const SEMITONE = Math.pow(2, 1 / 12);

        function hzForSemitoneFromA0(n) {
            return A0 * Math.pow(SEMITONE, n);
        }

        // White keys: A B C D E F G (in this register: A0 B0 C1 D1 E1 F1 G1)
        const whiteKeys = [
            { note: "A0", n: 0 },
            { note: "B0", n: 2 },
            { note: "C1", n: 3 },
            { note: "D1", n: 5 },
            { note: "E1", n: 7 },
            { note: "F1", n: 8 },
            { note: "G1", n: 10 },
            { note: "A1", n: 12 }
        ];

        // Black keys positions (between whites): A# C# D# F# G#
        // Each has an anchor index referencing the left white key column.
        const blackKeys = [
            { note: "A#0", n: 1, leftWhiteIndex: 0 },
            { note: "C#1", n: 4, leftWhiteIndex: 2 },
            { note: "D#1", n: 6, leftWhiteIndex: 3 },
            { note: "F#1", n: 9, leftWhiteIndex: 5 },
            { note: "G#1", n: 11, leftWhiteIndex: 6 }
        ];

    let resizeBound = false;
    let resizeRaf = 0;

        function buildPiano() {
            const piano = document.getElementById("piano");
            piano.innerHTML = "";

            // Add white keys as grid children
            for (const wk of whiteKeys) {
                const hz = hzForSemitoneFromA0(wk.n);

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "whiteKey";
                btn.dataset.hz = String(hz);
                btn.dataset.note = wk.note;

                const footer = document.createElement("div");
                footer.className = "footer";
                footer.innerHTML = `<span>${wk.note}</span><span class="hz">${hz.toFixed(2)} Hz</span>`;
                btn.appendChild(footer);

                attachKeyHandlers(btn, hz);

                piano.appendChild(btn);
            }

            // Add black keys as absolute positioned elements
            // Compute width per white key based on container width (after layout).
            requestAnimationFrame(() => {
                const rect = piano.getBoundingClientRect();
                const whiteW = rect.width / 8;

                // Mustan koskettimen leveys suhteessa whiteW:hen.
                // Pidä tämä linjassa CSS:n 0.48 kanssa.
                const blackW = whiteW * 0.48;

                for (const bk of blackKeys) {
                    const hz = hzForSemitoneFromA0(bk.n);

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "blackKey";
                    btn.dataset.hz = String(hz);
                    btn.dataset.note = bk.note;

                    // Center black key between two white keys:
                    // boundary at (leftWhiteIndex + 1) * whiteW, then shift left by half black width.
                    // Clamp black-key x so it never overflows the piano container
                    let left = (bk.leftWhiteIndex + 1) * whiteW - (blackW / 2);
                    left = Math.max(0, Math.min(left, rect.width - blackW));

                    btn.style.left = `${left}px`;
                    btn.style.width = `${blackW}px`;


                    const label = document.createElement("div");
                    label.className = "label";
                    label.innerHTML = `<span>${bk.note}</span><span class="hz">${hz.toFixed(2)} Hz</span>`;
                    btn.appendChild(label);

                    attachKeyHandlers(btn, hz);
                    piano.appendChild(btn);
                }
            });

            // Rebuild on resize to keep black-key positions accurate
            if (!resizeBound) {
                resizeBound = true;
                window.addEventListener("resize", () => {
                    cancelAnimationFrame(resizeRaf);
                    resizeRaf = requestAnimationFrame(() => buildPiano());
                }, { passive: true });
            }
        }

        // Pointer tracking: allow "slide to another key" by moving finger
        let activePointerId = null;
        let activeEl = null;

        function attachKeyHandlers(el, hz) {
            const down = async (e) => {
                e.preventDefault();

                if (activePointerId !== null && activePointerId !== e.pointerId) return;

                activePointerId = e.pointerId;
                activeEl = el;
                el.classList.add("active");

                if (!state.running) await start();

                setBaseHz(hz);
                setGate(true);

                // EN: Record note start.
                recordEvent({ type: "gateOn", hz });

                try { el.setPointerCapture(e.pointerId); } catch (_) { }
            };

            const up = (e) => {
                e.preventDefault();
                if (activePointerId !== e.pointerId) return;

                if (activeEl) activeEl.classList.remove("active");
                activeEl = null;
                activePointerId = null;

                setGate(false);

                // EN: Record note end.
                recordEvent({ type: "gateOff" });
            };

            const move = (e) => {
                if (activePointerId !== e.pointerId) return;

                // Hit-test under finger; switch key if different
                const x = e.clientX;
                const y = e.clientY;
                const under = document.elementFromPoint(x, y);

                if (!under) return;

                const keyEl = under.classList?.contains("whiteKey") || under.classList?.contains("blackKey")
                    ? under
                    : under.closest?.(".whiteKey, .blackKey");

                if (!keyEl || keyEl === activeEl) return;

                const newHz = Number(keyEl.dataset.hz);
                if (!Number.isFinite(newHz)) return;

                if (activeEl) activeEl.classList.remove("active");
                activeEl = keyEl;
                activeEl.classList.add("active");

                setBaseHz(newHz); // glide happens here

                // EN: Record pitch change while gate is held (monophonic slide).
                recordEvent({ type: "setHz", hz: newHz });
            };

            el.addEventListener("pointerdown", down, { passive: false });
            el.addEventListener("pointerup", up, { passive: false });
            el.addEventListener("pointercancel", up, { passive: false });
            el.addEventListener("pointermove", move, { passive: false });
            el.addEventListener("pointerleave", (e) => {
                // If pointer capture is active, we still get moves; ignore leave.
                // If not captured, releasing outside should stop sound.
                if (activePointerId === null) return;
            }, { passive: true });
        }

        buildPiano();
    </script>
