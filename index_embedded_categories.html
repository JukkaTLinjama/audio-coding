<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiments with Web Coding 2026-5</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #ababb3;
        --muted: #9aa0aa;
        --accent: #6ae3c4;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 2rem;
    }

    .site-header {
        margin-bottom: 2.5rem;
        max-width: 760px;
    }

    .site-header h1 {
        margin: 0;
        font-size: clamp(2.1rem, 6vw, 4.6rem);
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 0.95;
        color: #f0f2f5;
    }

    .site-subtitle {
        margin-top: 0.9rem;
        font-size: clamp(1rem, 2vw, 1.2rem);
        color: var(--muted);
        line-height: 1.5;
        max-width: 620px;
    }

    .demo-section {
        margin-top: 2.5rem;
    }

    .section-header {
        margin-bottom: 1rem;
        max-width: 720px;
    }

    .section-header h2 {
        margin: 0;
        font-size: 1.35rem;
        color: #f0f2f5;
        letter-spacing: -0.025em;
    }

    .section-header p {
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .demo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
    }

    /* Demo card layout: thumbnail on the left, text on the right */
    .demo-card {
        background: var(--card);
        border-radius: 10px;
        padding: 1rem;
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 1rem;
        align-items: start;
    }

    /* Clickable thumbnail image (left column) */
    .demo-thumb-link {
        display: block;
        border-radius: 6px;
        overflow: hidden;
    }

    .demo-thumb {
        display: block;
        width: 120px;
        height: auto;
        border-radius: 6px;
        object-fit: cover;
        transition: transform 160ms ease, opacity 160ms ease;
    }

    .demo-thumb-link:hover .demo-thumb {
        transform: scale(1.03);
        opacity: 0.9;
    }

    /* Right column wrapper for title + description */
    .demo-content {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }

    .demo-card a {
        color: var(--accent);
        font-size: 1.05rem;
        text-decoration: none;
    }

    .demo-card a:hover {
        text-decoration: underline;
    }

    .demo-desc {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.4;
    }

    .show-more-button {
        margin-top: 1.1rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(106, 227, 196, 0.35);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        font-size: 0.95rem;
        cursor: pointer;
    }

    .show-more-button:hover {
        background: rgba(106, 227, 196, 0.08);
    }

    .site-footer {
        margin-top: 40px;
        padding: 12px 16px;
        font-size: 10px;
        color: #888;
        text-align: center;
    }

    .footer-inner {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    @media (max-width: 520px) {
        body {
            padding: 1.2rem;
        }

        .demo-card {
            grid-template-columns: 96px 1fr;
        }

        .demo-thumb {
            width: 96px;
        }
    }
</style>

</head>

<body>
    <header class="site-header">
        <h1>Experiments with Web Coding</h1>
        <p class="site-subtitle">
            Audio, vibroacoustic and visual interaction prototypes built with browser technologies.
        </p>
    </header>

    <div id="demo-list"></div>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>© 2026 Jukka Linjama</span>
            <span>•</span>
            <span>License: MIT</span>
        </div>
    </footer>

<script>
    // Demo data is embedded directly in this file to avoid fetch/path/cache issues.
    // To add a new demo, copy one object inside demoData.demos and edit the fields.
    const demoData = {
    "title": "Audio Coding Demos",
    "demos": [
        {
            "id": "fish school v11",
            "title": "simulation of fish school v11",
            "path": "./parvisimul/kalat-v11.3.html",
            "thumb": "assets/Fish-v5.png",
            "status": "WIP",
            "description": "fish simul v. sim speed control & fish 0 kiss.",
            "tags": [
                "3D",
                "simulation",
                "swarmn behavior"
            ],
            "category": "visual"
        },
        {
            "id": "vibro-keyboard-3",
            "title": "Vibroacoustic keyboard v3",
            "path": "./Vibroacoustic/vibro-keyboard-v2.9.html",
            "thumb": "assets/vibro-keyboard-2.4.png",
            "status": "WIP",
            "description": "Experimental vibroacoustic keyboard. Low-frequency tones and beating for tactile perception. Added looping rec/play functionality.",
            "tags": [
                "vibrotactile",
                "lf",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "bubble gen",
            "title": "Bubble generator v6",
            "path": "./Vibroacoustic/test-generators/path-generator-v6.html",
            "thumb": "assets/bubble-gen-v6.png",
            "status": "WIP",
            "description": "Bubble sound generator w API. Simulates bubble formation and bursting with adjustable parameters for size, frequency, and intensity.",
            "tags": [
                "bubble sound synthesis",
                "granular synthesis",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "loop gen v2.5",
            "title": "Loop gen v2.5",
            "path": "./Vibroacoustic/test-generators/path-generator-v2.5.2-granular-gpl-overlap.html",
            "thumb": "assets/Path-loop-gen-2.1.png",
            "status": "WIP",
            "description": "Sound is treated as a 1D observation of a higher-dimensional geometric system.",
            "tags": [
                "visualisation",
                "web-audio"
            ],
            "category": "audio"
        },
        {
            "id": "timescales visualisation 2025",
            "title": "History timescale visualisation v50.2",
            "path": "https://jukkatlinjama.github.io/timescale_dev/",
            "thumb": "assets/timeline_v49.9.png",
            "status": "WIP",
            "description": "A vertical, zoomable logarithmic timeline of key events from the Big Bang to the present (2026).",
            "tags": [
                "visualisation",
                "history event themes",
                "json database"
            ],
            "category": "visual"
        }
    ]
};

    const categories = [
        {
            id: 'visual',
            title: 'Visual Interaction',
            description: 'Interactive visual experiments, simulations and interface prototypes.'
        },
        {
            id: 'audio',
            title: 'Audio Interaction',
            description: 'Web Audio, vibroacoustic and sound interaction experiments.'
        }
    ];

    function createDemoCard(demo) {
        const li = document.createElement('li');
        li.className = 'demo-card';

        // Render one demo card.
        // - Thumbnail is optional and links to the same demo as the title
        // - Text content is grouped on the right for consistent layout
        li.innerHTML = `
            ${demo.thumb ? `
            <a class="demo-thumb-link" href="${demo.path}" target="_blank" aria-label="Open ${demo.title}">
                <img
                    class="demo-thumb"
                    src="${demo.thumb}"
                    alt="${demo.title} screenshot"
                >
            </a>
            ` : ''}

            <div class="demo-content">
                <a href="${demo.path}" target="_blank">${demo.title}</a>

                <div class="demo-desc">
                    <strong>${demo.status}</strong><br>
                    ${demo.description}
                </div>
            </div>
        `;

        return li;
    }

    function renderCategory(list, category, demos) {
        const categoryDemos = demos.filter(demo => demo.category === category.id);

        if (categoryDemos.length === 0) return;

        const section = document.createElement('section');
        section.className = 'demo-section';

        section.innerHTML = `
            <div class="section-header">
                <h2>${category.title}</h2>
                <p>${category.description}</p>
            </div>
        `;

        const ul = document.createElement('ul');
        ul.className = 'demo-list';

        const visibleDemos = categoryDemos.slice(0, 1);
        const hiddenDemos = categoryDemos.slice(1);

        visibleDemos.forEach(demo => {
            ul.appendChild(createDemoCard(demo));
        });

        section.appendChild(ul);

        if (hiddenDemos.length > 0) {
            const button = document.createElement('button');
            button.className = 'show-more-button';
            button.textContent = `Show more (${hiddenDemos.length})`;

            button.addEventListener('click', () => {
                hiddenDemos.forEach(demo => {
                    ul.appendChild(createDemoCard(demo));
                });

                button.remove();
            });

            section.appendChild(button);
        }

        list.appendChild(section);
    }

    function loadDemos() {
        const list = document.getElementById('demo-list');

        categories.forEach(category => {
            renderCategory(list, category, demoData.demos);
        });
    }

    loadDemos();
</script>
</body>

</html>
